            {addLocationError && <p style={styles.errorText}>{addLocationError}</p>}
          </form>

          <p style={styles.onboardingDivider}>or tap the map</p>

          <LocationsMap
            locations={[]}
            activeLocationId={null}
            onSelect={() => {}}
            onMapClick={addLocationFromLatLng}
            addPin={mapPin}
          />
          {mapAddStatus === "locating" && (
            <p style={{ ...styles.suggestLabel, marginTop: 10 }}>Adding that spot{"…"}</p>
          )}
          {mapAddError && <p style={{ ...styles.errorText, marginTop: 10, marginBottom: 0 }}>{mapAddError}</p>}
        </div>
      </div>
    );
  }

  return (
    <div>
      {toast && (
        <div style={styles.toast}>
          <span style={styles.toastAccent} />
          <span>{toast}</span>
        </div>
      )}

      <header style={styles.header}>
        <div>
          <p style={styles.eyebrow}>{"FIELD LOG · " + activeLocation.name.toUpperCase()}</p>
          <h1 className="ffont" style={styles.title}>Backyard Species Log</h1>
        </div>
        <div style={styles.headerActions}>
          <button
            type="button"
            style={styles.iconButton}
            onClick={() => setTheme((t) => (t === "light" ? "dark" : "light"))}
            title="Toggle dark mode"
            aria-label="Toggle dark mode"
          >
            {theme === "light" ? <MoonIcon /> : <SunIcon />}
          </button>
          <label style={{ ...styles.iconButton, borderColor: "#2B7A9455", color: "#1F5F73" }}>
            Import
            <input type="file" accept="application/json" onChange={handleImport} style={{ display: "none" }} />
          </label>
          <div style={{ position: "relative" }}>
            <button type="button" style={styles.primaryButton} onClick={() => setExportOpen((o) => !o)}>
              Export {"▾"}
            </button>
            {exportOpen && (
              <div style={styles.exportMenu}>
                <button type="button" style={styles.exportMenuItem} onClick={() => { exportJSON(); setExportOpen(false); }}>Export as JSON</button>
                <button type="button" style={styles.exportMenuItem} onClick={() => { exportCSV(); setExportOpen(false); }}>Export as CSV</button>
              </div>
            )}
          </div>
        </div>
      </header>
      {importError && <p style={styles.errorText}>{importError}</p>}
      {storageError && <p style={styles.errorText}>{storageError}</p>}

      {/* The one thing standing between a signed-out iPhone user and a wiped
          log is either an account or a home-screen install, and both used to be
          three taps deep inside a tab labelled "Account". */}
      {!safetyDismissed && !user && liveEntries.length >= 3 && (
        <div style={styles.safetyBanner}>
          <span style={styles.safetyGlyph} aria-hidden="true">🛟</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={styles.safetyTitle}>
              {liveEntries.length} sightings, saved only on this device
            </p>
            <p style={styles.safetyText}>
              {isIos() && !isInstalled()
                ? "iOS clears a site's storage after a week without a visit. Add this to your home screen (Share → Add to Home Screen), or make an account so it's backed up."
                : "Make an account and your log follows you to other devices — or export a backup from the Account tab."}
            </p>
          </div>
          <button
            type="button"
            style={styles.safetyAction}
            onClick={() => { setTab("account"); setAccountView("profile"); }}
          >
            Make an account
          </button>
          <button
            type="button"
            style={styles.iconButton}
            onClick={() => {
              setSafetyDismissed(true);
              try { localStorage.setItem(STORAGE_KEYS.safetyBanner, JSON.stringify(true)); } catch (err) { /* ignore */ }
            }}
            aria-label="Dismiss this reminder"
          >
            Not now
          </button>
        </div>
      )}

      {/* The headline number is the life list — every species you've logged
          anywhere, ever. It used to be the count for whichever location you
          happened to be on, so adding a second place made it look like your
          progress had been wiped. The patch count lives underneath, where it
          reads as detail rather than as the score. */}
      <div style={styles.statsRow}>
        <StatCard
          label="Life list"
          value={lifeList.uniqueSpecies}
          accent="#2B7A94"
          icon={<MedalIcon size={20} />}
          progress={nextMilestone ? nextMilestone.progress : 1}
          progressLabel={nextMilestone ? (nextMilestone.target - lifeList.uniqueSpecies) + " to " + nextMilestone.target : "Every milestone earned"}
        />
        <StatCard label="Total sightings" value={lifeList.totalSightings} accent="#B5651D" icon={<BinocularsIcon size={20} />} />
      </div>

      <div style={styles.patchLine}>
        <span>
          <strong className="mfont">{stats.uniqueSpecies}</strong> species and{" "}
          <strong className="mfont">{stats.totalSightings}</strong> sighting{stats.totalSightings === 1 ? "" : "s"} at {activeLocation.name}
        </span>
        {seasonProgress && (
          <span style={styles.patchLineSeason}>
            <strong className="mfont">{seasonProgress.found}</strong> of the{" "}
            <strong className="mfont">{seasonProgress.total}</strong> species common here in {MONTH_NAMES[currentMonth - 1]}
          </span>
        )}
      </div>

      <div style={styles.badgeRow} title="Life list milestones">
        {MILESTONES.map((m) => {
          const earned = lifeList.uniqueSpecies >= m;
          return <span key={m} style={{ ...styles.badgePill, ...(earned ? styles.badgePillEarned : {}) }}>{m}</span>;
        })}
      </div>

      <nav className="tabs-nav" style={styles.tabs} role="tablist" aria-label="Main sections">
        <TabButton label="Log" active={tab === "log"} onClick={() => setTab("log")} accent="var(--accent)" panelId="panel-log" />
        <TabButton label="Species" active={tab === "species"} onClick={() => setTab("species")} accent="#2B7A94" panelId="panel-species" />
        <TabButton label="Location" active={tab === "location"} onClick={() => setTab("location")} accent="#1F8A68" panelId="panel-location" />
        <TabButton label="Insights" active={tab === "insights"} onClick={() => setTab("insights")} accent="#B5651D" panelId="panel-insights" />
        <TabButton label="Account" active={tab === "account"} onClick={() => setTab("account")} accent="#54606B" badge={hasNotifications} panelId="panel-account" />
      </nav>

      {locations.length > 1 && !previewLocation && (tab === "log" || (tab === "species" && speciesView !== "guide") || tab === "insights" || tab === "account") && (
        <div style={styles.locationSwitchBar}>
          <span>Logging for</span>
          <select
            style={styles.locationSwitchSelect}
            value={activeLocationId}
            onChange={(e) => setActiveLocationId(e.target.value)}
          >
            {locations.map((loc) => <option key={loc.id} value={loc.id}>{loc.name}</option>)}
          </select>
        </div>
      )}

      {tab === "log" && (
        <div id="panel-log" role="tabpanel" tabIndex={0} aria-labelledby="panel-log-tab">
          <div style={styles.card}>
            <button style={styles.formToggle} onClick={() => setShowForm((s) => !s)}>
              <span className="ffont" style={{ fontSize: 17 }}>+ Log a sighting</span>
              <span style={{ marginLeft: "auto" }}>{showForm ? "−" : "+"}</span>
            </button>
            {showForm && (
              <form onSubmit={addEntry} style={styles.form}>
                <div style={styles.formGrid}>
                  <Field label="Species">
                    <input style={styles.input} placeholder="e.g. Carolina wren" value={form.species}
                      onChange={(e) => updateForm("species", e.target.value)} required />
                  </Field>
                  <Field label="Category">
                    <select style={styles.input} value={form.category} onChange={(e) => updateForm("category", e.target.value)}>
                      {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.glyph} {c.label}</option>)}
                    </select>
                  </Field>
                  <Field label="Date">
                    <input type="date" style={styles.input} value={form.date} onChange={(e) => updateForm("date", e.target.value)} />
                  </Field>
                  {/* Dawn and dusk are half of what makes a wildlife record
                      worth keeping, and this is a form people are already
                      filling in. */}
                  <Field label="Time (optional)">
                    <input type="time" style={styles.input} value={form.time} onChange={(e) => updateForm("time", e.target.value)} />
                  </Field>
                  <Field label="Quantity">
                    <input type="number" min="1" style={styles.input} value={form.quantity} onChange={(e) => updateForm("quantity", e.target.value)} />
                  </Field>
                  <Field label="Location on property">
                    <input style={styles.input} placeholder="e.g. back fence, garden bed" list="location-suggestions"
                      value={form.location} onChange={(e) => updateForm("location", e.target.value)} />
                    <datalist id="location-suggestions">
                      {spotTags.map((l) => <option key={l} value={l} />)}
                    </datalist>
                  </Field>
                </div>
                {locationStatus[activeLocationId] === "loading" && (
                  <p style={styles.suggestLabel}>Loading species suggestions for {activeLocation.name}{"…"}</p>
                )}
                {locationStatus[activeLocationId] === "error" && (
                  <p style={styles.errorText}>
                    Couldn't load suggestions for this location.{" "}
                    <button type="button" style={styles.retryLink} onClick={() => retryLocationSpecies(activeLocation)}>Retry</button>
                  </p>
                )}
                {(speciesForActive[form.category] || []).length > 0 && (
                  <div style={styles.suggestWrap}>
                    <span style={styles.suggestLabel}>Common in {activeLocation.name} {"—"} tap the i to preview:</span>
                    <div style={styles.chipRow}>
                      {speciesForActive[form.category].map((name) => {
                        const active = form.species === name;
                        const c = catMeta(form.category).color;
                        return (
                          <div
                            key={name}
                            style={{ position: "relative", display: "inline-flex", alignItems: "center", gap: 4 }}
                            onMouseEnter={() => setPreviewSpecies(name)}
                            onMouseLeave={() => setPreviewSpecies((h) => (h === name ? null : h))}
                          >
                            <button
                              type="button"
                              style={{
                                ...styles.chip,
                                borderColor: c + "50",
                                color: active ? "#FFFFFF" : c,
                                background: active ? c : c + "14",
                              }}
                              onClick={() => updateForm("species", name)}
                            >
                              {name}
                            </button>
                            <button
                              type="button"
                              style={{ ...styles.miniInfoButton, borderColor: c + "70", color: c }}
                              onClick={() => setPreviewSpecies((p) => (p === name ? null : name))}
                              aria-label={"Preview " + name}
                              title={"Preview " + name}
                            >i</button>
                            {previewSpecies === name && <SpeciesHoverPopup name={name} categoryId={form.category} />}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
                <div style={styles.formGrid}>
                  <Field label="Note (optional)">
                    <input style={styles.input} placeholder="What it looked like, behavior, etc." value={form.note}
                      onChange={(e) => updateForm("note", e.target.value)} />
                  </Field>
                  <Field label="Photo (optional)">
                    <input type="file" accept="image/*" style={styles.input} onChange={handlePhotoChange} />
                  </Field>
                </div>
                {photoError && <p style={styles.errorText}>{photoError}</p>}
                {form.photo && (
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
                    <img src={form.photo} alt="Sighting preview" style={styles.photoPreview} />
                    <button type="button" style={styles.retryLink} onClick={() => updateForm("photo", "")}>Remove photo</button>
                  </div>
                )}

                {/* An explicit button rather than a silent capture on every
                    save — a coordinate makes the record much more useful, but
                    not at the cost of prompting for location every time
                    someone types a species name. */}
                <div style={styles.pinSpotRow}>
                  <button type="button" style={styles.iconButton} onClick={pinSightingSpot} disabled={formGeoStatus === "locating"}>
                    <PinIcon size={14} />
                    {formGeoStatus === "locating" ? "Getting a fix…" : form.lat != null ? "Update this spot" : "Pin this exact spot"}
                  </button>
                  {form.lat != null && (
                    <span className="mfont" style={styles.pinSpotCoords}>
                      {Number(form.lat).toFixed(4)}, {Number(form.lon).toFixed(4)}
                      <button type="button" style={styles.retryLink} onClick={() => { updateForm("lat", null); updateForm("lon", null); setFormGeoStatus(""); }}>clear</button>
                    </span>
                  )}
                  {formGeoStatus === "error" && <span style={styles.pinSpotCoords}>Couldn't get a fix.</span>}
                  {formGeoStatus === "unsupported" && <span style={styles.pinSpotCoords}>This browser has no location support.</span>}
                </div>

                <button type="submit" style={styles.primaryButtonWide} disabled={addingEntry}>
                  {addingEntry ? "Saving…" : "+ Add sighting"}
                </button>
              </form>
            )}
          </div>

          <div style={styles.filterBar}>
            <div style={styles.searchBox}>
              <input style={styles.searchInput} placeholder="Search species..." value={search} onChange={(e) => setSearch(e.target.value)} />
            </div>
            <select style={styles.filterSelect} value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}>
              <option value="all">All categories</option>
              {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
            </select>
            <select style={styles.filterSelect} value={filterLocation} onChange={(e) => setFilterLocation(e.target.value)}>
              <option value="all">All spots</option>
              {spotTags.map((l) => <option key={l} value={l}>{l}</option>)}
            </select>
            <input type="date" style={styles.filterSelect} value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} title="From date" />
            <input type="date" style={styles.filterSelect} value={dateTo} onChange={(e) => setDateTo(e.target.value)} title="To date" />
          </div>

          <div style={styles.entryList}>
            {filtered.length === 0 && (
              liveEntries.length === 0 ? (
                <div style={styles.guideEmptyFiltered}>
                  <span style={{ fontSize: 40, display: "block", marginBottom: 8 }}>🌱</span>
                  <p style={{ margin: "0 0 2px", fontWeight: 700, color: "var(--text)" }}>Your log is empty — for now.</p>
                  <p style={{ margin: 0 }}>Add your first sighting above and this is where it'll land.</p>
                </div>
              ) : (
                <div style={styles.guideEmptyFiltered}>
                  <span style={{ fontSize: 36, display: "block", marginBottom: 8 }}>🍂</span>
                  No sightings match these filters.
                </div>
              )
            )}
            {filtered.map((e) => {
              const meta = catMeta(e.category);
              return (
                <div key={e.id} style={{ ...styles.entryRow, borderLeft: "4px solid " + meta.color }}>
                  <div style={{ ...styles.entryIcon, background: (e.hasPhoto || e.photo) ? "transparent" : meta.color + "1F", padding: (e.hasPhoto || e.photo) ? 0 : undefined, overflow: "hidden" }}>
                    {(e.hasPhoto || e.photo) ? (
                      <EntryPhoto
                        entryId={e.id}
                        uid={user ? user.uid : null}
                        inline={e.photo || null}
                        alt={e.species}
                        style={styles.entryPhoto}
                        fallback={<CategoryIcon id={e.category} color={meta.color} size={18} />}
                      />
                    ) : (
                      <CategoryIcon id={e.category} color={meta.color} size={18} />
                    )}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={styles.entryTop}>
                      <span className="ffont" style={styles.entrySpecies}>{e.species}</span>
                      <span style={styles.entryQty}>x{e.quantity}</span>
                    </div>
                    <div style={styles.entryMeta}>
                      <span>{e.date}{e.time ? " · " + e.time : ""}</span>
                      {e.location && <span>· {e.location}</span>}
                      {e.lat != null && (
                        <span title={Number(e.lat).toFixed(5) + ", " + Number(e.lon).toFixed(5)} aria-label="This sighting has coordinates">
                          · <PinIcon size={11} />
                        </span>
                      )}
                    </div>
                    {e.note && <p style={styles.entryNote}>{e.note}</p>}
                  </div>
                  {user && (
                    <button
                      style={{ ...styles.shareToggle, ...(e.shared ? styles.shareToggleActive : {}) }}
                      onClick={() => toggleShared(e.id)}
                      title={e.shared ? "Shared to your friends' feed — tap to unshare" : "Share this sighting to your friends' feed"}
                      aria-label={e.shared ? "Unshare this sighting" : "Share this sighting with friends"}
                    >
                      {e.shared ? "Shared" : "Share"}
                    </button>
                  )}
                  <button style={styles.deleteButton} onClick={() => removeEntry(e.id)} title="Remove entry" aria-label="Remove entry">×</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab === "species" && (
        <div id="panel-species" role="tabpanel" tabIndex={0} aria-labelledby="panel-species-tab">
          <div style={styles.authTabRow}>
            <button
              type="button"
              style={{ ...styles.authTabButton, ...(speciesView === "mine" ? styles.authTabButtonActive : {}) }}
              onClick={() => setSpeciesView("mine")}
            >My sightings</button>
            <button
              type="button"
              style={{ ...styles.authTabButton, ...(speciesView === "guide" ? styles.authTabButtonActive : {}) }}
              onClick={() => setSpeciesView("guide")}
            >Field guide</button>
          </div>

          {speciesView === "mine" && (
          <div style={styles.card}>
          {speciesSummary.length === 0 ? (
            <div style={styles.guideEmptyFiltered}>
              <span style={{ fontSize: 36, display: "block", marginBottom: 8 }}>🦔</span>
              No species logged yet — add your first sighting from the Log tab and it'll show up here.
            </div>
          ) : (
            <div>
              <div style={styles.speciesHeaderRow}>
                <span style={{ flex: 2 }}>Species</span>
                <span style={{ flex: 1, textAlign: "right" }}>Sightings</span>
                <span style={{ flex: 1, textAlign: "right" }}>Total seen</span>
                <span style={{ flex: 1.4 }}>First / last seen</span>
                <span style={{ flex: "0 0 28px" }}></span>
              </div>
              {speciesSummary.map((s) => {
                const meta = catMeta(s.category);
                const isOpen = expandedSpecies === s.species;
                return (
                  <div key={s.species}>
                    <div style={styles.speciesRow}>
                      <div style={{ flex: 2, display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                        <CategoryIcon id={s.category} color={meta.color} size={16} />
                        <span className="ffont" style={{ fontSize: 15 }}>{s.species}</span>
                      </div>
                      <span className="mfont" style={{ flex: 1, textAlign: "right", fontSize: 13 }}>{s.sightings}</span>
                      <span className="mfont" style={{ flex: 1, textAlign: "right", fontSize: 13 }}>{s.totalQty}</span>
                      <span style={{ flex: 1.4, fontSize: 12, color: "var(--text-muted)" }}>{s.firstSeen} — {s.lastSeen}</span>
                      <button
                        type="button"
                        style={{ ...styles.infoLink, ...(isOpen ? styles.infoLinkActive : {}) }}
                        onClick={() => setExpandedSpecies(isOpen ? null : s.species)}
                        title="Show species info"
                      >i</button>
                    </div>
                    {isOpen && (
                      <div style={styles.expandedPanel}>
                        <SpeciesInfoCard name={s.species} categoryId={s.category} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          </div>
          )}

          {speciesView === "guide" && (
        <div style={styles.guideWrap}>
          <div style={styles.guideWrapBg} />
          <div style={styles.guideWrapInner}>
            {/* Previewing somewhere you haven't saved. Nothing about the log
                moves while this banner is up. */}
            {previewLocation && (
              <div style={styles.previewBanner}>
                <span style={styles.previewBannerGlyph} aria-hidden="true">{previewLocation.saved ? "📍" : "👀"}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={styles.previewBannerTitle}>
                    {previewLocation.saved ? "Saved — " : "Just looking at "}{previewLocation.name}
                  </p>
                  <p style={styles.previewBannerText}>
                    {previewLocation.saved
                      ? "It's in your locations now. You're still logging at " + activeLocation.name + " — switch from the Location tab when you want to change that."
                      : "You're still logging at " + activeLocation.name + ". Nothing here has been saved."}
                  </p>
                </div>
                {!previewLocation.saved && (
                  <button type="button" style={styles.previewSaveButton} onClick={savePreviewLocation}>Save this place</button>
                )}
                <button type="button" style={styles.iconButton} onClick={() => setPreviewLocation(null)}>
                  Back to {activeLocation.name}
                </button>
              </div>
            )}

            <div style={styles.guideIntro}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={styles.guideIntroGlyph}>🌲</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p className="ffont" style={styles.guideIntroTitle}>Field guide — {guideLocation ? guideLocation.name : ""}</p>
                  <p style={styles.guideIntroText}>
                    {seasonalStatus[seasonKey] === "loading"
                      ? "Working out what's around in " + MONTH_NAMES[guideMonth - 1] + "…"
                      : "What's been reported nearby, so you know what to look (and listen) for."}
                  </p>
                </div>
                {locations.length > 1 && !previewLocation && (
                  <select
                    style={styles.locationSwitchSelect}
                    value={activeLocationId}
                    onChange={(e) => setActiveLocationId(e.target.value)}
                    title="Jump to a saved location"
                    aria-label="Jump to a saved location"
                  >
                    {locations.map((loc) => <option key={loc.id} value={loc.id}>{loc.name}</option>)}
                  </select>
                )}
              </div>

              {/* Browsing no longer saves. Typing a place here used to append it
                  to your locations and switch you onto it, which zeroed every
                  number on the screen. */}
              <form onSubmit={previewGuideLocation} style={styles.guideBrowseForm}>
                <input
                  style={styles.guideBrowseInput}
                  value={newLocationQuery}
                  onChange={(e) => setNewLocationQuery(e.target.value)}
                  placeholder="Look up any city, park, or zip code…"
                  aria-label="Look up a place to browse its field guide"
                />
                <button type="submit" style={styles.guideBrowseButton} disabled={previewStatus === "loading"}>
                  {previewStatus === "loading" ? "Looking…" : "Look up"}
                </button>
                <button
                  type="button"
                  style={styles.currentLocationButton}
                  onClick={previewMyLocation}
                  disabled={previewStatus === "loading"}
                  title="Show the guide for where I am now"
                  aria-label="Show the guide for where I am now"
                >
                  <PinIcon size={15} />
                </button>
              </form>
              {addLocationError && <p style={{ ...styles.errorText, marginTop: 8, marginBottom: 0 }}>{addLocationError}</p>}
            </div>

            {/* The month strip. Sightings are seasonal by nature, which gives
                this app an honest reason to be worth reopening — no streak
                required. */}
            <div style={styles.monthStrip} role="group" aria-label="Browse by month">
              {MONTH_SHORT.map((label, i) => {
                const m = i + 1;
                const active = guideMonth === m;
                const isNow = m === new Date().getMonth() + 1;
                return (
                  <button
                    key={label}
                    type="button"
                    onClick={() => setGuideMonth(m)}
                    aria-pressed={active}
                    title={MONTH_NAMES[i] + (isNow ? " (this month)" : "")}
                    style={{
                      ...styles.monthChip,
                      ...(isNow ? styles.monthChipNow : {}),
                      ...(active ? styles.monthChipActive : {}),
                    }}
                  >
                    {label}
                  </button>
                );
              })}
            </div>

            {locationStatus[guideLocationId] === "loading" && (
              <p style={styles.emptyText}>Loading species for this location{"…"}</p>
            )}
            {locationStatus[guideLocationId] === "error" && (
              <p style={styles.errorText}>
                Couldn't load species for this location.{" "}
                <button type="button" style={styles.retryLink} onClick={() => retryLocationSpecies(guideLocation)}>Retry</button>
              </p>
            )}

            {/* eBird calls this Target Species and it's the best thing in their
                app: what's likely near you that isn't on your list yet. Both
                halves already existed here — this gives the answer its own card
                instead of leaving it behind a filter chip. */}
            {targetSpecies.length > 0 && (
              <div style={styles.targetCard}>
                <div style={styles.targetHead}>
                  <h3 className="ffont" style={styles.targetTitle}>Look for these in {MONTH_NAMES[guideMonth - 1]}</h3>
                  <span style={styles.targetSub}>Common around {guideLocation ? guideLocation.name : "here"}, not yet on your life list</span>
                </div>
                <div style={styles.targetRow}>
                  {targetSpecies.map((t) => {
                    const meta = catMeta(t.categoryId);

              <h3 className="ffont" style={styles.chartTitle}>Activity feed</h3>

              {feedLoading && <p style={styles.emptyText}>Loading…</p>}
              {feedError && <p style={styles.errorText}>{feedError}</p>}
              {!feedLoading && feedEntries.length === 0 && (
                <div style={styles.guideEmptyFiltered}>
                  <span style={{ fontSize: 32, display: "block", marginBottom: 6 }}>🦋</span>
                  Nothing shared yet — check back once a friend shares a sighting.
                </div>
              )}
              {feedEntries.map((post) => {
                const key = post.ownerUid + "_" + post.id;
                const reactions = post.reactions || {};
                const reactionCount = Object.keys(reactions).length;
                const iReacted = user && !!reactions[user.uid];
                const comments = commentsByEntry[key] || [];
                return (
                  <div key={key} style={styles.feedPost}>
                    <div style={styles.feedPostHeader}>
                      <div style={styles.avatarWrapSmall}>
                        {post.ownerAvatar ? <img src={post.ownerAvatar} alt="" style={styles.avatarImg} /> : <span style={styles.avatarPlaceholderSmall}>{post.ownerName.slice(0, 1).toUpperCase()}</span>}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ fontWeight: 700, fontSize: 13.5 }}>{post.ownerName}</span>
                        <span style={{ color: "var(--text-muted)", fontSize: 12.5 }}> spotted <span className="ffont">{post.species}</span></span>
                        <div style={styles.entryMeta}>
                          <span>{post.date}</span>
                          {post.locationName && <span>· {post.locationName}</span>}
                        </div>
                      </div>
                    </div>
                    {post.hasPhoto && (
                      // Reserve the space so the note and buttons below don't
                      // jump when the photo resolves.
                      <div style={styles.feedPhotoSlot}>
                        <FriendPhoto ownerUid={post.ownerUid} entryId={post.id} style={styles.feedPostPhoto} />
                      </div>
                    )}
                    {post.note && <p style={styles.entryNote}>{post.note}</p>}
                    <div style={{ display: "flex", gap: 10, marginTop: 8, alignItems: "center" }}>
                      <button
                        type="button"
                        style={{ ...styles.reactionButton, ...(iReacted ? styles.reactionButtonActive : {}) }}
                        onClick={() => toggleReaction(post)}
                      >
                        🌿 {reactionCount > 0 ? reactionCount : ""}
                      </button>
                      <button type="button" style={styles.retryLink} onClick={() => toggleComments(post)}>
                        {openComments === key ? "Hide comments" : comments.length > 0 || commentsByEntry[key] ? `Comments (${comments.length})` : "Comment"}
                      </button>
                    </div>
                    {openComments === key && (
                      <div style={{ marginTop: 10 }}>
                        {comments.map((c) => (
                          <div key={c.id} style={styles.commentRow}>
                            <strong style={{ fontSize: 12.5 }}>{c.authorName}</strong>{" "}
                            <span style={{ fontSize: 12.5, color: "var(--text-muted)" }}>{c.text}</span>
                          </div>
                        ))}
                        {comments.length === 0 && <p style={styles.emptyText}>No comments yet.</p>}
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                          <input
                            style={styles.input}
                            value={commentDraft}
                            onChange={(e) => setCommentDraft(e.target.value)}
                            placeholder="Add a comment…"
                            maxLength={300}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); postComment(post); } }}
                          />
                          <button type="button" style={styles.iconButton} onClick={() => postComment(post)} disabled={commentBusy || !commentDraft.trim()}>Post</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          </div>
          )}

          {accountView === "data" && (
          <div>
          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Your data</h3>
            <p style={styles.locationNote}>
              {user
                ? "Everything you log — sightings, photos, and saved locations — is saved to this browser and backed up to your account, so it'll follow you if you sign in somewhere else. Export a backup regularly anyway, just in case."
                : "Everything you log — sightings, photos, and saved locations — stays in this browser's storage only for now. Sign in above to back it up to your account and access it from other devices. Export a backup regularly if it matters to you."}
            </p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button type="button" style={styles.iconButton} onClick={exportJSON} disabled={exportBusy}>
                {exportBusy ? "Preparing…" : "Export backup (JSON)"}
              </button>
              <button type="button" style={styles.iconButton} onClick={exportCSV}>Export for spreadsheets (CSV)</button>
            </div>
            <p style={{ ...styles.suggestLabel, marginTop: 10, marginBottom: 0 }}>
              The JSON export includes your photos and can be imported back. CSV is for opening in a spreadsheet — it can't carry photos, so it isn't a backup.
            </p>
            {importReport && (
              <p style={{ ...styles.suggestLabel, marginTop: 8, marginBottom: 0, color: "var(--text)" }}>
                Imported {importReport.added} new sighting{importReport.added === 1 ? "" : "s"}
                {importReport.skipped > 0 ? ", skipped " + importReport.skipped + " already in your log" : ""}.
              </p>
            )}
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Clear sightings by time frame</h3>
            <p style={styles.locationNote}>
              Remove logged sightings for <strong>{activeLocation ? activeLocation.name : "this location"}</strong> within a specific month or year. Locations, photos of other months/years, and app settings are left alone.
            </p>
            <div style={styles.formGrid}>
              <Field label="Time frame">
                <select style={styles.input} value={resetScope} onChange={(e) => setResetScope(e.target.value)}>
                  <option value="month">A specific month</option>
                  <option value="year">A specific year</option>
                  <option value="all">All time, this location</option>
                </select>
              </Field>
              {resetScope === "month" && (
                <Field label="Month">
                  <input type="month" style={styles.input} value={resetMonth} onChange={(e) => setResetMonth(e.target.value)} />
                </Field>
              )}
              {resetScope === "year" && (
                <Field label="Year">
                  <select style={styles.input} value={resetYear} onChange={(e) => setResetYear(e.target.value)}>
                    {availableYears.map((y) => <option key={y} value={y}>{y}</option>)}
                  </select>
                </Field>
              )}
            </div>
            <p style={styles.suggestLabel}>
              {resetPreviewCount} sighting{resetPreviewCount === 1 ? "" : "s"} will be deleted.
            </p>
            <button
              type="button"
              style={{ ...styles.dangerButton, ...(resetPreviewCount === 0 ? styles.dangerButtonDisabled : {}) }}
              disabled={resetPreviewCount === 0}
              onClick={handleScopedReset}
            >
              Delete {resetPreviewCount > 0 ? resetPreviewCount : ""} sighting{resetPreviewCount === 1 ? "" : "s"}
            </button>
          </div>

          <div style={styles.dangerCard}>
            <h3 className="ffont" style={{ ...styles.chartTitle, color: "#A8455F" }}>Danger zone</h3>
            <p style={styles.locationNote}>
              Permanently erase every sighting, photo, and saved location across your entire log — every time frame, every location. This can't be undone; export a backup first if you're not sure.
            </p>
            <Field label='Type "RESET" to confirm'>
              <input style={styles.input} value={confirmResetText} onChange={(e) => setConfirmResetText(e.target.value)} placeholder="RESET" />
            </Field>
            <button
              type="button"
              style={{ ...styles.dangerButtonWide, ...(confirmResetText.trim().toUpperCase() !== "RESET" ? styles.dangerButtonDisabled : {}) }}
              disabled={confirmResetText.trim().toUpperCase() !== "RESET"}
              onClick={resetAllData}
            >
              Reset all data
            </button>
          </div>
          </div>
          )}
        </div>
      )}
    </div>
  );
}
