const wikiCache = {};

function fetchTaxonPhoto(name) {
  return fetch("https://api.inaturalist.org/v1/taxa?q=" + encodeURIComponent(name) + "&per_page=1&is_active=true", { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("no taxon"); return res.json(); })
    .then((data) => {
      const taxon = data.results && data.results[0];
      const photo = taxon && taxon.default_photo;
      if (!photo) return null;
      return photo.medium_url || photo.square_url || null;
    })
    .catch(() => null);
}

function fetchWikiSummary(name) {
  const key = name.toLowerCase();
  if (wikiCache[key]) return wikiCache[key];
  const promise = fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(name), { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("not found"); return res.json(); })
    .then((data) => ({
      extract: data.extract || "",
      thumbnail: data.thumbnail ? data.thumbnail.source : null,
      pageUrl: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || ("https://en.wikipedia.org/wiki/" + encodeURIComponent(name.replace(/ /g, "_"))),
      imageSource: data.thumbnail ? "wikipedia" : null,
    }))
    .catch(() => ({
      extract: "",
      thumbnail: null,
      pageUrl: "https://en.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(name),
      imageSource: null,
    }))
    .then((result) => {
      if (result.thumbnail) return result;
      return fetchTaxonPhoto(name).then((photoUrl) => {
        return photoUrl ? { ...result, thumbnail: photoUrl, imageSource: "inaturalist" } : result;
      });
    });
  wikiCache[key] = promise;
  return promise;
}

const soundCache = {};

// Xeno-canto (xeno-canto.org) is a free, public library of wildlife audio —
// strongest for birds, but its search also turns up recordings for many
// insects and a handful of other vocal animals. Its API doesn't send the
// CORS header browsers require for direct cross-site requests, so we relay
// through a couple of free public CORS proxies (falling back from one to
// the next) rather than hitting xeno-canto directly. If both proxies are
// ever down, the lookup just quietly fails and no play button shows —
// nothing breaks.
const XC_PROXIES = [
  (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  (url) => "https://corsproxy.io/?url=" + encodeURIComponent(url),
];

function fetchViaProxies(targetUrl, proxies) {
  if (!proxies.length) return Promise.resolve(null);
  const [makeUrl, ...rest] = proxies;
  return fetch(makeUrl(targetUrl), { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("proxy failed"); return res.json(); })
    .catch(() => fetchViaProxies(targetUrl, rest));
}

function fetchTaxonSound(name) {
  const key = name.toLowerCase();
  if (soundCache[key]) return soundCache[key];
  const target = "https://xeno-canto.org/api/2/recordings?query=" + encodeURIComponent(name);
  const promise = fetchViaProxies(target, XC_PROXIES)
    .then((data) => {
      const recordings = (data && data.recordings) || [];
      const match = recordings.find((r) => r && r.file);
      if (!match) return null;
      const url = match.file.indexOf("//") === 0 ? "https:" + match.file : match.file;
      return { url, recordist: match.rec || "", license: match.lic || "" };
    })
    .catch(() => null);
  soundCache[key] = promise;
  return promise;
}

function SoundButton({ name, onSound }) {
  const [sound, setSound] = useState(null);
  const [playing, setPlaying] = useState(false);
  const audioRef = React.useRef(null);

  React.useEffect(() => {
    let alive = true;
    setSound(null);
    setPlaying(false);
    fetchTaxonSound(name).then((data) => { if (alive) { setSound(data); if (onSound) onSound(data); } });
    return () => {
      alive = false;
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    };
  }, [name]);

  if (!sound || !sound.url) return null;

  const toggle = () => {
    if (!audioRef.current) {
      audioRef.current = new Audio(sound.url);
      audioRef.current.addEventListener("ended", () => setPlaying(false));
    }
    if (playing) {
      audioRef.current.pause();
      setPlaying(false);
    } else {
      audioRef.current.play().catch(() => setPlaying(false));
      setPlaying(true);
    }
  };

  return (
    <button
      type="button"
      onClick={toggle}
      style={{ ...styles.soundButton, ...(playing ? styles.soundButtonActive : {}) }}
      title={playing ? "Pause call" : "Play call"}
      aria-label={playing ? "Pause animal call" : "Play animal call"}
    >
      {playing ? "❚❚" : "▶"}
    </button>
  );
}

function briefText(extract) {
  if (!extract) return "";
  const firstSentence = extract.split(/(?<=[.!?])\s/)[0];
  return firstSentence.length > 160 ? firstSentence.slice(0, 157) + "…" : firstSentence;
}

}

function iconicToCategory(iconic) {
  if (iconic === "Aves") return "bird";
  if (iconic === "Mammalia") return "mammal";
  if (iconic === "Insecta" || iconic === "Arachnida") return "insect";
  if (iconic === "Reptilia" || iconic === "Amphibia") return "herp";
  if (iconic === "Plantae") return "plant";
  if (iconic === "Fungi") return "fungus";
  return "other";
}

function titleCase(s) {
  return s.replace(/\w\S*/g, (t) => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase());
}

const emptyForm = { species: "", category: "bird", date: todayStr(), quantity: 1, location: "", note: "", photo: "" };

function emptySpeciesBuckets() {
  return { bird: [], mammal: [], insect: [], herp: [], plant: [], fungus: [], other: [] };
}

async function fetchSpeciesBuckets(lat, lon) {
  const res = await fetch("https://api.inaturalist.org/v1/observations/species_counts?lat=" + lat + "&lng=" + lon + "&radius=50&per_page=500&verifiable=true");
  const data = await res.json();
  const buckets = emptySpeciesBuckets();
  const seen = new Set();
  (data.results || []).forEach((r) => {
    const taxon = r.taxon;
    if (!taxon) return;
    const cat = iconicToCategory(taxon.iconic_taxon_name);
    const rawLabel = taxon.preferred_common_name || taxon.name;
    if (!rawLabel) return;
    const label = titleCase(rawLabel);
    const key = cat + ":" + label.toLowerCase();
    if (seen.has(key)) return;
    if (buckets[cat].length >= LOCATION_CAPS[cat]) return;
    seen.add(key);
    buckets[cat].push(label);
  });
  return buckets;
}

function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// merges two lists of {id, updatedAt} records, keeping whichever copy of
// each id is newer so two devices that both made offline changes reconcile
function mergeById(localList, cloudList) {
  const map = new Map();
  localList.forEach((item) => map.set(item.id, item));
  cloudList.forEach((item) => {
    const existing = map.get(item.id);
    if (!existing) { map.set(item.id, item); return; }
    const localTime = existing.updatedAt || 0;
    const cloudTime = item.updatedAt || 0;
    if (cloudTime > localTime) map.set(item.id, item);
  });
  return Array.from(map.values());
}

function LocationsMap({ locations, activeLocationId, onSelect, onMapClick, addPin }) {
  const mapRef = React.useRef(null);
  const mapInstance = React.useRef(null);
  const markersRef = React.useRef([]);
  const addMarkerRef = React.useRef(null);
  const onMapClickRef = React.useRef(onMapClick);
  React.useEffect(() => { onMapClickRef.current = onMapClick; }, [onMapClick]);

  React.useEffect(() => {
    if (!window.L || !mapRef.current) return;
    if (!mapInstance.current) {
      mapInstance.current = window.L.map(mapRef.current, { scrollWheelZoom: false }).setView([34.7834, -82.3021], 6);
      window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 18,
      }).addTo(mapInstance.current);
      mapInstance.current.on("click", (e) => {
        if (onMapClickRef.current) onMapClickRef.current(e.latlng.lat, e.latlng.lng);
      });
    }
    const map = mapInstance.current;
    markersRef.current.forEach((m) => map.removeLayer(m));
    markersRef.current = [];
    const pts = [];
    locations.forEach((loc) => {
      const lat = parseFloat(loc.lat);
      const lon = parseFloat(loc.lon);
      if (Number.isNaN(lat) || Number.isNaN(lon)) return;
      const isActive = loc.id === activeLocationId;
      const marker = window.L.circleMarker([lat, lon], {
        radius: isActive ? 9 : 6,
        color: isActive ? "#1F8A68" : "#8A7F63",
        fillColor: isActive ? "#1F8A68" : "#C9BFA0",
        fillOpacity: 0.85,
        weight: 2,
      }).addTo(map);
      marker.bindTooltip(loc.name);
      marker.on("click", (e) => {
        window.L.DomEvent.stopPropagation(e);
        onSelect(loc.id);
      });
      markersRef.current.push(marker);
      pts.push([lat, lon]);
    });
    if (pts.length > 1) {
      map.fitBounds(pts, { padding: [30, 30] });
    } else if (pts.length === 1) {
      map.setView(pts[0], 10);
    }
    setTimeout(() => map.invalidateSize(), 50);
  }, [locations, activeLocationId]);

  // temporary marker + spinner while a tapped point is being turned into a location
  React.useEffect(() => {
    const map = mapInstance.current;
    if (!map) return;
    if (addMarkerRef.current) {
      map.removeLayer(addMarkerRef.current);
      addMarkerRef.current = null;
    }
    if (addPin) {
      addMarkerRef.current = window.L.circleMarker([addPin.lat, addPin.lng], {
        radius: 8,
        color: "#C9922E",
        fillColor: "#C9922E",
        fillOpacity: 0.5,
        weight: 2,
        dashArray: "3,3",
      }).addTo(map);
    }
  }, [addPin]);

  return <div ref={mapRef} style={styles.mapBox} />;
}

  async function addLocationFromLatLng(lat, lon) {

      const dLat = Math.abs(parseFloat(loc.lat) - lat);

      setEntries(mergedEntries);

      const cloudEntryIds = new Set(cloud.entries.map((e) => e.id));
      const cloudLocationIds = new Set(cloud.locations.map((l) => l.id));
      const finalLocations = mergedLocations.length ? mergedLocations : locations;
      const batch = db.batch();
      let ops = 0;
      mergedEntries.forEach((e) => {
        if (!cloudEntryIds.has(e.id)) { batch.set(entriesCol(uid).doc(e.id), e); ops++; }
      });
      finalLocations.forEach((l) => {
        if (!cloudLocationIds.has(l.id)) { batch.set(locationsCol(uid).doc(l.id), l); ops++; }

      if (ops > 0) await batch.commit();

      setIncomingRequests(inSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
      const otherUids = Array.from(new Set([
        ...fromSnap.docs.map((d) => d.data().to),
        ...toSnap.docs.map((d) => d.data().from),
      ]));
      const friendDocs = await Promise.all(otherUids.map((otherUid) => db.collection("users").doc(otherUid).get()));
      setFriends(friendDocs.filter((d) => d.exists).map((d) => ({ uid: d.id, ...d.data() })));
    } catch (err) {
      setFriendError("Couldn't load friend data — try refreshing.");
    }
  }

  function friendlyAuthError(err) {
    const code = err && err.code;
    if (code === "auth/email-already-in-use") return "That email already has an account — try signing in instead.";
    if (code === "auth/invalid-email") return "That doesn't look like a valid email.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential") return "Email or password didn't match.";
    return "Something went wrong — try again.";
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    setAuthError("");
    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(authEmail.trim(), authPassword);
        if (authDisplayName.trim()) {
          await cred.user.updateProfile({ displayName: authDisplayName.trim() });
        }
        await db.collection("users").doc(cred.user.uid).set({
          email: normalizeEmail(authEmail),
          displayName: authDisplayName.trim() || authEmail.trim(),
          stats: globalStats,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      } else {
        await auth.signInWithEmailAndPassword(authEmail.trim(), authPassword);
      }
      setAuthPassword("");
    } catch (err) {
      setAuthError(friendlyAuthError(err));
    }
    setAuthBusy(false);
  }

  function handleForgotPassword() {
    const email = authEmail.trim();
    if (!email) {
      setAuthError("Type your email above first, then tap \"Forgot password?\" again.");
      return;
    }
    setAuthError("");
    setAuthBusy(true);
    auth.sendPasswordResetEmail(email)
      .then(() => setAuthError("Reset email sent — check your inbox (and spam folder) for a link."))
      .catch(() => setAuthError("Couldn't send a reset email for that address."))
      .finally(() => setAuthBusy(false));
  }

  async function sendFriendRequest(e) {
    e.preventDefault();
    if (!user) return;
    const email = normalizeEmail(friendEmail);
    if (!email) return;
    if (email === normalizeEmail(user.email)) { setFriendError("That's your own email."); return; }
    setFriendBusy(true);
    setFriendError("");
    try {
      const targetSnap = await db.collection("users").where("email", "==", email).limit(1).get();
      if (targetSnap.empty) {
        setFriendError("No account found with that email.");
        setFriendBusy(false);
        return;
      }
      const targetUid = targetSnap.docs[0].id;
      const reverseId = targetUid + "_" + user.uid;
      const reverseDoc = await db.collection("friendRequests").doc(reverseId).get();
      if (reverseDoc.exists && reverseDoc.data().status === "pending") {
        await db.collection("friendRequests").doc(reverseId).update({ status: "accepted" });
        setFriendEmail("");
        await refreshSocialData(user.uid);
        setFriendBusy(false);
        return;
      }
      const forwardId = user.uid + "_" + targetUid;
      const existing = await db.collection("friendRequests").doc(forwardId).get();
      if (existing.exists && existing.data().status === "accepted") {
        setFriendError("You're already friends.");
        setFriendBusy(false);
        return;
      }
      if (existing.exists && existing.data().status === "pending") {
        setFriendError("Friend request already sent.");
        setFriendBusy(false);
        return;
      }
      await db.collection("friendRequests").doc(forwardId).set({
        from: user.uid,
        to: targetUid,
        fromEmail: normalizeEmail(user.email),
        toEmail: email,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setFriendEmail("");
      await refreshSocialData(user.uid);
    } catch (err) {
      setFriendError("Something went wrong sending that request.");
    }
    setFriendBusy(false);
  }

  async function respondToRequest(reqId, accept) {

      await db.collection("friendRequests").doc(reqId).update({ status: accept ? "accepted" : "declined" });

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportJSON() {

  function csvEscape(v) {
    const s = String(v ?? "");
    if (s.includes(",") || s.includes('"') || s.includes("\n")) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCSV() {
    const header = ["species", "category", "date", "quantity", "location", "note"];
    const rows = entries.map((e) => header.map((h) => csvEscape(e[h])).join(","));
    const csv = [header.join(","), ...rows].join("\n");
    triggerDownload(new Blob([csv], { type: "text/csv" }), "backyard-field-log.csv");
  }

  function handleImport(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("bad format");
        const cleaned = data.filter((d) => d && d.species).map((d) => ({
          id: d.id || uid(),
          species: String(d.species),
          category: CATEGORIES.some((c) => c.id === d.category) ? d.category : "other",
          date: d.date || todayStr(),
          quantity: Number(d.quantity) || 1,
          location: d.location || "",
          note: d.note || "",
          photo: d.photo || null,
          locationId: d.locationId || activeLocationId,
          locationName: d.locationName || activeLocation.name,
          updatedAt: d.updatedAt || nowTs(),
        }));
        setEntries((prev) => [...cleaned, ...prev]);
        if (user && cleaned.length) {
          const batch = db.batch();
          cleaned.forEach((c) => batch.set(entriesCol(user.uid).doc(c.id), c));
          batch.commit().catch(() => {});
        }
      } catch (err) {
        setImportError("Couldn't read that file. Import a JSON export from this app.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

            <p style={styles.emptyText}>Loading species for this location{"…"}</p>
          )}
          {locationStatus[activeLocationId] === "error" && (
            <p style={styles.errorText}>
              Couldn't load species for this location.{" "}
              <button type="button" style={styles.retryLink} onClick={() => retryLocationSpecies(activeLocation)}>Retry</button>
            </p>
          )}
          {CATEGORIES.filter((c) => (speciesForActive[c.id] || []).length > 0).map((c) => (
            <div key={c.id} style={styles.card}>
              <h3 className="ffont" style={{ ...styles.chartTitle, display: "flex", alignItems: "center", gap: 8 }}>
                <CategoryIcon id={c.id} color={c.color} size={18} /> {c.label}
              </h3>
              <div style={styles.guideGrid}>
                {speciesForActive[c.id].map((name) => (
                  <SpeciesInfoCard key={name} name={name} categoryId={c.id} />
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "location" && (
        <div>
          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Map</h3>
            <p style={styles.locationNote}>Tap a pin to switch locations, or tap anywhere else on the map to add a new location right there.</p>
            <LocationsMap
              locations={locations}
              activeLocationId={activeLocationId}
              onSelect={setActiveLocationId}
              onMapClick={addLocationFromLatLng}
              addPin={mapPin}
            />
            {mapAddStatus === "locating" && (
              <p style={{ ...styles.suggestLabel, marginTop: 10 }}>Adding that spot{"…"}</p>
            )}
            {mapAddError && <p style={{ ...styles.errorText, marginTop: 10, marginBottom: 0 }}>{mapAddError}</p>}
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Your locations</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {locations.map((loc) => {
                const isActive = loc.id === activeLocationId;
                const status = locationStatus[loc.id];
                const count = entries.filter((e) => e.locationId === loc.id || (!e.locationId && loc.id === "default")).length;
                return (
                  <div key={loc.id} style={{ ...styles.entryRow, borderLeft: "4px solid " + (isActive ? "#1F8A68" : "var(--border)") }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={styles.entryTop}>
                        <span className="ffont" style={styles.entrySpecies}>{loc.name}</span>
                        {isActive && <span style={{ fontSize: 12, fontWeight: 700, color: "#1F8A68" }}>Active</span>}
                      </div>
                      <div style={styles.entryMeta}>
                        <span>{count} sighting{count === 1 ? "" : "s"} logged</span>
                        {status === "loading" && <span>Loading species{"…"}</span>}
                        {status === "error" && <span style={{ color: "#A8455F" }}>Species failed to load</span>}
                      </div>
                    </div>
                    {!isActive && (
                      <button type="button" style={styles.iconButton} onClick={() => setActiveLocationId(loc.id)}>Switch here</button>
                    )}
                    {status === "error" && (
                      <button type="button" style={styles.iconButton} onClick={() => retryLocationSpecies(loc)}>Retry</button>
                    )}
                    {locations.length > 1 && (
                      <button type="button" style={styles.deleteButton} onClick={() => removeLocation(loc.id)} title="Remove location" aria-label="Remove location">{"×"}</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Add a location</h3>
            <p style={styles.locationNote}>Search by name below, or just tap the map above to drop a pin.</p>
            <form onSubmit={addLocation}>
              <div style={styles.formGrid}>
                <Field label="Label (optional)">
                  <input
                    style={styles.input}
                    placeholder="e.g. Lake house"
                    value={newLocationName}
                    onChange={(e) => setNewLocationName(e.target.value)}
                  />
                </Field>
                <Field label="City and state, or zip code">
                  <input
                    style={styles.input}
                    placeholder="e.g. Asheville, NC"
                    value={newLocationQuery}
                    onChange={(e) => setNewLocationQuery(e.target.value)}
                    required
                  />
                </Field>
              </div>
              <button type="submit" style={styles.primaryButtonWide} disabled={addingLocation}>
                {addingLocation ? "Adding…" : "+ Add location"}
              </button>
              {addLocationError && <p style={styles.errorText}>{addLocationError}</p>}
            </form>
          </div>
        </div>
      )}

      {tab === "insights" && (
        <div>
          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Species by category</h3>
            {categoryChartData.length === 0 ? (
              <p style={styles.emptyText}>Log some sightings to see this chart.</p>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {categoryChartData.map((d) => {
                  const max = Math.max(...categoryChartData.map((x) => x.value));
                  return (
                    <div key={d.name} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ width: 150, fontSize: 12.5, color: "var(--text)", flexShrink: 0 }}>{d.name}</span>
                      <div style={{ flex: 1, background: "var(--border-soft)", borderRadius: 6, height: 14, overflow: "hidden" }}>
                        <div style={{ width: (d.value / max * 100) + "%", background: d.color, height: "100%" }} />
                      </div>
                      <span className="mfont" style={{ fontSize: 12.5, color: "var(--text-muted)", width: 20, textAlign: "right" }}>{d.value}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>New species discovered by month</h3>
            {monthlyChartData.length === 0 ? (
              <p style={styles.emptyText}>Log some sightings to see this chart.</p>
            ) : (
              <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 160, paddingTop: 10 }}>
                {monthlyChartData.map((d) => (
                  <div key={d.month} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
                    <span className="mfont" style={{ fontSize: 11, color: "var(--text-muted)" }}>{d.newSpecies}</span>
                    <div style={{ width: "70%", background: "#2E6B3E", borderRadius: "4px 4px 0 0", height: (d.newSpecies / maxMonthly * 100) + "%", minHeight: 4 }} />
                    <span style={{ fontSize: 10.5, color: "var(--text-muted)" }}>{d.month}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {tab === "account" && (
        <div>
          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Account</h3>
            {authLoading ? (
              <p style={styles.emptyText}>Loading…</p>
            ) : user ? (
              <div>
                <p style={styles.locationNote}>Signed in as <strong>{user.displayName || user.email}</strong> ({user.email}).</p>
                <p style={styles.suggestLabel}>
                  {syncStatus === "syncing" && "Syncing your sightings to your account…"}
                  {syncStatus === "done" && "Your sightings and locations are backed up to your account."}
                  {syncStatus === "error" && "Couldn't sync just now — check your connection and try again."}
                  {syncStatus === "" && "Not synced yet this session."}
                </p>
                <div style={{ display: "flex", gap: 8 }}>
                  <button type="button" style={styles.iconButton} onClick={signOutUser}>Sign out</button>
                  <button type="button" style={styles.iconButton} onClick={() => syncOnSignIn(user.uid)}>Sync now</button>
                </div>
              </div>
            ) : (
              <div>
                <div style={styles.authTabRow}>
                  <button
                    type="button"
                    style={{ ...styles.authTabButton, ...(authMode === "signin" ? styles.authTabButtonActive : {}) }}
                    onClick={() => { setAuthMode("signin"); setAuthError(""); }}
                  >Sign in</button>
                  <button
                    type="button"
                    style={{ ...styles.authTabButton, ...(authMode === "signup" ? styles.authTabButtonActive : {}) }}
                    onClick={() => { setAuthMode("signup"); setAuthError(""); }}
                  >Create account</button>
                </div>
                <form onSubmit={handleAuthSubmit}>
                  <div style={styles.formGrid}>
                    {authMode === "signup" && (
                      <Field label="Display name (optional)">
                        <input style={styles.input} value={authDisplayName} onChange={(e) => setAuthDisplayName(e.target.value)} placeholder="e.g. Pax" />
                      </Field>
                    )}
                    <Field label="Email">
                      <input type="email" style={styles.input} value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} required />
                    </Field>
                    <Field label="Password">
                      <input type="password" style={styles.input} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} required minLength={6} />
                    </Field>
                  </div>
                  <button type="submit" style={styles.primaryButtonWide} disabled={authBusy}>
                    {authBusy ? "Working…" : authMode === "signup" ? "Create account" : "Sign in"}
                  </button>
                  {authMode === "signin" && (
                    <button type="button" style={{ ...styles.retryLink, display: "block", marginTop: 10 }} onClick={handleForgotPassword} disabled={authBusy}>
                      Forgot password?
                    </button>
                  )}
                  {authError && <p style={styles.errorText}>{authError}</p>}
                </form>
              </div>
            )}
          </div>

          {user && (
            <div style={styles.card}>
              <h3 className="ffont" style={styles.chartTitle}>Friends</h3>
              <p style={styles.locationNote}>Add a friend by the email they signed up with, then compare species counts once they've logged sightings of their own.</p>
              <form onSubmit={sendFriendRequest} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
                <div style={{ flex: "1 1 220px" }}>
                  <Field label="Friend's email">
                    <input type="email" style={styles.input} value={friendEmail} onChange={(e) => setFriendEmail(e.target.value)} placeholder="friend@example.com" required />
                  </Field>
                </div>
                <button type="submit" style={styles.primaryButton} disabled={friendBusy}>{friendBusy ? "Sending…" : "+ Add friend"}</button>
                <button type="button" style={styles.iconButton} onClick={() => refreshSocialData(user.uid)}>Refresh</button>
              </form>
              {friendError && <p style={styles.errorText}>{friendError}</p>}

              {incomingRequests.length > 0 && (
                <div style={{ marginTop: 14 }}>
                  <p style={styles.suggestLabel}>Friend requests</p>
                  {incomingRequests.map((r) => (
                    <div key={r.id} style={styles.friendRequestRow}>
                      <span>{r.fromEmail}</span>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button type="button" style={styles.iconButton} onClick={() => respondToRequest(r.id, true)}>Accept</button>
                        <button type="button" style={styles.iconButton} onClick={() => respondToRequest(r.id, false)}>Decline</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {outgoingRequests.length > 0 && (
                <p style={{ ...styles.suggestLabel, marginTop: 14 }}>
                  Waiting on: {outgoingRequests.map((r) => r.toEmail).join(", ")}
                </p>
              )}

              <div style={{ marginTop: 16 }}>
                <p style={styles.suggestLabel}>Leaderboard — unique species logged</p>
                {leaderboard.map((row, i) => (
                  <div key={row.uid} style={{ ...styles.leaderboardRow, ...(row.isYou ? styles.leaderboardRowYou : {}) }}>
                    <span style={styles.leaderboardRank}>{i + 1}</span>
                    <span style={{ flex: 1, fontWeight: row.isYou ? 700 : 500 }}>{row.name}{row.isYou ? " (you)" : ""}</span>
                    <span className="mfont" style={{ fontSize: 13 }}>{row.uniqueSpecies} species</span>
                    <span className="mfont" style={{ fontSize: 12, color: "var(--text-muted)", width: 90, textAlign: "right" }}>{row.totalSightings} sightings</span>
                  </div>
                ))}
                {friends.length === 0 && <p style={styles.emptyText}>Add a friend to start comparing.</p>}
              </div>
            </div>
          )}

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Your data</h3>
            <p style={styles.locationNote}>
              {user
                ? "Everything you log — sightings, photos, and saved locations — is saved to this browser and backed up to your account, so it'll follow you if you sign in somewhere else. Export a backup regularly anyway, just in case."
                : "Everything you log — sightings, photos, and saved locations — stays in this browser's storage only for now. Sign in above to back it up to your account and access it from other devices. Export a backup regularly if it matters to you."}
            </p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button type="button" style={styles.iconButton} onClick={exportJSON}>Export as JSON</button>
              <button type="button" style={styles.iconButton} onClick={exportCSV}>Export as CSV</button>
            </div>
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Clear sightings by time frame</h3>
            <p style={styles.locationNote}>
              Remove logged sightings for <strong>{activeLocation ? activeLocation.name : "this location"}</strong> within a specific month or year. Locations, photos of other months/years, and app settings are left alone.
            </p>
            <div style={styles.formGrid}>
              <Field label="Time frame">
                <select style={styles.input} value={resetScope} onChange={(e) => setResetScope(e.target.value)}>
                  <option value="month">A specific month</option>
                  <option value="year">A specific year</option>
                  <option value="all">All time, this location</option>
                </select>
              </Field>
              {resetScope === "month" && (
                <Field label="Month">
                  <input type="month" style={styles.input} value={resetMonth} onChange={(e) => setResetMonth(e.target.value)} />
                </Field>
              )}
              {resetScope === "year" && (
                <Field label="Year">
                  <select style={styles.input} value={resetYear} onChange={(e) => setResetYear(e.target.value)}>
                    {availableYears.map((y) => <option key={y} value={y}>{y}</option>)}
                  </select>
                </Field>
              )}
            </div>
            <p style={styles.suggestLabel}>
              {resetPreviewCount} sighting{resetPreviewCount === 1 ? "" : "s"} will be deleted.
            </p>
            <button
              type="button"
              style={{ ...styles.dangerButton, ...(resetPreviewCount === 0 ? styles.dangerButtonDisabled : {}) }}
              disabled={resetPreviewCount === 0}
              onClick={handleScopedReset}
            >
              Delete {resetPreviewCount > 0 ? resetPreviewCount : ""} sighting{resetPreviewCount === 1 ? "" : "s"}
            </button>
          </div>

          <div style={styles.dangerCard}>
            <h3 className="ffont" style={{ ...styles.chartTitle, color: "#A8455F" }}>Danger zone</h3>
            <p style={styles.locationNote}>
              Permanently erase every sighting, photo, and saved location across your entire log — every time frame, every location. This can't be undone; export a backup first if you're not sure.
            </p>
            <Field label='Type "RESET" to confirm'>
              <input style={styles.input} value={confirmResetText} onChange={(e) => setConfirmResetText(e.target.value)} placeholder="RESET" />
            </Field>
            <button
              type="button"
              style={{ ...styles.dangerButtonWide, ...(confirmResetText.trim().toUpperCase() !== "RESET" ? styles.dangerButtonDisabled : {}) }}
              disabled={confirmResetText.trim().toUpperCase() !== "RESET"}
              onClick={resetAllData}
            >
              Reset all data
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
