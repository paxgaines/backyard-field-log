  const [guideSearch, setGuideSearch] = useState("");
  const [guideActiveCats, setGuideActiveCats] = useState(() => CATEGORIES.map((c) => c.id));
  const [guideOnlyNew, setGuideOnlyNew] = useState(false);
  const [guideOnlySeason, setGuideOnlySeason] = useState(false);
  const [guideMonth, setGuideMonth] = useState(() => new Date().getMonth() + 1);
  // Species commonly reported near a location in a given month, keyed
  // "<locationId>:<month>". Populated lazily — one call per month you look at.
  const [seasonalCache, setSeasonalCache] = useState({});
  const [seasonalStatus, setSeasonalStatus] = useState({});
  // A location being looked at without being saved. Browsing the guide for
  // another city used to append it to your saved locations and switch your
  // active location, which zeroed every stat on screen.
  const [previewLocation, setPreviewLocation] = useState(null);
  const [previewStatus, setPreviewStatus] = useState("");
  const [importReport, setImportReport] = useState(null);
  const [photoError, setPhotoError] = useState("");
  const [formGeoStatus, setFormGeoStatus] = useState("");
  const [exportBusy, setExportBusy] = useState(false);
  const [addingEntry, setAddingEntry] = useState(false);
  const addingEntryRef = React.useRef(false);
  const [safetyDismissed, setSafetyDismissed] = useState(() => loadJSON(STORAGE_KEYS.safetyBanner, false));
  const [toast, setToast] = useState(null);
  const [profileBio, setProfileBio] = useState("");
  const [profileAvatar, setProfileAvatar] = useState("");
  const [profileSaving, setProfileSaving] = useState(false);
  const [profileSaved, setProfileSaved] = useState(false);
  const [openFriendUid, setOpenFriendUid] = useState(null);
  const [feedEntries, setFeedEntries] = useState([]);
  const [feedLoading, setFeedLoading] = useState(false);
  const [feedError, setFeedError] = useState("");
  const [openComments, setOpenComments] = useState(null);
  const [commentsByEntry, setCommentsByEntry] = useState({});
  const [commentDraft, setCommentDraft] = useState("");
  const [commentBusy, setCommentBusy] = useState(false);
  const [notifSeenAt, setNotifSeenAt] = useState(() => loadJSON(STORAGE_KEYS.notifSeen, 0));

  const [locations, setLocations] = useState(() => loadJSON(STORAGE_KEYS.locations, []));
  const [activeLocationId, setActiveLocationId] = useState(() => loadJSON(STORAGE_KEYS.activeLocation, null));
  const [locationSpeciesCache, setLocationSpeciesCache] = useState({});
  const [locationStatus, setLocationStatus] = useState({});
  const [newLocationName, setNewLocationName] = useState("");
  const [newLocationQuery, setNewLocationQuery] = useState("");
  const [addingLocation, setAddingLocation] = useState(false);
  const [addLocationError, setAddLocationError] = useState("");
  const [mapPin, setMapPin] = useState(null);
  const [mapAddStatus, setMapAddStatus] = useState("");
  const [mapAddError, setMapAddError] = useState("");

  const [resetScope, setResetScope] = useState("month");
  const [resetMonth, setResetMonth] = useState(() => todayStr().slice(0, 7));
  const [resetYear, setResetYear] = useState(() => todayStr().slice(0, 4));
  const [confirmResetText, setConfirmResetText] = useState("");

  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [authMode, setAuthMode] = useState("signin");
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authDisplayName, setAuthDisplayName] = useState("");
  const [authError, setAuthError] = useState("");
  const [authBusy, setAuthBusy] = useState(false);
  const [friendEmail, setFriendEmail] = useState("");
  const [friendError, setFriendError] = useState("");
  const [friendBusy, setFriendBusy] = useState(false);
  const [incomingRequests, setIncomingRequests] = useState([]);
  const [outgoingRequests, setOutgoingRequests] = useState([]);
  const [friends, setFriends] = useState([]);
  const [syncStatus, setSyncStatus] = useState("");

  const needsLocation = locations.length === 0;
  const activeLocation = locations.find((l) => l.id === activeLocationId) || locations[0] || null;
  const speciesForActive = locationSpeciesCache[activeLocationId] || emptySpeciesBuckets();

  // The guide can point at a place you're only looking at. Logging, stats and
  // the life list stay anchored to the saved location regardless.
  const guideLocation = previewLocation || activeLocation;
  const guideLocationId = guideLocation ? guideLocation.id : null;
  const speciesForGuide = (guideLocationId && locationSpeciesCache[guideLocationId]) || emptySpeciesBuckets();
  const seasonKey = guideLocationId ? guideLocationId + ":" + guideMonth : null;
  const seasonalNames = (seasonKey && seasonalCache[seasonKey]) || null;

  // Deliberately separate from the guide's. The guide can be pointed at another
  // city and another month; anything that describes *your* patch — the progress
  // line in the header, and what counts as an unusual find when you log
  // something — has to stay on your own location and the real current month.
  const currentMonth = new Date().getMonth() + 1;
  const homeSeasonKey = activeLocation ? activeLocation.id + ":" + currentMonth : null;
  const homeSeasonalNames = (homeSeasonKey && seasonalCache[homeSeasonKey]) || null;

  // Deleted records stay in the list as tombstones so the merge can see them.
  // Everything the interface counts or renders runs off the living ones.
  const liveEntries = useMemo(() => living(entries), [entries]);

  // ---- persistence ----
  // Sightings have a single write path now: persist first, adopt into state
  // only if the write succeeded. The old code mirrored state into localStorage
  // from an effect, so when the quota was hit the sighting sat on screen looking
  // saved right up until a reload quietly dropped it.
  const entriesRef = React.useRef(entries);

  function persistEntries(next) {
    try {
      localStorage.setItem(STORAGE_KEYS.entries, JSON.stringify(next));
      setStorageError("");
      return true;
    } catch (err) {
      setStorageError("Your browser ran out of storage, so that change wasn't saved. Export a backup from the Account tab, then clear out some older sightings.");
      return false;
    }
  }

  function commitEntries(updater) {
    const current = entriesRef.current;
    const next = typeof updater === "function" ? updater(current) : updater;
    if (!persistEntries(next)) return false;
    entriesRef.current = next;
    setEntries(next);
    return true;
  }
  React.useEffect(() => {
    try { localStorage.setItem(STORAGE_KEYS.locations, JSON.stringify(locations)); } catch (err) { /* ignore */ }
  }, [locations]);
  React.useEffect(() => {
    try { localStorage.setItem(STORAGE_KEYS.activeLocation, JSON.stringify(activeLocationId)); } catch (err) { /* ignore */ }
  }, [activeLocationId]);
  React.useEffect(() => {
    try { localStorage.setItem(STORAGE_KEYS.theme, JSON.stringify(theme)); } catch (err) { /* ignore */ }
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);
  React.useEffect(() => {
    try { localStorage.setItem(STORAGE_KEYS.palette, JSON.stringify(palette)); } catch (err) { /* ignore */ }
    document.documentElement.setAttribute("data-palette", palette);
  }, [palette]);

  // ---- accounts + friends ----
  React.useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => { setUser(u); setAuthLoading(false); });
    return unsub;
  }, []);

  React.useEffect(() => {
    if (!user) {
      setIncomingRequests([]); setOutgoingRequests([]); setFriends([]); setSyncStatus("");
      setProfileBio(""); setProfileAvatar(""); setFeedEntries([]);
      return;
    }
    refreshSocialData(user.uid);
    syncOnSignIn(user.uid);
    db.collection("users").doc(user.uid).get().then((snap) => {
      const data = snap.exists ? snap.data() : null;
      setProfileBio((data && data.bio) || "");
      setProfileAvatar((data && data.avatar) || "");
    }).catch(() => {});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user]);

  async function retryLocationSpecies(loc) {
    setLocationStatus((prev) => ({ ...prev, [loc.id]: "loading" }));
    try {
      const buckets = await fetchSpeciesBuckets(loc.lat, loc.lon);
      setLocationSpeciesCache((prev) => ({ ...prev, [loc.id]: buckets }));
      setLocationStatus((prev) => ({ ...prev, [loc.id]: "done" }));
    } catch (err) {
      setLocationStatus((prev) => ({ ...prev, [loc.id]: "error" }));
    }
  }

  // Fetches the set of species commonly reported near a location in one month.
  // Cached per location-and-month, so flicking along the month strip costs one
  // request per month and nothing after that.
  const seasonalInFlight = React.useRef(new Set());

  async function loadSeasonal(loc, month) {
    if (!loc || !month) return;
    const key = loc.id + ":" + month;
    if (seasonalCache[key] || seasonalInFlight.current.has(key)) return;
    seasonalInFlight.current.add(key);
    setSeasonalStatus((prev) => ({ ...prev, [key]: "loading" }));
    try {
      const buckets = await fetchSpeciesBuckets(loc.lat, loc.lon, month);
      const names = new Set();
      Object.keys(buckets).forEach((cat) => buckets[cat].forEach((n) => names.add(n.trim().toLowerCase())));
      setSeasonalCache((prev) => ({ ...prev, [key]: names }));
      setSeasonalStatus((prev) => ({ ...prev, [key]: "done" }));
    } catch (err) {
      // Release the key so a retry is possible. On success the seasonalCache
      // guard above takes over, so there's nothing to release there.
      seasonalInFlight.current.delete(key);
      setSeasonalStatus((prev) => ({ ...prev, [key]: "error" }));
    }
  }

  // species buckets aren't persisted (only geocoded location metadata is) —
  // refetch them for every saved location once on load.
  // Keyed on the set of location ids, not just mount: locations that arrive
  // from the cloud after sign-in used to get no species buckets and no status
  // at all, so the guide claimed nothing matched the filters and offered no way
  // to retry.
  const locationIdsKey = locations.map((l) => l.id).join(",");

  // Keep activeLocationId pointing at a location that actually exists.
  React.useEffect(() => {
    if (!locations.length) return;
    if (!locations.some((l) => l.id === activeLocationId)) setActiveLocationId(locations[0].id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [locationIdsKey, activeLocationId]);
  React.useEffect(() => {
    locations.forEach((loc) => {
      if (!locationSpeciesCache[loc.id] && !locationStatus[loc.id]) {
        retryLocationSpecies(loc);
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [locationIdsKey]);

  // Whatever place and month the guide is pointed at, make sure we have the
  // seasonal set for it.
  React.useEffect(() => {
    if (guideLocation) loadSeasonal(guideLocation, guideMonth);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [guideLocationId, guideMonth]);

  React.useEffect(() => {
    if (activeLocation) loadSeasonal(activeLocation, currentMonth);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeLocationId, currentMonth]);

  // A preview belongs to the guide. Leaving it behind — to another tab, or to
  // "My sightings" — drops it, so the log never sits in a state where the
  // location switcher has silently vanished and nothing on screen says why.
  React.useEffect(() => {
    if (previewLocation && !(tab === "species" && speciesView === "guide")) {
      setPreviewLocation(null);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tab, speciesView]);

  // Entries written before locations existed carry no locationId. Three view
  // filters had a legacy branch for them keyed on the id "default", but no real
  // location ever gets that id, so those sightings were invisible in every view
  // while still counting toward the totals shown on the leaderboard. Adopt them
  // into the first saved location once, on load.
  React.useEffect(() => {
    if (!locations.length) return;
    const homeId = locations[0].id;
    const homeName = locations[0].name;
    const orphans = entriesRef.current.filter((e) => !e.deletedAt && !e.locationId);
    if (!orphans.length) return;
    const orphanIds = new Set(orphans.map((e) => e.id));
    commitEntries((prev) => prev.map((e) => (
      orphanIds.has(e.id)
        ? { ...e, locationId: homeId, locationName: e.locationName || homeName, updatedAt: nowTs() }
        : e
    )));
    setToast(orphans.length + " older sighting" + (orphans.length === 1 ? "" : "s") + " moved into " + homeName + ".");
    setTimeout(() => setToast(null), 5000);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [locations.length > 0]);

  // Shared by saving a location and by previewing one. Returns null and sets an
  // error when the place can't be found.
  async function geocode(query, setError) {
    const geoData = await nominatim("search?format=json&limit=1&q=" + encodeURIComponent(query));
    if (!geoData || !geoData.length) {
      setError("Couldn't find that place. Try a city and state, or a zip code.");
      return null;
    }
    return { lat: geoData[0].lat, lon: geoData[0].lon, displayName: geoData[0].display_name };
  }

  function adoptLocation(loc, makeActive) {
    setLocations((prev) => [...prev, loc]);
    if (user) locationsCol(user.uid).doc(loc.id).set(loc).catch(() => {});
    if (makeActive !== false) setActiveLocationId(loc.id);
    setPreviewLocation(null);
  }

  async function addLocation(e) {
    if (e && e.preventDefault) e.preventDefault();
    const query = newLocationQuery.trim();
    if (!query) return;
    setAddingLocation(true);
    setAddLocationError("");
    try {
      const place = await geocode(query, setAddLocationError);
      if (!place) { setAddingLocation(false); return; }
      const id = uid();
      const label = newLocationName.trim() || place.displayName.split(",")[0];
      const newLoc = { id, name: label, lat: place.lat, lon: place.lon, displayName: place.displayName, updatedAt: nowTs() };
      adoptLocation(newLoc);
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setNewLocationName("");
      setNewLocationQuery("");
      setAddingLocation(false);
      try {
        const buckets = await fetchSpeciesBuckets(place.lat, place.lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setAddLocationError("Something went wrong looking that up. Try again in a moment.");
      setAddingLocation(false);
    }
  }

  // Points the field guide at somewhere you haven't saved. Nothing about your
  // log moves: the header, the stat cards, the life list and the Log tab all
  // stay on your real location, and the preview disappears when you leave it.
  async function previewGuideLocation(e) {
    if (e && e.preventDefault) e.preventDefault();
    const query = newLocationQuery.trim();
    if (!query) return;
    setPreviewStatus("loading");
    setAddLocationError("");
    try {
      const place = await geocode(query, setAddLocationError);
      if (!place) { setPreviewStatus(""); return; }
      const id = "preview:" + place.lat + "," + place.lon;
      const loc = { id, name: place.displayName.split(",")[0], lat: place.lat, lon: place.lon, displayName: place.displayName, preview: true };
      setPreviewLocation(loc);
      setNewLocationQuery("");
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setPreviewStatus("");
      try {
        const buckets = await fetchSpeciesBuckets(place.lat, place.lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setAddLocationError("Something went wrong looking that up. Try again in a moment.");
      setPreviewStatus("");
    }
  }

  // Turns the place you're looking at into one you keep.
  // Keeps the place. Deliberately does NOT switch where you log — the button
  // says "Save this place", and moving the whole log onto a brand new empty
  // location would reproduce the exact "every number reset to zero" surprise
  // that preview mode exists to avoid. Switch from the Location tab when you
  // actually mean to.
  function savePreviewLocation() {
    if (!previewLocation) return;
    const oldId = previewLocation.id;
    const id = uid();
    const saved = {
      id, name: previewLocation.name, lat: previewLocation.lat, lon: previewLocation.lon,
      displayName: previewLocation.displayName, updatedAt: nowTs(),
    };

    // Carry everything already fetched across to the real id — the species
    // buckets and every month of seasonal data — so the guide doesn't blank
    // out and refetch what it just downloaded.
    const cached = locationSpeciesCache[oldId];
    if (cached) setLocationSpeciesCache((prev) => ({ ...prev, [id]: cached }));
    setSeasonalCache((prev) => {
      const next = { ...prev };
      Object.keys(prev).forEach((k) => {
        if (k.indexOf(oldId + ":") === 0) next[id + ":" + k.slice(oldId.length + 1)] = prev[k];
      });
      return next;
    });
    setSeasonalStatus((prev) => {
      const next = { ...prev };
      Object.keys(prev).forEach((k) => {
        if (k.indexOf(oldId + ":") === 0) next[id + ":" + k.slice(oldId.length + 1)] = prev[k];
      });
      return next;
    });
    setLocationStatus((prev) => ({ ...prev, [id]: cached ? "done" : "loading" }));

    setLocations((prev) => [...prev, saved]);
    if (user) locationsCol(user.uid).doc(id).set(saved).catch(() => {});
    if (!cached) retryLocationSpecies(saved);

    // Stay on the guide for the place just saved, now reading from the real id.
    setPreviewLocation({ ...saved, preview: true, saved: true });

    // Drop the temporary keys.
    setLocationSpeciesCache((prev) => { const next = { ...prev }; delete next[oldId]; return next; });
    setLocationStatus((prev) => { const next = { ...prev }; delete next[oldId]; return next; });
    const dropPreviewKeys = (obj) => {
      const next = { ...obj };
      Object.keys(next).forEach((k) => { if (k.indexOf(oldId + ":") === 0) delete next[k]; });
      return next;
    };
    setSeasonalCache(dropPreviewKeys);
    setSeasonalStatus(dropPreviewKeys);
    seasonalInFlight.current.forEach((k) => { if (k.indexOf(oldId + ":") === 0) seasonalInFlight.current.delete(k); });

    setToast(saved.name + " saved to your locations.");
    setTimeout(() => setToast(null), 4500);
  }

  async function addLocationFromLatLng(lat, lon) {
    // if the tap landed close to a location we already have, just switch to it
    const nearby = locations.find((loc) => {
      const dLat = Math.abs(parseFloat(loc.lat) - lat);
      const dLon = Math.abs(parseFloat(loc.lon) - lon);
      return dLat < 0.03 && dLon < 0.03; // roughly within ~2 miles
    });
    if (nearby) {
      setActiveLocationId(nearby.id);
      return;
    }

    setMapPin({ lat, lng: lon });
    setMapAddStatus("locating");
    setMapAddError("");
    try {
      const geoData = await nominatim("reverse?format=json&lat=" + lat + "&lon=" + lon + "&zoom=12");
      const addr = geoData && geoData.address ? geoData.address : {};
      const label = addr.city || addr.town || addr.village || addr.hamlet || addr.county
        || (geoData && geoData.display_name ? geoData.display_name.split(",")[0] : null)
        || "Dropped pin";
      const displayName = (geoData && geoData.display_name) || (lat.toFixed(4) + ", " + lon.toFixed(4));
      const id = uid();
      const newLoc = { id, name: label, lat: String(lat), lon: String(lon), displayName, updatedAt: nowTs() };
      adoptLocation(newLoc);
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setMapAddStatus("");
      setMapPin(null);
      try {
        const buckets = await fetchSpeciesBuckets(lat, lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setMapAddStatus("");
      setMapPin(null);
      setMapAddError("Couldn't identify that spot. Try tapping again, or use the search box below.");
    }
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      setMapAddError("Your browser doesn't support location services — search or tap the map instead.");
      return;
    }
    setMapAddStatus("locating");
    setMapAddError("");
    navigator.geolocation.getCurrentPosition(
      (pos) => addLocationFromLatLng(pos.coords.latitude, pos.coords.longitude),
      () => {
        setMapAddStatus("");
        setMapAddError("Couldn't get your current location — search or tap the map instead.");
      },
      { timeout: 10000 }
    );
  }

  // The guide's version of the same button: shows you what's around you right
  // now without saving anywhere new.
  async function previewFromLatLng(lat, lon) {
    setPreviewStatus("loading");
    try {
      const geoData = await nominatim("reverse?format=json&lat=" + lat + "&lon=" + lon + "&zoom=12");
      const addr = geoData && geoData.address ? geoData.address : {};
      const label = addr.city || addr.town || addr.village || addr.hamlet || addr.county
        || (geoData && geoData.display_name ? geoData.display_name.split(",")[0] : null)
        || "Where you are";
      const id = "preview:" + lat + "," + lon;
      setPreviewLocation({
        id, name: label, lat: String(lat), lon: String(lon),
        displayName: (geoData && geoData.display_name) || (lat.toFixed(4) + ", " + lon.toFixed(4)),
        preview: true,
      });
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setPreviewStatus("");
      try {
        const buckets = await fetchSpeciesBuckets(lat, lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setPreviewStatus("");
      setAddLocationError("Couldn't work out where that is. Try searching instead.");
    }
  }

  function previewMyLocation() {
    if (!navigator.geolocation) {
      setAddLocationError("Your browser doesn't support location services — try searching instead.");
      return;
    }
    setPreviewStatus("loading");
    setAddLocationError("");
    navigator.geolocation.getCurrentPosition(
      (pos) => previewFromLatLng(pos.coords.latitude, pos.coords.longitude),
      () => {
        setPreviewStatus("");
        setAddLocationError("Couldn't get your current location — try searching instead.");
      },
      { timeout: 10000 }
    );
  }

  // Attaches a coordinate to the sighting being logged. Kept as an explicit
  // button rather than a silent capture on every save: a wildlife record is
  // much more useful with a fix on it, but not at the cost of prompting for
  // location every time someone types a species name.
  function pinSightingSpot() {
    if (!navigator.geolocation) { setFormGeoStatus("unsupported"); return; }
    setFormGeoStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        updateForm("lat", pos.coords.latitude);
        updateForm("lon", pos.coords.longitude);
        setFormGeoStatus("done");
      },
      () => setFormGeoStatus("error"),
      { timeout: 10000, enableHighAccuracy: true }
    );
  }

  function removeLocation(id) {
    if (locations.length <= 1) return;
    if (!window.confirm("Remove this location? Its species guide will be forgotten, but sightings already logged there stay in your data.")) return;
    const remaining = locations.filter((l) => l.id !== id);
    setLocations(remaining);
    if (user) locationsCol(user.uid).doc(id).delete().catch(() => {});
    setLocationSpeciesCache((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setLocationStatus((prev) => { const next = { ...prev }; delete next[id]; return next; });
    if (activeLocationId === id) setActiveLocationId(remaining[0].id);
  }

  // "This patch" — the sightings at the location you're logging from.
  const visibleEntries = useMemo(() => {
    return liveEntries.filter((e) => e.locationId === activeLocationId);
  }, [liveEntries, activeLocationId]);

  const spotTags = useMemo(() => {
    const s = new Set(visibleEntries.map((e) => e.location).filter(Boolean));
    return Array.from(s).sort();
  }, [visibleEntries]);

  const filtered = useMemo(() => {
    return visibleEntries
      .filter((e) => {
        if (search && !e.species.toLowerCase().includes(search.toLowerCase())) return false;
        if (filterCategory !== "all" && e.category !== filterCategory) return false;
        if (filterLocation !== "all" && e.location !== filterLocation) return false;
        if (dateFrom && e.date < dateFrom) return false;
        if (dateTo && e.date > dateTo) return false;
        return true;
      })
      .sort((a, b) => (a.date === b.date ? 0 : a.date < b.date ? 1 : -1));
  }, [visibleEntries, search, filterCategory, filterLocation, dateFrom, dateTo]);

  const speciesSummary = useMemo(() => {
    const map = new Map();
    visibleEntries.forEach((e) => {
      const key = e.species.trim().toLowerCase();
      if (!map.has(key)) {
        map.set(key, { species: e.species.trim(), category: e.category, sightings: 0, totalQty: 0, firstSeen: e.date, lastSeen: e.date });
      }
      const rec = map.get(key);
      rec.sightings += 1;
      rec.totalQty += Number(e.quantity) || 0;
      if (e.date < rec.firstSeen) rec.firstSeen = e.date;
      if (e.date > rec.lastSeen) rec.lastSeen = e.date;
    });
    return Array.from(map.values()).sort((a, b) => b.sightings - a.sightings);
  }, [visibleEntries]);

  const stats = useMemo(() => {
    const uniqueSpecies = speciesSummary.length;
    const totalSightings = visibleEntries.length;
    const categoriesUsed = new Set(visibleEntries.map((e) => e.category)).size;
    return { uniqueSpecies, totalSightings, categoriesUsed };
  }, [visibleEntries, speciesSummary]);

  // The life list: every species you've logged anywhere, ever. This is the
  // number the app is really about, and until now it was computed but only ever
  // rendered on the friends leaderboard — so adding a second location made your
  // headline count appear to reset to zero.
  const lifeList = useMemo(() => {
    const species = new Map();
    liveEntries.forEach((e) => {
      const key = e.species.trim().toLowerCase();
      const rec = species.get(key);
      if (!rec) {
        species.set(key, { species: e.species.trim(), category: e.category, first: e.date, last: e.date, count: 1 });
      } else {
        rec.count += 1;
        if (e.date < rec.first) rec.first = e.date;
        if (e.date > rec.last) rec.last = e.date;
      }
    });
    return { species, uniqueSpecies: species.size, totalSightings: liveEntries.length };
  }, [liveEntries]);

  const lifeSpeciesNames = useMemo(() => new Set(lifeList.species.keys()), [lifeList]);

  // Milestones now track the life list rather than the current patch. A
  // milestone that can un-earn itself by switching location is worse than none.
  const nextMilestone = useMemo(() => {
    const count = lifeList.uniqueSpecies;
    const prevThreshold = [0, ...MILESTONES].filter((m) => m <= count).pop() || 0;
    const target = MILESTONES.find((m) => m > count);
    if (!target) return null;
    return { target, progress: (count - prevThreshold) / (target - prevThreshold) };
  }, [lifeList.uniqueSpecies]);

  const categoryChartData = useMemo(() => {
    return CATEGORIES.map((c) => ({ name: c.label, value: speciesSummary.filter((s) => s.category === c.id).length, color: c.color }))
      .filter((d) => d.value > 0);
  }, [speciesSummary]);

  const usedCategoryIds = useMemo(() => new Set(visibleEntries.map((e) => e.category)), [visibleEntries]);

  function toggleGuideCat(id) {
    setGuideActiveCats((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  }

  const guideSections = useMemo(() => {
    const query = guideSearch.trim().toLowerCase();
    return CATEGORIES
      .filter((c) => guideActiveCats.includes(c.id))
      .map((c) => {
        const names = (speciesForGuide[c.id] || []).filter((name) => {
          const key = name.trim().toLowerCase();
          if (query && !name.toLowerCase().includes(query)) return false;
          // "New to me" means new to the life list — a Cardinal you logged at
          // another location isn't new just because you're standing somewhere else.
          if (guideOnlyNew && lifeSpeciesNames.has(key)) return false;
          // While a month is still loading, hide everything rather than
          // quietly showing the unfiltered list under an active filter.
          if (guideOnlySeason && !seasonalNames) return false;
          if (guideOnlySeason && !seasonalNames.has(key)) return false;
          return true;
        });
        return { category: c, names };
      })
      .filter((s) => s.names.length > 0);
  }, [guideActiveCats, guideSearch, guideOnlyNew, guideOnlySeason, speciesForGuide, lifeSpeciesNames, seasonalNames]);

  // eBird calls this Target Species, and it's the most useful thing in their
  // app: what's likely near you right now that isn't on your list yet. Both
  // halves already existed here — this just puts them together and gives the
  // answer its own card instead of burying it behind a filter chip.
  const targetSpecies = useMemo(() => {
    if (!seasonalNames) return [];
    const byCategory = CATEGORIES.map((c) =>
      (speciesForGuide[c.id] || [])
        .filter((name) => {
          const key = name.trim().toLowerCase();
          return !lifeSpeciesNames.has(key) && seasonalNames.has(key);
        })
        .map((name) => ({ name, categoryId: c.id }))
    );
    // Round-robin across categories so the list isn't six birds every time.
    const out = [];
    for (let i = 0; out.length < 6; i++) {
      let added = false;
      for (const list of byCategory) {
        if (list[i]) { out.push(list[i]); added = true; }
        if (out.length >= 6) break;
      }
      if (!added) break;
    }
    return out;
  }, [speciesForGuide, seasonalNames, lifeSpeciesNames]);

  // How much of what's around this month you've actually found.
  const seasonProgress = useMemo(() => {
    if (!homeSeasonalNames || homeSeasonalNames.size === 0) return null;
    let found = 0;
    homeSeasonalNames.forEach((n) => { if (lifeSpeciesNames.has(n)) found += 1; });
    return { found, total: homeSeasonalNames.size };
  }, [homeSeasonalNames, lifeSpeciesNames]);

  const monthlyChartData = useMemo(() => {
    const seenSpecies = new Set();
    const monthMap = new Map();
    const sorted = [...visibleEntries].sort((a, b) => (a.date === b.date ? 0 : a.date < b.date ? -1 : 1));
    sorted.forEach((e) => {
      const key = e.species.trim().toLowerCase();
      const month = e.date.slice(0, 7);
      if (!seenSpecies.has(key)) {
        seenSpecies.add(key);
        monthMap.set(month, (monthMap.get(month) || 0) + 1);
      }
    });
    return Array.from(monthMap.entries()).sort(([a], [b]) => (a === b ? 0 : a < b ? -1 : 1)).map(([month, newSpecies]) => ({ month, newSpecies }));
  }, [visibleEntries]);

  const availableYears = useMemo(() => {
    const years = new Set(visibleEntries.map((e) => e.date.slice(0, 4)));
    years.add(todayStr().slice(0, 4));
    return Array.from(years).sort((a, b) => b.localeCompare(a));
  }, [visibleEntries]);

  const resetPreviewCount = useMemo(() => {
    if (resetScope === "all") return visibleEntries.length;
    if (resetScope === "month") return visibleEntries.filter((e) => e.date.slice(0, 7) === resetMonth).length;
    if (resetScope === "year") return visibleEntries.filter((e) => e.date.slice(0, 4) === resetYear).length;
    return 0;
  }, [visibleEntries, resetScope, resetMonth, resetYear]);

  function handleScopedReset() {
    if (resetPreviewCount === 0 || !activeLocation) return;
    const label = resetScope === "all" ? "all time" : resetScope === "month" ? resetMonth : resetYear;
    if (!window.confirm("Delete " + resetPreviewCount + " sighting(s) logged in " + activeLocation.name + " for " + label + "? This can't be undone.")) return;

    // Decide what's going before touching state. This used to push ids from
    // inside the setEntries updater and read them on the very next line, which
    // only worked while React happened to evaluate the updater eagerly — with
    // another update to entries already pending, the array was still empty and
    // the cloud copies were never deleted.
    const doomed = visibleEntries.filter((e) => {
      if (resetScope === "all") return true;
      if (resetScope === "month") return e.date.slice(0, 7) === resetMonth;
      if (resetScope === "year") return e.date.slice(0, 4) === resetYear;
      return false;
    });
    if (!doomed.length) return;

    const stones = new Map(doomed.map((e) => [e.id, tombstoneFor(e)]));
    commitEntries((prev) => prev.map((e) => stones.get(e.id) || e));
    doomed.forEach((e) => { if (e.hasPhoto) forgetPhoto(e.id); });

    if (user) {
      commitInChunks(doomed.map((e) => (batch) => batch.set(entriesCol(user.uid).doc(e.id), stones.get(e.id)))).catch(() => {});
      const withPhotos = doomed.filter((e) => e.hasPhoto);
      if (withPhotos.length) {
        commitInChunks(withPhotos.map((e) => (batch) => batch.delete(photosCol(user.uid).doc(e.id)))).catch(() => {});
      }
    }
  }

  async function resetAllData() {
    if (confirmResetText.trim().toUpperCase() !== "RESET") return;
    try {
      localStorage.removeItem(STORAGE_KEYS.entries);
      localStorage.removeItem(STORAGE_KEYS.locations);
      localStorage.removeItem(STORAGE_KEYS.activeLocation);
    } catch (err) { /* ignore */ }
    // Photos live in IndexedDB now, so a full reset has to clear them too.
    try {
      const ids = await allPhotoIds();
      await Promise.all(ids.map((id) => forgetPhoto(id)));
      photoMemCache.clear();
    } catch (err) { /* ignore */ }
    if (user) {
      try {
        const cloud = await pullCloudData(user.uid);
        await commitInChunks(cloud.entries.map((e) => (batch) => batch.delete(entriesCol(user.uid).doc(e.id))));
        await commitInChunks(cloud.locations.map((l) => (batch) => batch.delete(locationsCol(user.uid).doc(l.id))));
        const photoSnap = await photosCol(user.uid).get();
        await commitInChunks(photoSnap.docs.map((d) => (batch) => batch.delete(photosCol(user.uid).doc(d.id))));
      } catch (err) { /* ignore — the local wipe still succeeds */ }
    }
    entriesRef.current = [];
    setEntries([]);
    setLocations([]);
    setLocationSpeciesCache({});
    setLocationStatus({});
    setSeasonalCache({});
    setSeasonalStatus({});
    setPreviewLocation(null);
    setActiveLocationId(null);
    setConfirmResetText("");
    setTab("log");
  }

  // Moves any photo still stored inline on an entry into IndexedDB and strips
  // it off the record. Runs against both local and cloud data, so an existing
  // log migrates itself the first time this version loads.
  async function migrateInlinePhotos(list, overwrite) {
    const movedIds = new Set();
    const out = [];
    for (const e of list) {
      if (e && typeof e.photo === "string" && e.photo.indexOf("data:") === 0) {
        try {
          // Don't clobber a blob we already hold — the same entry can arrive
          // from the cloud carrying an older inline copy than the one on disk.
          // An import is the exception: there, the file is the authority.
          const existing = overwrite ? null : await getPhotoCached(e.id);
          if (!existing) await setPhotoCached(e.id, e.photo);
          movedIds.add(e.id);
          const copy = { ...e, hasPhoto: true, photoUploaded: !!e.photoUploaded };
          delete copy.photo;
          out.push(copy);
          continue;
        } catch (err) {
          // IndexedDB unavailable (private mode in some browsers). Leave the
          // inline copy in place — EntryPhoto renders it directly.
        }
      }
      out.push(e);
    }
    return { list: out, movedIds };
  }

  // Applies a completed migration to whatever the entry list looks like *now*.
  // The migration awaits a series of IndexedDB writes, so the list it started
  // from can be several sightings out of date by the time it finishes.
  function applyMigration(prev, movedIds) {
    if (!movedIds.size) return prev;
    return prev.map((e) => {
      if (!movedIds.has(e.id) || typeof e.photo !== "string") return e;
      const copy = { ...e, hasPhoto: true, photoUploaded: !!e.photoUploaded };
      delete copy.photo;
      return copy;
    });
  }

  React.useEffect(() => {
    let alive = true;
    migrateInlinePhotos(entriesRef.current).then(async ({ movedIds }) => {
      if (!alive) return;
      if (movedIds.size > 0) commitEntries((prev) => applyMigration(prev, movedIds));
      // Sweep up blobs nothing points at any more — a sighting deleted on
      // another device arrives here as a tombstone, and its photo would
      // otherwise sit in IndexedDB forever.
      try {
        // Never sweep against an empty entry list. localStorage and IndexedDB
        // are evicted independently, so "no entries" can mean "localStorage was
        // cleared and these blobs are all we have left" — deleting them then
        // would destroy the only remaining copy.
        if (!entriesRef.current.length) return;
        const ids = await allPhotoIds();
        if (!alive || !ids.length) return;
        const keep = new Set(entriesRef.current.filter((e) => !e.deletedAt && e.hasPhoto).map((e) => e.id));
        const orphans = ids.filter((id) => !keep.has(id));
        await Promise.all(orphans.map((id) => forgetPhoto(id)));
      } catch (err) { /* best effort */ }
    });
    return () => { alive = false; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function syncOnSignIn(uid) {
    setSyncStatus("syncing");
    try {
      const cloud = await pullCloudData(uid);
      const cloudMigrated = await migrateInlinePhotos(cloud.entries);
      const localMigrated = await migrateInlinePhotos(entriesRef.current);

      const merged = purgeOldTombstones(mergeById(localMigrated.list, cloudMigrated.list));
      // Stamp a *stable* timestamp on locations that predate the field, rather
      // than a fresh one each sync — otherwise every sync saw them as newer and
      // re-uploaded the lot.
      const mergedLocations = mergeById(locations, cloud.locations).map((l) => (l.updatedAt ? l : { ...l, updatedAt: 1 }));

      const cloudById = new Map(cloud.entries.map((e) => [e.id, e]));
      const cloudLocById = new Map(cloud.locations.map((l) => [l.id, l]));
      const finalLocations = mergedLocations.length ? mergedLocations : locations;

      // Push anything the cloud is missing OR holds an older copy of. The old
      // version only uploaded ids the cloud had never seen, so an edit made
      // offline — toggling Share, say — merged into local state and then
      // silently never left the device.
      const entryOps = [];
      merged.forEach((e) => {
        const remote = cloudById.get(e.id);
        const stale = !remote || (e.updatedAt || 0) > (remote.updatedAt || 0) || remote.photo !== undefined;
        if (!stale) return;
        const payload = { ...e, shared: !!e.shared };
        delete payload.photo;
        entryOps.push((batch) => batch.set(entriesCol(uid).doc(e.id), payload));
      });
      finalLocations.forEach((l) => {
        const remote = cloudLocById.get(l.id);
        if (!remote || (l.updatedAt || 0) > (remote.updatedAt || 0)) {
          entryOps.push((batch) => batch.set(locationsCol(uid).doc(l.id), l));
        }
      });
      await commitInChunks(entryOps);

      // Photos go up separately and in much smaller batches — a batch is capped
      // at roughly 10MiB of payload, and 400 photos would blow straight past it.
      const needsPhotoUpload = merged.filter((e) => e.hasPhoto && !e.photoUploaded && !e.deletedAt);
      const uploaded = [];
      for (let i = 0; i < needsPhotoUpload.length; i += BATCH_BLOBS) {
        const slice = needsPhotoUpload.slice(i, i + BATCH_BLOBS);
        const datas = await Promise.all(slice.map((e) => getPhotoCached(e.id)));
        const batch = db.batch();
        let ops = 0;
        slice.forEach((e, idx) => {
          if (!datas[idx]) return;
          batch.set(photosCol(uid).doc(e.id), { data: datas[idx], updatedAt: nowTs() });
          uploaded.push(e.id);
          ops++;
        });
        if (ops) await batch.commit();
      }

      const uploadedSet = new Set(uploaded);
      const finalEntries = uploadedSet.size
        ? merged.map((e) => (uploadedSet.has(e.id) ? { ...e, photoUploaded: true } : e))
        : merged;

      // Merge the sync result back into whatever is current rather than
      // replacing it. A sync can take a while, and anything the user logged
      // while it ran lives only in `prev` — assigning the snapshot wholesale
      // would silently delete it from both state and storage.
      const migratedIds = new Set();
      cloudMigrated.movedIds.forEach((id) => migratedIds.add(id));
      localMigrated.movedIds.forEach((id) => migratedIds.add(id));
      commitEntries((prev) => {
        const merged2 = applyMigration(purgeOldTombstones(mergeById(prev, finalEntries)), migratedIds);
        // Neither migration nor a photo upload bumps updatedAt, so both lose
        // the merge on a tie and have to be re-applied by id afterwards.
        // Without this the photoUploaded flag reverts and every photo uploads
        // again on the next sync, and the one after that.
        if (!uploadedSet.size) return merged2;
        return merged2.map((e) => (uploadedSet.has(e.id) ? { ...e, photoUploaded: true } : e));
      });

      if (mergedLocations.length) setLocations(mergedLocations);
      // Cloud copies of photos belonging to deleted sightings, including ones
      // deleted on this device while signed out.
      // A tombstone carries no payload, so we can't tell from it whether the
      // sighting had a photo. Deleting unconditionally is fine — deleting a
      // document that isn't there is a no-op — and it's the only thing that
      // cleans up a photo for a sighting deleted while signed out.
      const tombstoned = merged.filter((e) => e.deletedAt);
      if (tombstoned.length) {
        commitInChunks(tombstoned.map((e) => (batch) => batch.delete(photosCol(uid).doc(e.id)))).catch(() => {});
        tombstoned.forEach((e) => forgetPhoto(e.id));
      }

      // Tombstones past their expiry are dropped from the cloud too. Purging
      // only locally meant the next sync pulled the same expired tombstone back
      // down, dropped it again, and repeated that forever while the collection
      // grew without bound.
      const keptIds = new Set(merged.map((e) => e.id));
      const expired = cloudMigrated.list.filter((e) => e.deletedAt && !keptIds.has(e.id));
      if (expired.length) {
        commitInChunks(expired.map((e) => (batch) => batch.delete(entriesCol(uid).doc(e.id)))).catch(() => {});
      }

      // Mark the uploaded flag in the cloud too, so another device doesn't
      // re-upload the same photos.
      if (uploadedSet.size) {
        await commitInChunks(uploaded.map((id) => (batch) =>
          batch.set(entriesCol(uid).doc(id), { photoUploaded: true }, { merge: true })));
      }

      setSyncStatus("done");
    } catch (err) {
      setSyncStatus(err && err.code === "permission-denied" ? "denied" : "error");
    }
  }

  async function refreshSocialData(uid) {
    try {
      const [outSnap, inSnap, fromSnap, toSnap] = await Promise.all([
        db.collection("friendRequests").where("from", "==", uid).where("status", "==", "pending").get(),
        db.collection("friendRequests").where("to", "==", uid).where("status", "==", "pending").get(),
        db.collection("friendRequests").where("from", "==", uid).where("status", "==", "accepted").get(),
        db.collection("friendRequests").where("to", "==", uid).where("status", "==", "accepted").get(),
      ]);
      setOutgoingRequests(outSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setIncomingRequests(inSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
      const otherUids = Array.from(new Set([
        ...fromSnap.docs.map((d) => d.data().to),
        ...toSnap.docs.map((d) => d.data().from),
      ]));
      const friendDocs = await Promise.all(otherUids.map((otherUid) => db.collection("users").doc(otherUid).get()));
      // Their life lists come from the friends-only subcollection. A friend who
      // hasn't opened the app since this shipped simply has no document yet,
      // which the comparison UI reports rather than treating as an empty list.
      const friendLists = await Promise.all(otherUids.map((otherUid) =>
        socialListDoc(otherUid).get()
          .then((snap) => (snap.exists ? snap.data().species || [] : null))
          .catch(() => null)
      ));
      const listByUid = {};
      otherUids.forEach((otherUid, i) => { listByUid[otherUid] = friendLists[i]; });
      setFriends(friendDocs.filter((d) => d.exists).map((d) => ({
        uid: d.id,
        ...d.data(),
        speciesList: listByUid[d.id] || null,
      })));
    } catch (err) {
      setFriendError("Couldn't load friend data — try refreshing.");
    }
  }

  function friendlyAuthError(err) {
    const code = err && err.code;
    if (code === "auth/email-already-in-use") return "That email already has an account — try signing in instead.";
    if (code === "auth/invalid-email") return "That doesn't look like a valid email.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential") return "Email or password didn't match.";
    return "Something went wrong — try again.";
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    setAuthError("");
    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(authEmail.trim(), authPassword);
        if (authDisplayName.trim()) {
          await cred.user.updateProfile({ displayName: authDisplayName.trim() });
        }
        await db.collection("users").doc(cred.user.uid).set({
          email: normalizeEmail(authEmail),
          displayName: authDisplayName.trim() || authEmail.trim(),
          stats: globalStats,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      } else {
        await auth.signInWithEmailAndPassword(authEmail.trim(), authPassword);
      }
      setAuthPassword("");
    } catch (err) {
      setAuthError(friendlyAuthError(err));
    }
    setAuthBusy(false);
  }

  function signOutUser() {
    auth.signOut();
  }

  function handleForgotPassword() {
    const email = authEmail.trim();
    if (!email) {
      setAuthError("Type your email above first, then tap \"Forgot password?\" again.");
      return;
    }
    setAuthError("");
    setAuthBusy(true);
    auth.sendPasswordResetEmail(email)
      .then(() => setAuthError("Reset email sent — check your inbox (and spam folder) for a link."))
      .catch(() => setAuthError("Couldn't send a reset email for that address."))
      .finally(() => setAuthBusy(false));
  }

  async function sendFriendRequest(e) {
    e.preventDefault();
    if (!user) return;
    const email = normalizeEmail(friendEmail);
    if (!email) return;
    if (email === normalizeEmail(user.email)) { setFriendError("That's your own email."); return; }
    setFriendBusy(true);
    setFriendError("");
    try {
      const targetSnap = await db.collection("users").where("email", "==", email).limit(1).get();
      if (targetSnap.empty) {
        setFriendError("No account found with that email.");
        setFriendBusy(false);
        return;
      }
      const targetUid = targetSnap.docs[0].id;
      const reverseId = targetUid + "_" + user.uid;
      const reverseDoc = await db.collection("friendRequests").doc(reverseId).get();
      if (reverseDoc.exists && reverseDoc.data().status === "pending") {
        await db.collection("friendRequests").doc(reverseId).update({ status: "accepted" });
        setFriendEmail("");
        await refreshSocialData(user.uid);
        setFriendBusy(false);
        return;
      }
      const forwardId = user.uid + "_" + targetUid;
      const existing = await db.collection("friendRequests").doc(forwardId).get();
      if (existing.exists && existing.data().status === "accepted") {
        setFriendError("You're already friends.");
        setFriendBusy(false);
        return;
      }
      if (existing.exists && existing.data().status === "pending") {
        setFriendError("Friend request already sent.");
        setFriendBusy(false);
        return;
      }
      await db.collection("friendRequests").doc(forwardId).set({
        from: user.uid,
        to: targetUid,
        fromEmail: normalizeEmail(user.email),
        toEmail: email,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setFriendEmail("");
      await refreshSocialData(user.uid);
    } catch (err) {

  async function loadFeed() {
    if (!user || friends.length === 0) { setFeedEntries([]); return; }
    setFeedLoading(true);
    setFeedError("");
    try {
      // Still no .orderBy() on a different field from the .where() — that
      // combination needs a composite index the user would have to create by
      // hand. But there is a limit now: this used to pull every shared sighting
      // a friend had ever made, photos included, and then throw away all but
      // forty of them. Photos are no longer on the entry documents at all;
      // each post fetches its own once it's on screen.
      const perFriend = await Promise.all(friends.map((f) =>
        db.collection("users").doc(f.uid).collection("entries")
          .where("shared", "==", true)
          .limit(40)
          .get()
          .then((snap) => snap.docs.map((d) => {
            const data = d.data();
            delete data.photo; // in case a friend hasn't migrated yet
            return {
              id: d.id, ownerUid: f.uid,
              ownerName: f.displayName || f.email || "Friend",
              ownerAvatar: f.avatar || null,
              ...data,
            };
          }))
          .catch(() => [])
      ));
      const merged = perFriend.flat()
        .filter((p) => !p.deletedAt)
        .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.updatedAt || 0) - (a.updatedAt || 0));
      setFeedEntries(merged.slice(0, 40));

  const REACTION_EMOJI = "🌿";

  async function toggleReaction(post) {
    if (!user) return;
    const already = post.reactions && post.reactions[user.uid];
    const path = "reactions." + user.uid;
    // Bumping updatedAt here (even though a friend, not the owner, is
    // writing it) matters: mergeById picks whichever copy of an entry has
    // the newer updatedAt, wholesale. Without this, the owner's own device
    // would never realize the cloud copy has a reaction it doesn't, and
    // the reaction would never surface back to them on their next sync.
    const update = already
      ? { [path]: firebase.firestore.FieldValue.delete(), updatedAt: nowTs() }
      : { [path]: { emoji: REACTION_EMOJI, name: user.displayName || user.email, at: nowTs() }, updatedAt: nowTs() };
    try {
      await db.collection("users").doc(post.ownerUid).collection("entries").doc(post.id).update(update);
      setFeedEntries((prev) => prev.map((p) => {
        if (p.id !== post.id || p.ownerUid !== post.ownerUid) return p;
        const reactions = { ...(p.reactions || {}) };
        if (already) delete reactions[user.uid];
        else reactions[user.uid] = { emoji: REACTION_EMOJI, name: user.displayName || user.email, at: nowTs() };
        return { ...p, reactions };
      }));
    } catch (err) { /* ignore — not worth surfacing an error for a reaction tap */ }
  }

  function commentsCol(ownerUid, entryId) {

  const hasNotifications = useMemo(() => {

  // A friend's reaction only ever lands in Firestore, and local entries used to
  // pick it up solely through syncOnSignIn — so the notification dot couldn't
  // appear until you signed out and back in. Poll your own shared sightings
  // instead, on sign-in and every couple of minutes while the app is open.
  async function refreshMyReactions(uid) {
    try {
      const snap = await entriesCol(uid).where("shared", "==", true).limit(50).get();
      const byId = new Map();
      snap.docs.forEach((d) => {
        const data = d.data();
        if (data.reactions) byId.set(d.id, data.reactions);
      });
      if (!byId.size) return;
      const current = entriesRef.current;
      const changed = current.some((e) => {
        const incoming = byId.get(e.id);
        if (!incoming) return false;
        return JSON.stringify(incoming) !== JSON.stringify(e.reactions || null);
      });
      if (!changed) return;
      commitEntries((prev) => prev.map((e) => (byId.has(e.id) ? { ...e, reactions: byId.get(e.id) } : e)));
    } catch (err) { /* not worth surfacing */ }
  }

  // ---- celebrations ----
  // Rewritten to say something true about the sighting rather than to pay out
  // for volume. A reward that signals competence or luck survives contact with
  // an activity people already enjoy; one that just counts tends to displace
  // the reason they were doing it. Milestones are still here, but as the
  // fallback rather than the whole vocabulary — and they now track the life
  // list, so they can't un-earn themselves when you switch location.
  function celebrationFor(entry) {
    const key = entry.species.trim().toLowerCase();
    if (lifeSpeciesNames.has(key)) return null;

    const monthIndex = Number(entry.date.slice(5, 7)) - 1;
    const monthName = MONTH_NAMES[monthIndex] || "this month";
    const cat = catMeta(entry.category);
    const catLabel = cat.label.toLowerCase();

    // Something genuinely uncommon for the place and time of year.
    if (homeSeasonalNames && homeSeasonalNames.size > 0 && !homeSeasonalNames.has(key)) {
      return entry.species + " isn't commonly reported around here in " + monthName + " — nice find.";
    }
    // First of its kind on the life list.
    const seenThisCategory = liveEntries.some((e) => e.category === entry.category);
    if (!seenThisCategory) return "First " + catLabel + " on your life list.";
    // First of its kind in this month of the year.
    const seenThisCategoryThisMonth = liveEntries.some(
      (e) => e.category === entry.category && e.date.slice(5, 7) === entry.date.slice(5, 7)
    );
    if (!seenThisCategoryThisMonth) return "First " + catLabel + " you've logged in " + monthName + ".";
    // A round number, as a fallback rather than the headline.
    const next = lifeList.uniqueSpecies + 1;
    const crossed = MILESTONES.find((m) => lifeList.uniqueSpecies < m && next >= m);
    if (crossed) return crossed + " species on your life list.";
    return entry.species + " is new to your life list.";
  }

  function updateForm(field, value) { setForm((f) => ({ ...f, [field]: value })); }

  async function addEntry(e) {
    e.preventDefault();
    if (!form.species.trim()) return;
    // This handler awaits an IndexedDB write before it clears the form, so
    // without a guard a double-tap on "Add sighting" logs the same thing twice
    // under two different ids.
    if (addingEntryRef.current) return;
    addingEntryRef.current = true;
    setAddingEntry(true);
    try {
      await submitEntry();
    } finally {
      addingEntryRef.current = false;
      setAddingEntry(false);
    }
  }

  async function submitEntry() {
    const id = uid();

    // The photo goes to IndexedDB first. If that fails we say so and save the
    // sighting without it, rather than pretending it worked.
    let photoSaved = false;
    if (form.photo) {
      try {
        await setPhotoCached(id, form.photo);
        photoSaved = true;
        setPhotoError("");
      } catch (err) {
        setPhotoError("That photo couldn't be stored, so the sighting was saved without it.");
      }
    }

    const entry = {
      id,
      species: form.species.trim(),
      category: form.category,
      date: form.date || todayStr(),
      time: form.time || "",
      quantity: Math.max(1, Number(form.quantity) || 1),
      location: form.location.trim(),
      note: form.note.trim(),
      lat: form.lat === null || form.lat === undefined ? null : form.lat,
      lon: form.lon === null || form.lon === undefined ? null : form.lon,
      hasPhoto: photoSaved,
      photoUploaded: false,
      locationId: activeLocation.id,
      locationName: activeLocation.name,
      shared: false,
      updatedAt: nowTs(),
    };

    // Worked out before the entry lands, while the life list still reflects
    // everything logged up to this point.
    const celebration = celebrationFor(entry);

    if (!commitEntries((prev) => [entry, ...prev])) {
      // The write was refused, so don't leave an orphaned photo behind.
      if (photoSaved) forgetPhoto(id);
      return;
    }

    if (celebration) {
      setToast(celebration);
      setTimeout(() => setToast(null), 5000);
    }

    if (user) {
      entriesCol(user.uid).doc(id).set(entry).catch(() => {});
      if (photoSaved) {
        photosCol(user.uid).doc(id).set({ data: form.photo, updatedAt: nowTs() })
          .then(() => commitEntries((prev) => prev.map((x) => (x.id === id ? { ...x, photoUploaded: true } : x))))
          .catch(() => { /* picked up by the next sync */ });
      }
    }

    setForm({ ...emptyForm, category: form.category, location: form.location });
    setFormGeoStatus("");
  }

  // Deleting writes a tombstone rather than dropping the record. An absence
  // always lost the merge, so a sighting deleted on one device came straight
  // back from any device that still held a copy.
  function removeEntry(id) {
    if (!window.confirm("Remove this sighting? This can't be undone.")) return;
    const target = entriesRef.current.find((e) => e.id === id);
    const stone = tombstoneFor({ id });
    commitEntries((prev) => prev.map((e) => (e.id === id ? stone : e)));
    if (target && target.hasPhoto) forgetPhoto(id);
    if (user) {
      entriesCol(user.uid).doc(id).set(stone).catch(() => {});
      if (target && target.hasPhoto) photosCol(user.uid).doc(id).delete().catch(() => {});
    }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // The JSON export is the real backup, so photos are pulled back out of
  // IndexedDB and inlined. Reimporting it restores them.
  async function exportJSON() {
    setExportBusy(true);
    try {
      const live = living(entriesRef.current);
      const withPhotos = await Promise.all(live.map(async (e) => {
        if (!e.hasPhoto) return e;
        const data = await getPhotoCached(e.id);
        return data ? { ...e, photo: data } : e;
      }));
      const blob = new Blob([JSON.stringify(withPhotos, null, 2)], { type: "application/json" });
      triggerDownload(blob, "backyard-field-log.json");
    } catch (err) {
      setImportError("Couldn't build the export — try again.");
    }
    setExportBusy(false);
  }

  // A leading =, +, - or @ makes Excel and Sheets treat a cell as a formula, so
  // a species or note typed as =HYPERLINK("http://evil","x") would execute on
  // open. Prefixing a single quote neutralises it without changing what the
  // reader sees.
  function csvEscape(v) {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if (s.includes(",") || s.includes('"') || s.includes("\n")) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  // CSV is for spreadsheets, not for restoring — it can't carry photos. It now
  // at least carries everything else, including the fields the old export
  // silently dropped.
  function exportCSV() {
    const header = ["species", "category", "date", "time", "quantity", "location", "locationName", "lat", "lon", "note", "shared"];
    const rows = living(entriesRef.current).map((e) => header.map((h) => csvEscape(e[h])).join(","));
    const csv = [header.join(","), ...rows].join("\n");
    triggerDownload(new Blob([csv], { type: "text/csv" }), "backyard-field-log.csv");
  }

  // Imports now go through the same merge the cloud sync uses, so re-importing
  // a file is harmless. The old version prepended unconditionally: importing
  // twice produced two records sharing one id, and pushing an older backup
  // could overwrite newer cloud entries at those ids without a word.
  function handleImport(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportError("");
    setImportReport(null);
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("bad format");

        const cleaned = data.filter((d) => d && d.species).map((d) => ({
          id: d.id || uid(),
          species: String(d.species),
          category: CATEGORIES.some((c) => c.id === d.category) ? d.category : "other",
          date: d.date || todayStr(),
          time: d.time || "",
          quantity: Number(d.quantity) || 1,
          location: d.location || "",
          note: d.note || "",
          photo: d.photo || null,
          lat: d.lat === undefined ? null : d.lat,
          lon: d.lon === undefined ? null : d.lon,
          hasPhoto: !!d.hasPhoto,
          photoUploaded: false,
          locationId: d.locationId || activeLocationId,
          locationName: d.locationName || activeLocation.name,
          shared: !!d.shared,
          deletedAt: d.deletedAt || null,
          updatedAt: d.updatedAt || nowTs(),
        }));

        // Any inline photos in the file go straight into IndexedDB.
        const migrated = await migrateInlinePhotos(cleaned, true);
        const incoming = migrated.list.map((c) => {
          const copy = { ...c };
          if (!copy.deletedAt) delete copy.deletedAt;
          if (copy.photo === null) delete copy.photo;
          return copy;
        });

        const before = entriesRef.current;
        const beforeIds = new Set(before.filter((x) => !x.deletedAt).map((x) => x.id));
        const added = incoming.filter((x) => !beforeIds.has(x.id)).length;
        const merged = purgeOldTombstones(mergeById(before, incoming));

        if (!commitEntries(merged)) return;
        setImportReport({ added, skipped: incoming.length - added, total: incoming.length });

        // Upload only what came in, and with a full set rather than a merge:
        // merging a tombstone onto an existing document would leave the old
        // species, note and photo fields in place beside `deletedAt` — quietly
        // reviving content the owner had deleted, still matching the feed's
        // `shared == true` query.
        if (user && incoming.length) {
          const winners = new Map(merged.map((m) => [m.id, m]));
          commitInChunks(incoming.map((c) => (batch) => {
            const payload = { ...(winners.get(c.id) || c) };
            delete payload.photo;
            return batch.set(entriesCol(user.uid).doc(c.id), payload);
          })).catch(() => {});
        }
      } catch (err) {
        setImportError("Couldn't read that file. Import a JSON export from this app.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
