<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }

  :root {
    --bg: #F1EBDC;
    --card-bg: #FFFCF5;
    --card-bg-soft: #FBF6E9;
    --border: #DED2B6;
    --border-soft: #EAE1CB;
    --text: #17241D;
    --text-muted: #6B7A72;
    --text-dim: #93A099;
    --tabs-bg: #E9DFC7;
    --input-bg: #FFFCF5;
    --shadow: rgba(23,36,29,0.10);
    --accent: #2E6B3E;
    --accent-contrast: #FFFFFF;
    /* Flat "secondary" buttons (Sign out, Import, filter chips, reactions…)
       get their own fill distinct from --card-bg so they read as tappable
       controls instead of blending into the card they sit on. */
    --btn-bg: #E9E1CC;
    --btn-border: #CBBD98;
  }
  [data-theme="dark"] {
    --bg: #12150F;
    --card-bg: #1C2118;
    --card-bg-soft: #20251B;
    --border: #303829;
    --border-soft: #262C20;
    --text: #ECEFE5;
    --text-muted: #9FAE99;
    --text-dim: #6E7A69;
    --tabs-bg: #1A1E15;
    --input-bg: #1A1E15;
    --shadow: rgba(0,0,0,0.4);
    --btn-bg: var(--card-bg);
    --btn-border: var(--border);
  }

  /* Nature palettes — swap the accent used for primary buttons, the "you"
     highlight, the Log tab, and chart bars. Backgrounds/text stay governed
     by light/dark mode above so the two controls combine independently. */
  [data-palette="meadow"] { --accent: #A98221; --accent-contrast: #FFFFFF; }
  [data-palette="sunset"] { --accent: #C1552F; --accent-contrast: #FFFFFF; }
  [data-palette="ocean"]  { --accent: #1F6FA3; --accent-contrast: #FFFFFF; }

  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); transition: background .15s ease, color .15s ease; }
  .ffont { font-family: 'Spectral', serif; }
  .mfont { font-family: 'IBM Plex Mono', monospace; }
  input, select, textarea, button { font-family: 'Inter', sans-serif; }
  button { cursor: pointer; }
  ::placeholder { color: var(--text-dim); }
  #root { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }

  .skel {
    background: linear-gradient(90deg, var(--border-soft) 25%, var(--border) 37%, var(--border-soft) 63%);
    background-size: 400% 100%;
    animation: skel-pulse 1.4s ease infinite;
  }
  @keyframes skel-pulse {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  /* Base layout for the tab bar lives here, not in the inline style object,
     so the mobile media query below can actually override it. */
  .tabs-nav { margin-bottom: 16px; border-radius: 12px; flex-wrap: wrap; }

  .leaflet-container { font-family: 'Inter', sans-serif; background: var(--card-bg-soft) !important; }
  [data-theme="dark"] .leaflet-tile-pane { filter: brightness(0.78) invert(1) contrast(0.85) hue-rotate(200deg) saturate(0.55); }
  [data-theme="dark"] .leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: #ccc !important; }
  [data-theme="dark"] .leaflet-control-attribution a { color: #9dd6ff !important; }

  /* Respect the OS "reduce motion" setting — the skeleton shimmer and the
     theme transitions used to run regardless. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .skel { animation: none; background: var(--border-soft); }
  }

  /* Keyboard users need to see where they are. */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (max-width: 640px) {
    .tabs-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0;
      border-radius: 0;
      z-index: 40;
      box-shadow: 0 -4px 16px var(--shadow);
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #root { padding-bottom: 92px; }
  }
</style>

}

// Defers everything inside it until it scrolls near the viewport. The field
// guide renders up to 166 species cards, each of which used to fire a Wikipedia
// summary request and an audio-media request the moment it mounted — 332 calls
// to one host, six at a time, before a single card was on screen.
function LazyMount({ minHeight, children }) {
  const ref = React.useRef(null);
  const [visible, setVisible] = useState(false);

  React.useEffect(() => {
    if (visible) return;
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === "undefined") { setVisible(true); return; }
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { setVisible(true); io.disconnect(); }
    }, { rootMargin: "400px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, [visible]);

  if (visible) return children;
  return <div ref={ref} style={{ minHeight: minHeight || 96 }} aria-hidden="true" />;
}

// Photos come from IndexedDB, falling back to the cloud on a device that hasn't
// seen them yet. Rendering is async by nature now, so this holds the space and
// fills it when the data lands.
// `inline` is the legacy data URL still sitting on the entry, for the case
// where IndexedDB is unavailable (Firefox private mode, Safari with site data
// blocked) and the migration deliberately left the photo where it was. Without
// this the photo would simply vanish from the interface even though it's right
// there in the record.
function EntryPhoto({ entryId, uid, alt, style, fallback, inline }) {
  const [src, setSrc] = useState(() => inline || photoMemCache.get(entryId) || null);

  React.useEffect(() => {
    let alive = true;
    if (inline) { setSrc(inline); return; }
    const cached = photoMemCache.get(entryId);
    if (cached) { setSrc(cached); return; }
    resolvePhoto(entryId, uid).then((data) => { if (alive && data) setSrc(data); });
    return () => { alive = false; };
  }, [entryId, uid, inline]);

  if (!src) return fallback || null;
  return <img src={src} alt={alt || ""} style={style} loading="lazy" />;
}

// Same idea for a friend's sighting in the feed: only fetched once the post is
// actually on screen.
function FriendPhoto({ ownerUid, entryId, style }) {
  const [src, setSrc] = useState(null);

  React.useEffect(() => {
    let alive = true;
    resolveFriendPhoto(ownerUid, entryId).then((data) => { if (alive) setSrc(data); });
    return () => { alive = false; };
  }, [ownerUid, entryId]);

  if (!src) return null;
  return <img src={src} alt="" style={style} loading="lazy" />;
}

const wikiCache = {};

function fetchTaxonPhoto(name) {
  return fetch("https://api.inaturalist.org/v1/taxa?q=" + encodeURIComponent(name) + "&per_page=1&is_active=true", { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("no taxon"); return res.json(); })
    .then((data) => {
      const taxon = data.results && data.results[0];
      const photo = taxon && taxon.default_photo;
      if (!photo) return null;
      return photo.medium_url || photo.square_url || null;
    })
    .catch(() => null);
}

function fetchWikiSummary(name) {
  const key = name.toLowerCase();
  if (wikiCache[key]) return wikiCache[key];
  const promise = fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(name), { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("not found"); return res.json(); })
    .then((data) => ({
      extract: data.extract || "",
      thumbnail: data.thumbnail ? data.thumbnail.source : null,
      pageUrl: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || ("https://en.wikipedia.org/wiki/" + encodeURIComponent(name.replace(/ /g, "_"))),
      imageSource: data.thumbnail ? "wikipedia" : null,
    }))
    .catch(() => ({
      extract: "",
      thumbnail: null,
      pageUrl: "https://en.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(name),
      imageSource: null,
    }))
    .then((result) => {
      if (result.thumbnail) return result;
      return fetchTaxonPhoto(name).then((photoUrl) => {
        return photoUrl ? { ...result, thumbnail: photoUrl, imageSource: "inaturalist" } : result;
      });
    });
  wikiCache[key] = promise;
  return promise;
}

const soundCache = {};

// Wikimedia Commons hosts a lot of wildlife call/song recordings embedded
// right in species' Wikipedia articles. We ask Wikipedia's own media-list
// API (the same en.wikipedia.org host the species descriptions already use)
// for that page's media, and pick out any audio file — filtering out the
// human "how do you pronounce this word" clips some pages have, which use
// a recognizable filename pattern. This endpoint allows cross-site
// requests directly (verified live), so no proxy is needed, and playback
// itself never requires CORS at all. Coverage is real but not universal —
// well-documented birds tend to have one or two recordings; many other
// species have none, in which case we simply show nothing.
const PRONUNCIATION_FILE_RE = /^(en-us-|ll-q)/i;

function fetchTaxonSound(name) {
  const key = name.toLowerCase();
  if (soundCache[key]) return soundCache[key];
  const promise = fetch("https://en.wikipedia.org/api/rest_v1/page/media-list/" + encodeURIComponent(name), { headers: { Accept: "application/json" } })
    .then((res) => { if (!res.ok) throw new Error("no media"); return res.json(); })
    .then((data) => {
      const items = (data && data.items) || [];
      const audio = items.find((i) => {
        if (i.type !== "audio" || !i.title) return false;
        const filename = i.title.replace(/^File:/, "");
        return !PRONUNCIATION_FILE_RE.test(filename);
      });
      if (!audio) return null;
      const filename = audio.title.replace(/^File:/, "");
      const url = "https://en.wikipedia.org/wiki/Special:FilePath/" + encodeURIComponent(filename);
      const caption = (audio.caption && audio.caption.text) || "";
      return { url, caption };
    })
    .catch(() => null);
  soundCache[key] = promise;
  return promise;
}

// The audio lookup now waits for a press. It used to run on mount for every
// species in the guide, which doubled the request count to fetch recordings
// almost nobody played. The trade is that we can't know in advance whether a
// recording exists, so the button shows optimistically and reports honestly
// when there's nothing there.
function SoundButton({ name, onSound }) {
  const [status, setStatus] = useState("idle"); // idle | loading | ready | none
  const [sound, setSound] = useState(null);
  const [playing, setPlaying] = useState(false);
  const audioRef = React.useRef(null);

  const aliveRef = React.useRef(true);
  React.useEffect(() => {
    aliveRef.current = true;
    setStatus("idle");
    setSound(null);
    setPlaying(false);
    return () => {
      aliveRef.current = false;
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    };
  }, [name]);

  function startPlayback(data) {
    if (!audioRef.current) {
      audioRef.current = new Audio(data.url);
      audioRef.current.addEventListener("ended", () => setPlaying(false));
    }
    audioRef.current.play().catch(() => setPlaying(false));
    setPlaying(true);
  }

  const handlePress = () => {
    if (status === "loading" || status === "none") return;
    if (status === "ready" && sound) {
      if (playing) {
        if (audioRef.current) audioRef.current.pause();
        setPlaying(false);
      } else {
        startPlayback(sound);
      }
      return;
    }
    setStatus("loading");
    fetchTaxonSound(name).then((data) => {
      // The card may have scrolled out of the guide, been filtered away, or had
      // its species change while this was in flight.
      if (!aliveRef.current) return;
      if (!data || !data.url) { setStatus("none"); return; }
      setSound(data);
      setStatus("ready");
      if (onSound) onSound(data);
      startPlayback(data);
    });
  };

  const label = status === "loading" ? "Looking for a recording"
    : status === "none" ? "No recording found for this species"
    : playing ? "Pause call" : "Play call";

  return (
    <button
      type="button"
      onClick={handlePress}
      disabled={status === "none"}
      style={{
        ...styles.soundButton,
        ...(playing ? styles.soundButtonActive : {}),
        ...(status === "none" ? { opacity: 0.35, cursor: "default" } : {}),
      }}
      title={label}
      aria-label={label}
    >
      {status === "loading" ? "…" : status === "none" ? "▷" : playing ? "❚❚" : "▶"}
    </button>
  );
}

function briefText(extract) {
  if (!extract) return "";
  const firstSentence = extract.split(/(?<=[.!?])\s/)[0];
  return firstSentence.length > 160 ? firstSentence.slice(0, 157) + "…" : firstSentence;
}

function iconicToCategory(iconic) {
  if (iconic === "Aves") return "bird";
  if (iconic === "Mammalia") return "mammal";
  if (iconic === "Insecta" || iconic === "Arachnida") return "insect";
  if (iconic === "Reptilia" || iconic === "Amphibia") return "herp";
  if (iconic === "Plantae") return "plant";
  if (iconic === "Fungi") return "fungus";
  return "other";
}

function titleCase(s) {
  return s.replace(/\w\S*/g, (t) => t.charAt(0).toUpperCase() + t.slice(1).toLowerCase());
}

const LOCATION_CAPS = { bird: 40, mammal: 19, insect: 31, herp: 25, plant: 33, fungus: 10, other: 8 };

// `time` and the lat/lon pair are new. Dawn and dusk are half of what makes a
// wildlife record worth keeping, and a coordinate on the sighting itself (not
// just on the location it belongs to) is what a map of your own sightings would
// eventually need.
const emptyForm = { species: "", category: "bird", date: todayStr(), time: "", quantity: 1, location: "", note: "", photo: "", lat: null, lon: null };

function emptySpeciesBuckets() {
  return { bird: [], mammal: [], insect: [], herp: [], plant: [], fungus: [], other: [] };
}

// `month` (1-12) is optional. iNaturalist's observation search accepts it
// alongside lat/lng/radius, which is the whole trick behind the seasonal guide:
// the same call, plus one parameter, answers "what is actually around right
// now" instead of "what has ever been recorded here".
async function fetchSpeciesBuckets(lat, lon, month) {
  const monthParam = month ? "&month=" + month : "";
  const res = await fetch("https://api.inaturalist.org/v1/observations/species_counts?lat=" + lat + "&lng=" + lon + "&radius=50&per_page=500&verifiable=true" + monthParam);
  if (!res.ok) throw new Error("species lookup failed");
  const data = await res.json();
  const buckets = emptySpeciesBuckets();
  const seen = new Set();
  (data.results || []).forEach((r) => {
    const taxon = r.taxon;
    if (!taxon) return;
    const cat = iconicToCategory(taxon.iconic_taxon_name);
    const rawLabel = taxon.preferred_common_name || taxon.name;
    if (!rawLabel) return;
    const label = titleCase(rawLabel);
    const key = cat + ":" + label.toLowerCase();
    if (seen.has(key)) return;
    if (buckets[cat].length >= LOCATION_CAPS[cat]) return;
    seen.add(key);
    buckets[cat].push(label);
  });
  return buckets;
}

// Scales the LONGEST edge to 640, not the width. Constraining width alone let a
// portrait photo through at 640x853 — around 1.8x the pixels of the same shot
// landscape, and worse than 3x for a 16:9 phone photo held vertically.
// Nominatim's usage policy asks for at most one request per second. Map taps
// and typed searches could previously fire several back to back, which is a
// good way to get an IP blocked. Everything geocoding-related queues here.
let nominatimChain = Promise.resolve();
let nominatimLastAt = 0;

function nominatim(path) {
  const run = async () => {
    const wait = Math.max(0, 1100 - (Date.now() - nominatimLastAt));
    if (wait) await new Promise((resolve) => setTimeout(resolve, wait));
    nominatimLastAt = Date.now();
    const res = await fetch("https://nominatim.openstreetmap.org/" + path);
    if (!res.ok) throw new Error("geocode failed");
    return res.json();
  };
  nominatimChain = nominatimChain.then(run, run);
  return nominatimChain;
}

function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("That file couldn't be read."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That image format isn't supported by this browser — try a JPEG or PNG."));
      img.onload = () => {
        try {
          const maxEdge = 640;
          const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        } catch (err) {
          reject(new Error("That photo couldn't be processed."));
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- photo storage ----------
// Photos used to live as base64 strings inside the same localStorage entry
// blob as everything else. Measured, that capped the whole log at roughly 79
// photos (~64KB each against a ~5MB quota), and a failed write left the
// sighting sitting in React state looking saved until the next reload took it
// away. They now live in IndexedDB — gigabytes rather than megabytes — keyed by
// entry id, and the entry itself only carries a `hasPhoto` flag.
const PHOTO_DB_NAME = "bfl_photos_v1";
const PHOTO_STORE = "photos";
let photoDbPromise = null;

function openPhotoDb() {
  if (photoDbPromise) return photoDbPromise;
  photoDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("no indexeddb")); return; }
    const req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("indexeddb open failed"));
  });
  return photoDbPromise;
}

// `run` returns an IDBRequest; we resolve with its `.result`. Reading it via a
// truthiness check would be a trap — a *missing* key gives `result === undefined`,
// and falling back to the request object itself would make "no photo here" look
// exactly like "found one".
function photoTx(mode, run) {
  return openPhotoDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, mode);
    const store = tx.objectStore(PHOTO_STORE);
    let req;
    try { req = run(store); } catch (err) { reject(err); return; }
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error || new Error("indexeddb transaction failed"));
    tx.onabort = () => reject(tx.error || new Error("indexeddb transaction aborted"));
  }));
}

function putPhoto(id, dataUrl) {
  return photoTx("readwrite", (store) => store.put(dataUrl, id));
}
function getPhoto(id) {
  return photoTx("readonly", (store) => store.get(id)).catch(() => null);
}
function deletePhoto(id) {
  return photoTx("readwrite", (store) => store.delete(id)).catch(() => null);
}
function allPhotoIds() {
  return photoTx("readonly", (store) => store.getAllKeys()).catch(() => []);
}

// Reads go through a small in-memory cache so a list of thirty sightings
// doesn't open thirty transactions on every re-render. Only *hits* are cached:
// caching a miss would mean one failed or too-early lookup permanently
// convinced the app there was no photo, and the cloud fallback would never run
// again for that sighting.
const photoMemCache = new Map();
function getPhotoCached(id) {
  const hit = photoMemCache.get(id);
  if (hit) return Promise.resolve(hit);
  return getPhoto(id).then((data) => {
    if (data) photoMemCache.set(id, data);
    return data || null;
  });
}
function setPhotoCached(id, dataUrl) {
  photoMemCache.set(id, dataUrl);
  return putPhoto(id, dataUrl);
}
function forgetPhoto(id) {
  photoMemCache.delete(id);
  return deletePhoto(id);
}

// Profile pictures are cropped to a small square so they stay cheap to
// store (Firestore documents cap at 1MiB, and every friend re-downloads
// this on every leaderboard/feed load).
function resizeAvatar(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const size = 160;
        const src = Math.min(img.width, img.height);
        const sx = (img.width - src) / 2;
        const sy = (img.height - src) / 2;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, src, src, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}


const STORAGE_KEYS = {
  entries: "bfl_entries_v2",

// True when the app is running from the home screen rather than in a browser
// tab. Safari exempts installed web apps from the 7-day storage wipe, so this
// is the difference between a log that survives a holiday and one that doesn't.
function isInstalled() {
  try {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  } catch (err) {
    return false;
  }
}

function isIos() {

// A Firestore WriteBatch is capped at 500 operations and roughly 10MiB of
// payload, and it rejects as a whole — so an unbounded batch meant the first
// sync failed for exactly the people with the most to back up, reporting only
// "check your connection". Every batch now goes through here.
const BATCH_OPS = 400;   // metadata writes: bounded by the 500-op limit
const BATCH_BLOBS = 60;  // photo writes: bounded by the ~10MiB payload limit

async function commitInChunks(ops, chunkSize) {
  const size = chunkSize || BATCH_OPS;
  for (let i = 0; i < ops.length; i += size) {
    const batch = db.batch();
    ops.slice(i, i + size).forEach((apply) => apply(batch));
    await batch.commit();
  }
  return ops.length;
}

// ---------- soft deletes ----------
// A deletion used to be an absence, and an absence always loses a merge: delete
// on your phone, open a laptop holding the old copy, and mergeById restored the
// record and re-uploaded it. Deleting now writes a tombstone that carries a
// newer updatedAt, so it wins the merge like any other edit.
const TOMBSTONE_TTL_MS = 1000 * 60 * 60 * 24 * 120;

function isDeleted(rec) {
  return !!(rec && rec.deletedAt);
}
function living(list) {
  return list.filter((r) => !isDeleted(r));
}
function purgeOldTombstones(list) {
  const cutoff = nowTs() - TOMBSTONE_TTL_MS;
  return list.filter((r) => !r.deletedAt || r.deletedAt > cutoff);
}
function tombstoneFor(entry) {
  // Keep only what the merge and the purge need; drop the payload.
  return { id: entry.id, deletedAt: nowTs(), updatedAt: nowTs() };
}

// A friend's photo is fetched on demand and held in memory only — it isn't
// ours to keep on disk. This is what lets the activity feed load posts without
// dragging down every photo every friend has ever shared.
function resolveFriendPhoto(ownerUid, entryId) {
  const key = ownerUid + ":" + entryId;
  const hit = photoMemCache.get(key);
  if (hit) return Promise.resolve(hit);
  return photosCol(ownerUid).doc(entryId).get()
    .then((snap) => {
      const data = snap.exists ? snap.data().data : null;
      if (data) photoMemCache.set(key, data);
      return data || null;
    })
    .catch(() => null);
}

// Resolves a photo through memory, then IndexedDB, then the cloud. The cloud
// hop is what makes a fresh device work: sign in on a new phone and photos
// stream down one at a time as you scroll, instead of arriving in one batch
// that would blow the sync limit.
function resolvePhoto(entryId, uid) {
  return getPhotoCached(entryId).then((local) => {
    if (local) return local;
    if (!uid) return null;
    return photosCol(uid).doc(entryId).get()
      .then((snap) => {
        const data = snap.exists ? snap.data().data : null;
        if (data) { photoMemCache.set(entryId, data); putPhoto(entryId, data).catch(() => {}); }
        return data || null;
      })
      .catch(() => null);
  });
}

async function pullCloudData(uid) {
  const [entriesSnap, locationsSnap] = await Promise.all([
    entriesCol(uid).get(),
    locationsCol(uid).get(),
  ]);
  return {
    entries: entriesSnap.docs.map((d) => d.data()),
    locations: locationsSnap.docs.map((d) => d.data()),
  };
}

// merges two lists of {id, updatedAt} records, keeping whichever copy of
// each id is newer so two devices that both made offline changes reconcile
function mergeById(localList, cloudList) {
  const map = new Map();
  localList.forEach((item) => map.set(item.id, item));
  cloudList.forEach((item) => {
    const existing = map.get(item.id);
    if (!existing) { map.set(item.id, item); return; }
    const localTime = existing.updatedAt || 0;
    const cloudTime = item.updatedAt || 0;
    if (cloudTime > localTime) map.set(item.id, item);
  });
  return Array.from(map.values());
}

function LocationsMap({ locations, activeLocationId, onSelect, onMapClick, addPin }) {
  const mapRef = React.useRef(null);
  const mapInstance = React.useRef(null);
  const markersRef = React.useRef([]);
  const addMarkerRef = React.useRef(null);
  const onMapClickRef = React.useRef(onMapClick);
  React.useEffect(() => { onMapClickRef.current = onMapClick; }, [onMapClick]);

  React.useEffect(() => {
    if (!window.L || !mapRef.current) return;
    if (!mapInstance.current) {
      mapInstance.current = window.L.map(mapRef.current, { scrollWheelZoom: false }).setView([34.7834, -82.3021], 6);
      window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 18,
      }).addTo(mapInstance.current);
      mapInstance.current.on("click", (e) => {
        if (onMapClickRef.current) onMapClickRef.current(e.latlng.lat, e.latlng.lng);
      });
    }
    const map = mapInstance.current;
    markersRef.current.forEach((m) => map.removeLayer(m));
    markersRef.current = [];
    const pts = [];
    locations.forEach((loc) => {
      const lat = parseFloat(loc.lat);
      const lon = parseFloat(loc.lon);
      if (Number.isNaN(lat) || Number.isNaN(lon)) return;
      const isActive = loc.id === activeLocationId;
      const marker = window.L.circleMarker([lat, lon], {
        radius: isActive ? 9 : 6,
        color: isActive ? "#1F8A68" : "#8A7F63",
        fillColor: isActive ? "#1F8A68" : "#C9BFA0",
        fillOpacity: 0.85,
        weight: 2,
      }).addTo(map);
      marker.bindTooltip(loc.name);
      marker.on("click", (e) => {
        window.L.DomEvent.stopPropagation(e);
        onSelect(loc.id);
      });
      markersRef.current.push(marker);
      pts.push([lat, lon]);
    });
    if (pts.length > 1) {
      map.fitBounds(pts, { padding: [30, 30] });
    } else if (pts.length === 1) {
      map.setView(pts[0], 10);
    }
    const t = setTimeout(() => map.invalidateSize(), 50);
    return () => clearTimeout(t);
  }, [locations, activeLocationId]);

  // Tear the map down on unmount. Without this, every trip through the Location
  // tab left behind a live Leaflet instance, its tile layer and its click
  // handler.
  React.useEffect(() => {
    return () => {
      if (mapInstance.current) {
        mapInstance.current.remove();
        mapInstance.current = null;
      }
      markersRef.current = [];
      addMarkerRef.current = null;
    };
  }, []);

  // temporary marker + spinner while a tapped point is being turned into a location
  React.useEffect(() => {
    const map = mapInstance.current;
    if (!map) return;
    if (addMarkerRef.current) {
      map.removeLayer(addMarkerRef.current);
      addMarkerRef.current = null;
    }
    if (addPin) {
      addMarkerRef.current = window.L.circleMarker([addPin.lat, addPin.lng], {
        radius: 8,
        color: "#C9922E",
        fillColor: "#C9922E",
        fillOpacity: 0.5,
        weight: 2,
        dashArray: "3,3",
      }).addTo(map);
    }
  }, [addPin]);

  return <div ref={mapRef} style={styles.mapBox} />;
}

    const orphans = entriesRef.current.filter((e) => !e.deletedAt && !e.locationId);
    if (!orphans.length) return;
    const orphanIds = new Set(orphans.map((e) => e.id));
    commitEntries((prev) => prev.map((e) => (
      orphanIds.has(e.id)
        ? { ...e, locationId: homeId, locationName: e.locationName || homeName, updatedAt: nowTs() }
        : e
    )));
    setToast(orphans.length + " older sighting" + (orphans.length === 1 ? "" : "s") + " moved into " + homeName + ".");
    setTimeout(() => setToast(null), 5000);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [locations.length > 0]);

  // Shared by saving a location and by previewing one. Returns null and sets an
  // error when the place can't be found.
  async function geocode(query, setError) {
    const geoData = await nominatim("search?format=json&limit=1&q=" + encodeURIComponent(query));
    if (!geoData || !geoData.length) {
      setError("Couldn't find that place. Try a city and state, or a zip code.");
      return null;
    }
    return { lat: geoData[0].lat, lon: geoData[0].lon, displayName: geoData[0].display_name };
  }

  function adoptLocation(loc, makeActive) {
    setLocations((prev) => [...prev, loc]);
    if (user) locationsCol(user.uid).doc(loc.id).set(loc).catch(() => {});
    if (makeActive !== false) setActiveLocationId(loc.id);
    setPreviewLocation(null);
  }

  async function addLocation(e) {
    if (e && e.preventDefault) e.preventDefault();
    const query = newLocationQuery.trim();
    if (!query) return;
    setAddingLocation(true);
    setAddLocationError("");
    try {
      const place = await geocode(query, setAddLocationError);
      if (!place) { setAddingLocation(false); return; }
      const id = uid();
      const label = newLocationName.trim() || place.displayName.split(",")[0];
      const newLoc = { id, name: label, lat: place.lat, lon: place.lon, displayName: place.displayName, updatedAt: nowTs() };
      adoptLocation(newLoc);
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setNewLocationName("");
      setNewLocationQuery("");
      setAddingLocation(false);
      try {
        const buckets = await fetchSpeciesBuckets(place.lat, place.lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setAddLocationError("Something went wrong looking that up. Try again in a moment.");
      setAddingLocation(false);
    }
  }

  // Points the field guide at somewhere you haven't saved. Nothing about your
  // log moves: the header, the stat cards, the life list and the Log tab all
  // stay on your real location, and the preview disappears when you leave it.
  async function previewGuideLocation(e) {
    if (e && e.preventDefault) e.preventDefault();
    const query = newLocationQuery.trim();
    if (!query) return;
    setPreviewStatus("loading");
    setAddLocationError("");
    try {
      const place = await geocode(query, setAddLocationError);
      if (!place) { setPreviewStatus(""); return; }
      const id = "preview:" + place.lat + "," + place.lon;
      const loc = { id, name: place.displayName.split(",")[0], lat: place.lat, lon: place.lon, displayName: place.displayName, preview: true };
      setPreviewLocation(loc);
      setNewLocationQuery("");
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setPreviewStatus("");
      try {
        const buckets = await fetchSpeciesBuckets(place.lat, place.lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setAddLocationError("Something went wrong looking that up. Try again in a moment.");
      setPreviewStatus("");
    }
  }

  // Turns the place you're looking at into one you keep.
  // Keeps the place. Deliberately does NOT switch where you log — the button
  // says "Save this place", and moving the whole log onto a brand new empty
  // location would reproduce the exact "every number reset to zero" surprise
  // that preview mode exists to avoid. Switch from the Location tab when you
  // actually mean to.
  function savePreviewLocation() {
    if (!previewLocation) return;
    const oldId = previewLocation.id;
    const id = uid();
    const saved = {
      id, name: previewLocation.name, lat: previewLocation.lat, lon: previewLocation.lon,
      displayName: previewLocation.displayName, updatedAt: nowTs(),
    };

    // Carry everything already fetched across to the real id — the species
    // buckets and every month of seasonal data — so the guide doesn't blank
    // out and refetch what it just downloaded.
    const cached = locationSpeciesCache[oldId];
    if (cached) setLocationSpeciesCache((prev) => ({ ...prev, [id]: cached }));
    setSeasonalCache((prev) => {
      const next = { ...prev };
      Object.keys(prev).forEach((k) => {
        if (k.indexOf(oldId + ":") === 0) next[id + ":" + k.slice(oldId.length + 1)] = prev[k];
      });
      return next;
    });
    setSeasonalStatus((prev) => {
      const next = { ...prev };
      Object.keys(prev).forEach((k) => {
        if (k.indexOf(oldId + ":") === 0) next[id + ":" + k.slice(oldId.length + 1)] = prev[k];
      });
      return next;
    });
    setLocationStatus((prev) => ({ ...prev, [id]: cached ? "done" : "loading" }));

    setLocations((prev) => [...prev, saved]);
    if (user) locationsCol(user.uid).doc(id).set(saved).catch(() => {});
    if (!cached) retryLocationSpecies(saved);

    // Stay on the guide for the place just saved, now reading from the real id.
    setPreviewLocation({ ...saved, preview: true, saved: true });

    // Drop the temporary keys.
    setLocationSpeciesCache((prev) => { const next = { ...prev }; delete next[oldId]; return next; });
    setLocationStatus((prev) => { const next = { ...prev }; delete next[oldId]; return next; });
    const dropPreviewKeys = (obj) => {
      const next = { ...obj };
      Object.keys(next).forEach((k) => { if (k.indexOf(oldId + ":") === 0) delete next[k]; });
      return next;
    };
    setSeasonalCache(dropPreviewKeys);
    setSeasonalStatus(dropPreviewKeys);
    seasonalInFlight.current.forEach((k) => { if (k.indexOf(oldId + ":") === 0) seasonalInFlight.current.delete(k); });

    setToast(saved.name + " saved to your locations.");
    setTimeout(() => setToast(null), 4500);
  }

  async function addLocationFromLatLng(lat, lon) {
    // if the tap landed close to a location we already have, just switch to it
    const nearby = locations.find((loc) => {
      const dLat = Math.abs(parseFloat(loc.lat) - lat);
      const dLon = Math.abs(parseFloat(loc.lon) - lon);
      return dLat < 0.03 && dLon < 0.03; // roughly within ~2 miles
    });
    if (nearby) {
      setActiveLocationId(nearby.id);
      return;
    }

    setMapPin({ lat, lng: lon });
    setMapAddStatus("locating");
    setMapAddError("");
    try {
      const geoData = await nominatim("reverse?format=json&lat=" + lat + "&lon=" + lon + "&zoom=12");
      const addr = geoData && geoData.address ? geoData.address : {};
      const label = addr.city || addr.town || addr.village || addr.hamlet || addr.county
        || (geoData && geoData.display_name ? geoData.display_name.split(",")[0] : null)
        || "Dropped pin";
      const displayName = (geoData && geoData.display_name) || (lat.toFixed(4) + ", " + lon.toFixed(4));
      const id = uid();
      const newLoc = { id, name: label, lat: String(lat), lon: String(lon), displayName, updatedAt: nowTs() };
      adoptLocation(newLoc);
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setMapAddStatus("");
      setMapPin(null);
      try {
        const buckets = await fetchSpeciesBuckets(lat, lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setMapAddStatus("");
      setMapPin(null);
      setMapAddError("Couldn't identify that spot. Try tapping again, or use the search box below.");
    }
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      setMapAddError("Your browser doesn't support location services — search or tap the map instead.");
      return;
    }
    setMapAddStatus("locating");
    setMapAddError("");
    navigator.geolocation.getCurrentPosition(
      (pos) => addLocationFromLatLng(pos.coords.latitude, pos.coords.longitude),
      () => {
        setMapAddStatus("");
        setMapAddError("Couldn't get your current location — search or tap the map instead.");
      },
      { timeout: 10000 }
    );
  }

  // The guide's version of the same button: shows you what's around you right
  // now without saving anywhere new.
  async function previewFromLatLng(lat, lon) {
    setPreviewStatus("loading");
    try {
      const geoData = await nominatim("reverse?format=json&lat=" + lat + "&lon=" + lon + "&zoom=12");
      const addr = geoData && geoData.address ? geoData.address : {};
      const label = addr.city || addr.town || addr.village || addr.hamlet || addr.county
        || (geoData && geoData.display_name ? geoData.display_name.split(",")[0] : null)
        || "Where you are";
      const id = "preview:" + lat + "," + lon;
      setPreviewLocation({
        id, name: label, lat: String(lat), lon: String(lon),
        displayName: (geoData && geoData.display_name) || (lat.toFixed(4) + ", " + lon.toFixed(4)),
        preview: true,
      });
      setLocationStatus((prev) => ({ ...prev, [id]: "loading" }));
      setPreviewStatus("");
      try {
        const buckets = await fetchSpeciesBuckets(lat, lon);
        setLocationSpeciesCache((prev) => ({ ...prev, [id]: buckets }));
        setLocationStatus((prev) => ({ ...prev, [id]: "done" }));
      } catch (err) {
        setLocationStatus((prev) => ({ ...prev, [id]: "error" }));
      }
    } catch (err) {
      setPreviewStatus("");
      setAddLocationError("Couldn't work out where that is. Try searching instead.");
    }
  }

  function previewMyLocation() {
    if (!navigator.geolocation) {
      setAddLocationError("Your browser doesn't support location services — try searching instead.");
      return;
    }
    setPreviewStatus("loading");
    setAddLocationError("");
    navigator.geolocation.getCurrentPosition(
      (pos) => previewFromLatLng(pos.coords.latitude, pos.coords.longitude),
      () => {
        setPreviewStatus("");
        setAddLocationError("Couldn't get your current location — try searching instead.");
      },
      { timeout: 10000 }
    );
  }

  // Attaches a coordinate to the sighting being logged. Kept as an explicit
  // button rather than a silent capture on every save: a wildlife record is
  // much more useful with a fix on it, but not at the cost of prompting for
  // location every time someone types a species name.
  function pinSightingSpot() {
    if (!navigator.geolocation) { setFormGeoStatus("unsupported"); return; }
    setFormGeoStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        updateForm("lat", pos.coords.latitude);
        updateForm("lon", pos.coords.longitude);
        setFormGeoStatus("done");
      },
      () => setFormGeoStatus("error"),
      { timeout: 10000, enableHighAccuracy: true }
    );
  }

  function removeLocation(id) {
    if (locations.length <= 1) return;
    if (!window.confirm("Remove this location? Its species guide will be forgotten, but sightings already logged there stay in your data.")) return;
    const remaining = locations.filter((l) => l.id !== id);
    setLocations(remaining);
    if (user) locationsCol(user.uid).doc(id).delete().catch(() => {});
    setLocationSpeciesCache((prev) => { const next = { ...prev }; delete next[id]; return next; });
    setLocationStatus((prev) => { const next = { ...prev }; delete next[id]; return next; });
    if (activeLocationId === id) setActiveLocationId(remaining[0].id);
  }

  // "This patch" — the sightings at the location you're logging from.
  const visibleEntries = useMemo(() => {
    return liveEntries.filter((e) => e.locationId === activeLocationId);
  }, [liveEntries, activeLocationId]);

  const spotTags = useMemo(() => {
    const s = new Set(visibleEntries.map((e) => e.location).filter(Boolean));
    return Array.from(s).sort();
  }, [visibleEntries]);

  const filtered = useMemo(() => {
    return visibleEntries
      .filter((e) => {
        if (search && !e.species.toLowerCase().includes(search.toLowerCase())) return false;
        if (filterCategory !== "all" && e.category !== filterCategory) return false;
        if (filterLocation !== "all" && e.location !== filterLocation) return false;
        if (dateFrom && e.date < dateFrom) return false;
        if (dateTo && e.date > dateTo) return false;
        return true;
      })
      .sort((a, b) => (a.date === b.date ? 0 : a.date < b.date ? 1 : -1));
  }, [visibleEntries, search, filterCategory, filterLocation, dateFrom, dateTo]);

  const speciesSummary = useMemo(() => {
    const map = new Map();
    visibleEntries.forEach((e) => {
      const key = e.species.trim().toLowerCase();
      if (!map.has(key)) {
        map.set(key, { species: e.species.trim(), category: e.category, sightings: 0, totalQty: 0, firstSeen: e.date, lastSeen: e.date });
      }
      const rec = map.get(key);
      rec.sightings += 1;
      rec.totalQty += Number(e.quantity) || 0;
      if (e.date < rec.firstSeen) rec.firstSeen = e.date;
      if (e.date > rec.lastSeen) rec.lastSeen = e.date;
    });
    return Array.from(map.values()).sort((a, b) => b.sightings - a.sightings);
  }, [visibleEntries]);

  const stats = useMemo(() => {
    const uniqueSpecies = speciesSummary.length;
    const totalSightings = visibleEntries.length;
    const categoriesUsed = new Set(visibleEntries.map((e) => e.category)).size;
    return { uniqueSpecies, totalSightings, categoriesUsed };
  }, [visibleEntries, speciesSummary]);

  // The life list: every species you've logged anywhere, ever. This is the
  // number the app is really about, and until now it was computed but only ever
  // rendered on the friends leaderboard — so adding a second location made your
  // headline count appear to reset to zero.
  const lifeList = useMemo(() => {
    const species = new Map();
    liveEntries.forEach((e) => {
      const key = e.species.trim().toLowerCase();
      const rec = species.get(key);
      if (!rec) {
        species.set(key, { species: e.species.trim(), category: e.category, first: e.date, last: e.date, count: 1 });
      } else {
        rec.count += 1;
        if (e.date < rec.first) rec.first = e.date;
        if (e.date > rec.last) rec.last = e.date;
      }
    });
    return { species, uniqueSpecies: species.size, totalSightings: liveEntries.length };
  }, [liveEntries]);

  const lifeSpeciesNames = useMemo(() => new Set(lifeList.species.keys()), [lifeList]);

  // Milestones now track the life list rather than the current patch. A
  // milestone that can un-earn itself by switching location is worse than none.
  const nextMilestone = useMemo(() => {
    const count = lifeList.uniqueSpecies;
    const prevThreshold = [0, ...MILESTONES].filter((m) => m <= count).pop() || 0;
    const target = MILESTONES.find((m) => m > count);
    if (!target) return null;
    return { target, progress: (count - prevThreshold) / (target - prevThreshold) };
  }, [lifeList.uniqueSpecies]);

  const categoryChartData = useMemo(() => {
    return CATEGORIES.map((c) => ({ name: c.label, value: speciesSummary.filter((s) => s.category === c.id).length, color: c.color }))
      .filter((d) => d.value > 0);
  }, [speciesSummary]);

  const usedCategoryIds = useMemo(() => new Set(visibleEntries.map((e) => e.category)), [visibleEntries]);

  function toggleGuideCat(id) {
    setGuideActiveCats((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  }

  const guideSections = useMemo(() => {
    const query = guideSearch.trim().toLowerCase();
    return CATEGORIES
      .filter((c) => guideActiveCats.includes(c.id))
      .map((c) => {
        const names = (speciesForGuide[c.id] || []).filter((name) => {
          const key = name.trim().toLowerCase();
          if (query && !name.toLowerCase().includes(query)) return false;
          // "New to me" means new to the life list — a Cardinal you logged at
          // another location isn't new just because you're standing somewhere else.
          if (guideOnlyNew && lifeSpeciesNames.has(key)) return false;
          // While a month is still loading, hide everything rather than
          // quietly showing the unfiltered list under an active filter.
          if (guideOnlySeason && !seasonalNames) return false;
          if (guideOnlySeason && !seasonalNames.has(key)) return false;
          return true;
        });
        return { category: c, names };
      })
      .filter((s) => s.names.length > 0);
  }, [guideActiveCats, guideSearch, guideOnlyNew, guideOnlySeason, speciesForGuide, lifeSpeciesNames, seasonalNames]);

  // eBird calls this Target Species, and it's the most useful thing in their
  // app: what's likely near you right now that isn't on your list yet. Both
  // halves already existed here — this just puts them together and gives the
  // answer its own card instead of burying it behind a filter chip.
  const targetSpecies = useMemo(() => {
    if (!seasonalNames) return [];
    const byCategory = CATEGORIES.map((c) =>
      (speciesForGuide[c.id] || [])
        .filter((name) => {
          const key = name.trim().toLowerCase();
          return !lifeSpeciesNames.has(key) && seasonalNames.has(key);
        })
        .map((name) => ({ name, categoryId: c.id }))
    );
    // Round-robin across categories so the list isn't six birds every time.
    const out = [];
    for (let i = 0; out.length < 6; i++) {
      let added = false;
      for (const list of byCategory) {
        if (list[i]) { out.push(list[i]); added = true; }
        if (out.length >= 6) break;
      }
      if (!added) break;
    }
    return out;
  }, [speciesForGuide, seasonalNames, lifeSpeciesNames]);

  // How much of what's around this month you've actually found.
  const seasonProgress = useMemo(() => {
    if (!homeSeasonalNames || homeSeasonalNames.size === 0) return null;
    let found = 0;
    homeSeasonalNames.forEach((n) => { if (lifeSpeciesNames.has(n)) found += 1; });
    return { found, total: homeSeasonalNames.size };
  }, [homeSeasonalNames, lifeSpeciesNames]);

  const monthlyChartData = useMemo(() => {
    const seenSpecies = new Set();
    const monthMap = new Map();
    const sorted = [...visibleEntries].sort((a, b) => (a.date === b.date ? 0 : a.date < b.date ? -1 : 1));
    sorted.forEach((e) => {
      const key = e.species.trim().toLowerCase();
      const month = e.date.slice(0, 7);
      if (!seenSpecies.has(key)) {
        seenSpecies.add(key);
        monthMap.set(month, (monthMap.get(month) || 0) + 1);
      }
    });
    return Array.from(monthMap.entries()).sort(([a], [b]) => (a === b ? 0 : a < b ? -1 : 1)).map(([month, newSpecies]) => ({ month, newSpecies }));
  }, [visibleEntries]);

  const availableYears = useMemo(() => {
    const years = new Set(visibleEntries.map((e) => e.date.slice(0, 4)));
    years.add(todayStr().slice(0, 4));
    return Array.from(years).sort((a, b) => b.localeCompare(a));
  }, [visibleEntries]);

  const resetPreviewCount = useMemo(() => {
    if (resetScope === "all") return visibleEntries.length;
    if (resetScope === "month") return visibleEntries.filter((e) => e.date.slice(0, 7) === resetMonth).length;
    if (resetScope === "year") return visibleEntries.filter((e) => e.date.slice(0, 4) === resetYear).length;
    return 0;
  }, [visibleEntries, resetScope, resetMonth, resetYear]);

  function handleScopedReset() {
    if (resetPreviewCount === 0 || !activeLocation) return;
    const label = resetScope === "all" ? "all time" : resetScope === "month" ? resetMonth : resetYear;
    if (!window.confirm("Delete " + resetPreviewCount + " sighting(s) logged in " + activeLocation.name + " for " + label + "? This can't be undone.")) return;

    // Decide what's going before touching state. This used to push ids from
    // inside the setEntries updater and read them on the very next line, which
    // only worked while React happened to evaluate the updater eagerly — with
    // another update to entries already pending, the array was still empty and
    // the cloud copies were never deleted.
    const doomed = visibleEntries.filter((e) => {
      if (resetScope === "all") return true;
      if (resetScope === "month") return e.date.slice(0, 7) === resetMonth;
      if (resetScope === "year") return e.date.slice(0, 4) === resetYear;
      return false;
    });
    if (!doomed.length) return;

    const stones = new Map(doomed.map((e) => [e.id, tombstoneFor(e)]));
    commitEntries((prev) => prev.map((e) => stones.get(e.id) || e));
    doomed.forEach((e) => { if (e.hasPhoto) forgetPhoto(e.id); });

    if (user) {
      commitInChunks(doomed.map((e) => (batch) => batch.set(entriesCol(user.uid).doc(e.id), stones.get(e.id)))).catch(() => {});
      const withPhotos = doomed.filter((e) => e.hasPhoto);
      if (withPhotos.length) {
        commitInChunks(withPhotos.map((e) => (batch) => batch.delete(photosCol(user.uid).doc(e.id)))).catch(() => {});
      }
    }
  }

  async function resetAllData() {
    if (confirmResetText.trim().toUpperCase() !== "RESET") return;
    try {
      localStorage.removeItem(STORAGE_KEYS.entries);
      localStorage.removeItem(STORAGE_KEYS.locations);
      localStorage.removeItem(STORAGE_KEYS.activeLocation);
    } catch (err) { /* ignore */ }
    // Photos live in IndexedDB now, so a full reset has to clear them too.
    try {
      const ids = await allPhotoIds();
      await Promise.all(ids.map((id) => forgetPhoto(id)));
      photoMemCache.clear();
    } catch (err) { /* ignore */ }
    if (user) {
      try {
        const cloud = await pullCloudData(user.uid);
        await commitInChunks(cloud.entries.map((e) => (batch) => batch.delete(entriesCol(user.uid).doc(e.id))));
        await commitInChunks(cloud.locations.map((l) => (batch) => batch.delete(locationsCol(user.uid).doc(l.id))));
        const photoSnap = await photosCol(user.uid).get();
        await commitInChunks(photoSnap.docs.map((d) => (batch) => batch.delete(photosCol(user.uid).doc(d.id))));
      } catch (err) { /* ignore — the local wipe still succeeds */ }
    }
    entriesRef.current = [];
    setEntries([]);
    setLocations([]);
    setLocationSpeciesCache({});
    setLocationStatus({});
    setSeasonalCache({});
    setSeasonalStatus({});
    setPreviewLocation(null);
    setActiveLocationId(null);
    setConfirmResetText("");
    setTab("log");
  }

  // Moves any photo still stored inline on an entry into IndexedDB and strips
  // it off the record. Runs against both local and cloud data, so an existing
  // log migrates itself the first time this version loads.
  async function migrateInlinePhotos(list, overwrite) {
    const movedIds = new Set();
    const out = [];
    for (const e of list) {
      if (e && typeof e.photo === "string" && e.photo.indexOf("data:") === 0) {
        try {
          // Don't clobber a blob we already hold — the same entry can arrive
          // from the cloud carrying an older inline copy than the one on disk.
          // An import is the exception: there, the file is the authority.
          const existing = overwrite ? null : await getPhotoCached(e.id);
          if (!existing) await setPhotoCached(e.id, e.photo);
          movedIds.add(e.id);
          const copy = { ...e, hasPhoto: true, photoUploaded: !!e.photoUploaded };
          delete copy.photo;
          out.push(copy);
          continue;
        } catch (err) {
          // IndexedDB unavailable (private mode in some browsers). Leave the
          // inline copy in place — EntryPhoto renders it directly.
        }
      }
      out.push(e);
    }
    return { list: out, movedIds };
  }

  // Applies a completed migration to whatever the entry list looks like *now*.
  // The migration awaits a series of IndexedDB writes, so the list it started
  // from can be several sightings out of date by the time it finishes.
  function applyMigration(prev, movedIds) {
    if (!movedIds.size) return prev;
    return prev.map((e) => {
      if (!movedIds.has(e.id) || typeof e.photo !== "string") return e;
      const copy = { ...e, hasPhoto: true, photoUploaded: !!e.photoUploaded };
      delete copy.photo;
      return copy;
    });
  }

  React.useEffect(() => {
    let alive = true;
    migrateInlinePhotos(entriesRef.current).then(async ({ movedIds }) => {
      if (!alive) return;
      if (movedIds.size > 0) commitEntries((prev) => applyMigration(prev, movedIds));
      // Sweep up blobs nothing points at any more — a sighting deleted on
      // another device arrives here as a tombstone, and its photo would
      // otherwise sit in IndexedDB forever.
      try {
        // Never sweep against an empty entry list. localStorage and IndexedDB
        // are evicted independently, so "no entries" can mean "localStorage was
        // cleared and these blobs are all we have left" — deleting them then
        // would destroy the only remaining copy.
        if (!entriesRef.current.length) return;
        const ids = await allPhotoIds();
        if (!alive || !ids.length) return;
        const keep = new Set(entriesRef.current.filter((e) => !e.deletedAt && e.hasPhoto).map((e) => e.id));
        const orphans = ids.filter((id) => !keep.has(id));
        await Promise.all(orphans.map((id) => forgetPhoto(id)));
      } catch (err) { /* best effort */ }
    });
    return () => { alive = false; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function syncOnSignIn(uid) {
    setSyncStatus("syncing");
    try {
      const cloud = await pullCloudData(uid);
      const cloudMigrated = await migrateInlinePhotos(cloud.entries);
      const localMigrated = await migrateInlinePhotos(entriesRef.current);

      const merged = purgeOldTombstones(mergeById(localMigrated.list, cloudMigrated.list));
      // Stamp a *stable* timestamp on locations that predate the field, rather
      // than a fresh one each sync — otherwise every sync saw them as newer and
      // re-uploaded the lot.
      const mergedLocations = mergeById(locations, cloud.locations).map((l) => (l.updatedAt ? l : { ...l, updatedAt: 1 }));

      const cloudById = new Map(cloud.entries.map((e) => [e.id, e]));
      const cloudLocById = new Map(cloud.locations.map((l) => [l.id, l]));
      const finalLocations = mergedLocations.length ? mergedLocations : locations;

      // Push anything the cloud is missing OR holds an older copy of. The old
      // version only uploaded ids the cloud had never seen, so an edit made
      // offline — toggling Share, say — merged into local state and then
      // silently never left the device.
      const entryOps = [];
      merged.forEach((e) => {
        const remote = cloudById.get(e.id);
        const stale = !remote || (e.updatedAt || 0) > (remote.updatedAt || 0) || remote.photo !== undefined;
        if (!stale) return;
        const payload = { ...e, shared: !!e.shared };
        delete payload.photo;
        entryOps.push((batch) => batch.set(entriesCol(uid).doc(e.id), payload));
      });
      finalLocations.forEach((l) => {
        const remote = cloudLocById.get(l.id);
        if (!remote || (l.updatedAt || 0) > (remote.updatedAt || 0)) {
          entryOps.push((batch) => batch.set(locationsCol(uid).doc(l.id), l));
        }
      });
      await commitInChunks(entryOps);

      // Photos go up separately and in much smaller batches — a batch is capped
      // at roughly 10MiB of payload, and 400 photos would blow straight past it.
      const needsPhotoUpload = merged.filter((e) => e.hasPhoto && !e.photoUploaded && !e.deletedAt);
      const uploaded = [];
      for (let i = 0; i < needsPhotoUpload.length; i += BATCH_BLOBS) {
        const slice = needsPhotoUpload.slice(i, i + BATCH_BLOBS);
        const datas = await Promise.all(slice.map((e) => getPhotoCached(e.id)));
        const batch = db.batch();
        let ops = 0;
        slice.forEach((e, idx) => {
          if (!datas[idx]) return;
          batch.set(photosCol(uid).doc(e.id), { data: datas[idx], updatedAt: nowTs() });
          uploaded.push(e.id);
          ops++;
        });
        if (ops) await batch.commit();
      }

      const uploadedSet = new Set(uploaded);
      const finalEntries = uploadedSet.size
        ? merged.map((e) => (uploadedSet.has(e.id) ? { ...e, photoUploaded: true } : e))
        : merged;

      // Merge the sync result back into whatever is current rather than
      // replacing it. A sync can take a while, and anything the user logged
      // while it ran lives only in `prev` — assigning the snapshot wholesale
      // would silently delete it from both state and storage.
      const migratedIds = new Set();
      cloudMigrated.movedIds.forEach((id) => migratedIds.add(id));
      localMigrated.movedIds.forEach((id) => migratedIds.add(id));
      commitEntries((prev) => {
        const merged2 = applyMigration(purgeOldTombstones(mergeById(prev, finalEntries)), migratedIds);
        // Neither migration nor a photo upload bumps updatedAt, so both lose
        // the merge on a tie and have to be re-applied by id afterwards.
        // Without this the photoUploaded flag reverts and every photo uploads
        // again on the next sync, and the one after that.
        if (!uploadedSet.size) return merged2;
        return merged2.map((e) => (uploadedSet.has(e.id) ? { ...e, photoUploaded: true } : e));
      });

      if (mergedLocations.length) setLocations(mergedLocations);
      // Cloud copies of photos belonging to deleted sightings, including ones
      // deleted on this device while signed out.
      // A tombstone carries no payload, so we can't tell from it whether the
      // sighting had a photo. Deleting unconditionally is fine — deleting a
      // document that isn't there is a no-op — and it's the only thing that
      // cleans up a photo for a sighting deleted while signed out.
      const tombstoned = merged.filter((e) => e.deletedAt);
      if (tombstoned.length) {
        commitInChunks(tombstoned.map((e) => (batch) => batch.delete(photosCol(uid).doc(e.id)))).catch(() => {});
        tombstoned.forEach((e) => forgetPhoto(e.id));
      }

      // Tombstones past their expiry are dropped from the cloud too. Purging
      // only locally meant the next sync pulled the same expired tombstone back
      // down, dropped it again, and repeated that forever while the collection
      // grew without bound.
      const keptIds = new Set(merged.map((e) => e.id));
      const expired = cloudMigrated.list.filter((e) => e.deletedAt && !keptIds.has(e.id));
      if (expired.length) {
        commitInChunks(expired.map((e) => (batch) => batch.delete(entriesCol(uid).doc(e.id)))).catch(() => {});
      }

      // Mark the uploaded flag in the cloud too, so another device doesn't
      // re-upload the same photos.
      if (uploadedSet.size) {
        await commitInChunks(uploaded.map((id) => (batch) =>
          batch.set(entriesCol(uid).doc(id), { photoUploaded: true }, { merge: true })));
      }

      setSyncStatus("done");
    } catch (err) {
      setSyncStatus(err && err.code === "permission-denied" ? "denied" : "error");
    }
  }

  async function refreshSocialData(uid) {
    try {
      const [outSnap, inSnap, fromSnap, toSnap] = await Promise.all([
        db.collection("friendRequests").where("from", "==", uid).where("status", "==", "pending").get(),
        db.collection("friendRequests").where("to", "==", uid).where("status", "==", "pending").get(),
        db.collection("friendRequests").where("from", "==", uid).where("status", "==", "accepted").get(),
        db.collection("friendRequests").where("to", "==", uid).where("status", "==", "accepted").get(),
      ]);
      setOutgoingRequests(outSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setIncomingRequests(inSnap.docs.map((d) => ({ id: d.id, ...d.data() })));
      const otherUids = Array.from(new Set([
        ...fromSnap.docs.map((d) => d.data().to),
        ...toSnap.docs.map((d) => d.data().from),
      ]));
      const friendDocs = await Promise.all(otherUids.map((otherUid) => db.collection("users").doc(otherUid).get()));
      // Their life lists come from the friends-only subcollection. A friend who
      // hasn't opened the app since this shipped simply has no document yet,
      // which the comparison UI reports rather than treating as an empty list.
      const friendLists = await Promise.all(otherUids.map((otherUid) =>
        socialListDoc(otherUid).get()
          .then((snap) => (snap.exists ? snap.data().species || [] : null))
          .catch(() => null)
      ));
      const listByUid = {};
      otherUids.forEach((otherUid, i) => { listByUid[otherUid] = friendLists[i]; });
      setFriends(friendDocs.filter((d) => d.exists).map((d) => ({
        uid: d.id,
        ...d.data(),
        speciesList: listByUid[d.id] || null,
      })));
    } catch (err) {
      setFriendError("Couldn't load friend data — try refreshing.");
    }
  }

  function friendlyAuthError(err) {
    const code = err && err.code;
    if (code === "auth/email-already-in-use") return "That email already has an account — try signing in instead.";
    if (code === "auth/invalid-email") return "That doesn't look like a valid email.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-credential") return "Email or password didn't match.";
    return "Something went wrong — try again.";
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    setAuthError("");
    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(authEmail.trim(), authPassword);
        if (authDisplayName.trim()) {
          await cred.user.updateProfile({ displayName: authDisplayName.trim() });
        }
        await db.collection("users").doc(cred.user.uid).set({
          email: normalizeEmail(authEmail),
          displayName: authDisplayName.trim() || authEmail.trim(),
          stats: globalStats,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      } else {
        await auth.signInWithEmailAndPassword(authEmail.trim(), authPassword);
      }
      setAuthPassword("");
    } catch (err) {
      setAuthError(friendlyAuthError(err));
    }
    setAuthBusy(false);
  }

  function signOutUser() {
    auth.signOut();
  }

  function handleForgotPassword() {
    const email = authEmail.trim();
    if (!email) {
      setAuthError("Type your email above first, then tap \"Forgot password?\" again.");
      return;
    }
    setAuthError("");
    setAuthBusy(true);
    auth.sendPasswordResetEmail(email)
      .then(() => setAuthError("Reset email sent — check your inbox (and spam folder) for a link."))
      .catch(() => setAuthError("Couldn't send a reset email for that address."))
      .finally(() => setAuthBusy(false));
  }

  async function sendFriendRequest(e) {
    e.preventDefault();
    if (!user) return;
    const email = normalizeEmail(friendEmail);
    if (!email) return;
    if (email === normalizeEmail(user.email)) { setFriendError("That's your own email."); return; }
    setFriendBusy(true);
    setFriendError("");
    try {
      const targetSnap = await db.collection("users").where("email", "==", email).limit(1).get();
      if (targetSnap.empty) {
        setFriendError("No account found with that email.");
        setFriendBusy(false);
        return;
      }
      const targetUid = targetSnap.docs[0].id;
      const reverseId = targetUid + "_" + user.uid;
      const reverseDoc = await db.collection("friendRequests").doc(reverseId).get();
      if (reverseDoc.exists && reverseDoc.data().status === "pending") {
        await db.collection("friendRequests").doc(reverseId).update({ status: "accepted" });
        setFriendEmail("");
        await refreshSocialData(user.uid);
        setFriendBusy(false);
        return;
      }
      const forwardId = user.uid + "_" + targetUid;
      const existing = await db.collection("friendRequests").doc(forwardId).get();
      if (existing.exists && existing.data().status === "accepted") {
        setFriendError("You're already friends.");
        setFriendBusy(false);
        return;
      }
      if (existing.exists && existing.data().status === "pending") {
        setFriendError("Friend request already sent.");
        setFriendBusy(false);
        return;
      }
      await db.collection("friendRequests").doc(forwardId).set({
        from: user.uid,
        to: targetUid,
        fromEmail: normalizeEmail(user.email),
        toEmail: email,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setFriendEmail("");
      await refreshSocialData(user.uid);
    } catch (err) {
      setFriendError("Something went wrong sending that request.");
    }
    setFriendBusy(false);
  }

  async function respondToRequest(reqId, accept) {
    try {
      await db.collection("friendRequests").doc(reqId).update({ status: accept ? "accepted" : "declined" });
      await refreshSocialData(user.uid);
    } catch (err) {
      setFriendError("Couldn't update that request.");
    }
  }
