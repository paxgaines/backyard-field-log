  // ---- sharing sightings to the activity feed ----
  // Computed outside the updater so the Firestore write can't depend on React
  // choosing to evaluate that updater synchronously.
  function toggleShared(id) {
    const current = entriesRef.current.find((e) => e.id === id);
    if (!current) return;
    const shared = !current.shared;
    const updatedAt = nowTs();
    commitEntries((prev) => prev.map((e) => (e.id === id ? { ...e, shared, updatedAt } : e)));
    if (user) {
      entriesCol(user.uid).doc(id).set({ shared, updatedAt }, { merge: true }).catch(() => {});
    }
  }

  async function loadFeed() {
    if (!user || friends.length === 0) { setFeedEntries([]); return; }
    setFeedLoading(true);
    setFeedError("");
    try {
      // Still no .orderBy() on a different field from the .where() — that
      // combination needs a composite index the user would have to create by
      // hand. But there is a limit now: this used to pull every shared sighting
      // a friend had ever made, photos included, and then throw away all but
      // forty of them. Photos are no longer on the entry documents at all;
      // each post fetches its own once it's on screen.
      const perFriend = await Promise.all(friends.map((f) =>
        db.collection("users").doc(f.uid).collection("entries")
          .where("shared", "==", true)
          .limit(40)
          .get()
          .then((snap) => snap.docs.map((d) => {
            const data = d.data();
            delete data.photo; // in case a friend hasn't migrated yet
            return {
              id: d.id, ownerUid: f.uid,
              ownerName: f.displayName || f.email || "Friend",
              ownerAvatar: f.avatar || null,
              ...data,
            };
          }))
          .catch(() => [])
      ));
      const merged = perFriend.flat()
        .filter((p) => !p.deletedAt)
        .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.updatedAt || 0) - (a.updatedAt || 0));
      setFeedEntries(merged.slice(0, 40));
    } catch (err) {
      setFeedError("Couldn't load the activity feed — try refreshing.");
    }
    setFeedLoading(false);
  }

  React.useEffect(() => {
    if (user && friends.length > 0) loadFeed();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, friends.length]);

  const REACTION_EMOJI = "🌿";

  async function toggleReaction(post) {
    if (!user) return;
    const already = post.reactions && post.reactions[user.uid];
    const path = "reactions." + user.uid;
    // Bumping updatedAt here (even though a friend, not the owner, is
    // writing it) matters: mergeById picks whichever copy of an entry has
    // the newer updatedAt, wholesale. Without this, the owner's own device
    // would never realize the cloud copy has a reaction it doesn't, and
    // the reaction would never surface back to them on their next sync.
    const update = already
      ? { [path]: firebase.firestore.FieldValue.delete(), updatedAt: nowTs() }
      : { [path]: { emoji: REACTION_EMOJI, name: user.displayName || user.email, at: nowTs() }, updatedAt: nowTs() };
    try {
      await db.collection("users").doc(post.ownerUid).collection("entries").doc(post.id).update(update);
      setFeedEntries((prev) => prev.map((p) => {
        if (p.id !== post.id || p.ownerUid !== post.ownerUid) return p;
        const reactions = { ...(p.reactions || {}) };
        if (already) delete reactions[user.uid];
        else reactions[user.uid] = { emoji: REACTION_EMOJI, name: user.displayName || user.email, at: nowTs() };
        return { ...p, reactions };
      }));
    } catch (err) { /* ignore — not worth surfacing an error for a reaction tap */ }
  }

  function commentsCol(ownerUid, entryId) {
    return db.collection("users").doc(ownerUid).collection("entries").doc(entryId).collection("comments");
  }

  async function toggleComments(post) {
    const key = post.ownerUid + "_" + post.id;
    if (openComments === key) { setOpenComments(null); return; }
    setOpenComments(key);
    if (!commentsByEntry[key]) {
      try {
        const snap = await commentsCol(post.ownerUid, post.id).orderBy("createdAt", "asc").limit(50).get();
        setCommentsByEntry((prev) => ({ ...prev, [key]: snap.docs.map((d) => ({ id: d.id, ...d.data() })) }));
      } catch (err) {
        setCommentsByEntry((prev) => ({ ...prev, [key]: [] }));
      }
    }
  }

  async function postComment(post) {
    if (!user || !commentDraft.trim()) return;
    const key = post.ownerUid + "_" + post.id;
    setCommentBusy(true);
    const comment = {
      authorUid: user.uid,
      authorName: user.displayName || user.email,
      text: commentDraft.trim().slice(0, 300),
      createdAt: nowTs(),
    };
    try {
      const ref = await commentsCol(post.ownerUid, post.id).add(comment);
      setCommentsByEntry((prev) => ({ ...prev, [key]: [...(prev[key] || []), { id: ref.id, ...comment }] }));
      setCommentDraft("");
    } catch (err) {
      setFeedError("Couldn't post that comment — try again.");
    }
    setCommentBusy(false);
  }

  const hasNotifications = useMemo(() => {
    if (incomingRequests.length > 0) return true;
    return liveEntries.some((e) => e.reactions && Object.values(e.reactions).some((r) => r && r.at > notifSeenAt));
  }, [incomingRequests, liveEntries, notifSeenAt]);

  // A friend's reaction only ever lands in Firestore, and local entries used to
  // pick it up solely through syncOnSignIn — so the notification dot couldn't
  // appear until you signed out and back in. Poll your own shared sightings
  // instead, on sign-in and every couple of minutes while the app is open.
  async function refreshMyReactions(uid) {
    try {
      const snap = await entriesCol(uid).where("shared", "==", true).limit(50).get();
      const byId = new Map();
      snap.docs.forEach((d) => {
        const data = d.data();
        if (data.reactions) byId.set(d.id, data.reactions);
      });
      if (!byId.size) return;
      const current = entriesRef.current;
      const changed = current.some((e) => {
        const incoming = byId.get(e.id);
        if (!incoming) return false;
        return JSON.stringify(incoming) !== JSON.stringify(e.reactions || null);
      });
      if (!changed) return;
      commitEntries((prev) => prev.map((e) => (byId.has(e.id) ? { ...e, reactions: byId.get(e.id) } : e)));
    } catch (err) { /* not worth surfacing */ }
  }

  React.useEffect(() => {
    if (!user) return;
    refreshMyReactions(user.uid);
    const t = setInterval(() => refreshMyReactions(user.uid), 120000);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user]);

  // Only clears when the Friends view is actually open. It used to fire on any
  // tap of the Account tab, so opening Profile marked feed activity as seen
  // without the user ever looking at it.
  function clearNotifications() {
    const now = nowTs();
    setNotifSeenAt(now);
    try { localStorage.setItem(STORAGE_KEYS.notifSeen, JSON.stringify(now)); } catch (err) { /* ignore */ }
  }

  React.useEffect(() => {
    if (tab === "account" && accountView === "friends") clearNotifications();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tab, accountView]);

  // Your life-list totals, published so friends can compare. Tombstones are
  // already excluded because this reads from lifeList.
  const globalStats = useMemo(
    () => ({ uniqueSpecies: lifeList.uniqueSpecies, totalSightings: lifeList.totalSightings }),
    [lifeList]
  );

  // Species names are published alongside the counts so two people can compare
  // lists. Capped so the profile document stays small.
  const publishedSpeciesList = useMemo(
    () => Array.from(lifeList.species.values()).map((s) => s.species).slice(0, 400),
    [lifeList]
  );

  const leaderboard = useMemo(() => {
    const rows = [{
      uid: user ? user.uid : "you", name: "You", uniqueSpecies: globalStats.uniqueSpecies, totalSightings: globalStats.totalSightings,
      avatar: profileAvatar, bio: profileBio, isYou: true,
    }];
    friends.forEach((f) => rows.push({
      uid: f.uid,
      name: f.displayName || f.email || "Friend",
      uniqueSpecies: (f.stats && f.stats.uniqueSpecies) || 0,
      totalSightings: (f.stats && f.stats.totalSightings) || 0,
      avatar: f.avatar || null,
      bio: f.bio || "",
      isYou: false,
    }));
    return rows.sort((a, b) => b.uniqueSpecies - a.uniqueSpecies);
  }, [user, globalStats, friends, profileAvatar, profileBio]);

  // The two-person view. A leaderboard with two rows in it mostly advertises
  // that nobody's there; a comparison between exactly two people works at the
  // size this app actually is, and says something a ranking can't.
  const friendComparisons = useMemo(() => {
    const mine = Array.from(lifeList.species.values()).map((s) => s.species);
    return friends.map((f) => {
      const theirDisplay = Array.isArray(f.speciesList) ? f.speciesList : null;
      const theirKeys = new Set((theirDisplay || []).map((n) => String(n).trim().toLowerCase()));
      return {
        uid: f.uid,
        name: f.displayName || f.email || "Friend",
        avatar: f.avatar || null,
        hasList: !!theirDisplay,
        theyHave: (theirDisplay || []).filter((n) => !lifeSpeciesNames.has(String(n).trim().toLowerCase())),
        youHave: mine.filter((n) => !theirKeys.has(n.trim().toLowerCase())),
        both: mine.filter((n) => theirKeys.has(n.trim().toLowerCase())),
      };
    });
  }, [friends, lifeList, lifeSpeciesNames]);

  React.useEffect(() => {
    if (!user) return;
    db.collection("users").doc(user.uid).set({
      email: normalizeEmail(user.email),
      displayName: user.displayName || user.email,
      stats: globalStats,
      statsUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true }).catch(() => {});
    socialListDoc(user.uid).set({
      species: publishedSpeciesList,
      updatedAt: nowTs(),
    }).catch(() => {});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, globalStats.uniqueSpecies, globalStats.totalSightings]);

  // ---- celebrations ----
  // Rewritten to say something true about the sighting rather than to pay out
  // for volume. A reward that signals competence or luck survives contact with
  // an activity people already enjoy; one that just counts tends to displace
  // the reason they were doing it. Milestones are still here, but as the
  // fallback rather than the whole vocabulary — and they now track the life
  // list, so they can't un-earn themselves when you switch location.
  function celebrationFor(entry) {
    const key = entry.species.trim().toLowerCase();
    if (lifeSpeciesNames.has(key)) return null;

    const monthIndex = Number(entry.date.slice(5, 7)) - 1;
    const monthName = MONTH_NAMES[monthIndex] || "this month";
    const cat = catMeta(entry.category);
    const catLabel = cat.label.toLowerCase();

    // Something genuinely uncommon for the place and time of year.
    if (homeSeasonalNames && homeSeasonalNames.size > 0 && !homeSeasonalNames.has(key)) {
      return entry.species + " isn't commonly reported around here in " + monthName + " — nice find.";
    }
    // First of its kind on the life list.
    const seenThisCategory = liveEntries.some((e) => e.category === entry.category);
    if (!seenThisCategory) return "First " + catLabel + " on your life list.";
    // First of its kind in this month of the year.
    const seenThisCategoryThisMonth = liveEntries.some(
      (e) => e.category === entry.category && e.date.slice(5, 7) === entry.date.slice(5, 7)
    );
    if (!seenThisCategoryThisMonth) return "First " + catLabel + " you've logged in " + monthName + ".";
    // A round number, as a fallback rather than the headline.
    const next = lifeList.uniqueSpecies + 1;
    const crossed = MILESTONES.find((m) => lifeList.uniqueSpecies < m && next >= m);
    if (crossed) return crossed + " species on your life list.";
    return entry.species + " is new to your life list.";
  }

  function updateForm(field, value) { setForm((f) => ({ ...f, [field]: value })); }

  function handlePhotoChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setPhotoError("");
    resizePhoto(file)
      .then((dataUrl) => updateForm("photo", dataUrl))
      // This used to swallow every failure, so an unsupported file just made
      // the form appear to ignore the photo with no explanation.
      .catch((err) => setPhotoError(err && err.message ? err.message : "That photo couldn't be added."));
    e.target.value = "";
  }

  async function addEntry(e) {
    e.preventDefault();
    if (!form.species.trim()) return;
    // This handler awaits an IndexedDB write before it clears the form, so
    // without a guard a double-tap on "Add sighting" logs the same thing twice
    // under two different ids.
    if (addingEntryRef.current) return;
    addingEntryRef.current = true;
    setAddingEntry(true);
    try {
      await submitEntry();
    } finally {
      addingEntryRef.current = false;
      setAddingEntry(false);
    }
  }

  async function submitEntry() {
    const id = uid();

    // The photo goes to IndexedDB first. If that fails we say so and save the
    // sighting without it, rather than pretending it worked.
    let photoSaved = false;
    if (form.photo) {
      try {
        await setPhotoCached(id, form.photo);
        photoSaved = true;
        setPhotoError("");
      } catch (err) {
        setPhotoError("That photo couldn't be stored, so the sighting was saved without it.");
      }
    }

    const entry = {
      id,
      species: form.species.trim(),
      category: form.category,
      date: form.date || todayStr(),
      time: form.time || "",
      quantity: Math.max(1, Number(form.quantity) || 1),
      location: form.location.trim(),
      note: form.note.trim(),
      lat: form.lat === null || form.lat === undefined ? null : form.lat,
      lon: form.lon === null || form.lon === undefined ? null : form.lon,
      hasPhoto: photoSaved,
      photoUploaded: false,
      locationId: activeLocation.id,
      locationName: activeLocation.name,
      shared: false,
      updatedAt: nowTs(),
    };

    // Worked out before the entry lands, while the life list still reflects
    // everything logged up to this point.
    const celebration = celebrationFor(entry);

    if (!commitEntries((prev) => [entry, ...prev])) {
      // The write was refused, so don't leave an orphaned photo behind.
      if (photoSaved) forgetPhoto(id);
      return;
    }

    if (celebration) {
      setToast(celebration);
      setTimeout(() => setToast(null), 5000);
    }

    if (user) {
      entriesCol(user.uid).doc(id).set(entry).catch(() => {});
      if (photoSaved) {
        photosCol(user.uid).doc(id).set({ data: form.photo, updatedAt: nowTs() })
          .then(() => commitEntries((prev) => prev.map((x) => (x.id === id ? { ...x, photoUploaded: true } : x))))
          .catch(() => { /* picked up by the next sync */ });
      }
    }

    setForm({ ...emptyForm, category: form.category, location: form.location });
    setFormGeoStatus("");
  }

  // Deleting writes a tombstone rather than dropping the record. An absence
  // always lost the merge, so a sighting deleted on one device came straight
  // back from any device that still held a copy.
  function removeEntry(id) {
    if (!window.confirm("Remove this sighting? This can't be undone.")) return;
    const target = entriesRef.current.find((e) => e.id === id);
    const stone = tombstoneFor({ id });
    commitEntries((prev) => prev.map((e) => (e.id === id ? stone : e)));
    if (target && target.hasPhoto) forgetPhoto(id);
    if (user) {
      entriesCol(user.uid).doc(id).set(stone).catch(() => {});
      if (target && target.hasPhoto) photosCol(user.uid).doc(id).delete().catch(() => {});
    }
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // The JSON export is the real backup, so photos are pulled back out of
  // IndexedDB and inlined. Reimporting it restores them.
  async function exportJSON() {
    setExportBusy(true);
    try {
      const live = living(entriesRef.current);
      const withPhotos = await Promise.all(live.map(async (e) => {
        if (!e.hasPhoto) return e;
        const data = await getPhotoCached(e.id);
        return data ? { ...e, photo: data } : e;
      }));
      const blob = new Blob([JSON.stringify(withPhotos, null, 2)], { type: "application/json" });
      triggerDownload(blob, "backyard-field-log.json");
    } catch (err) {
      setImportError("Couldn't build the export — try again.");
    }
    setExportBusy(false);
  }

  // A leading =, +, - or @ makes Excel and Sheets treat a cell as a formula, so
  // a species or note typed as =HYPERLINK("http://evil","x") would execute on
  // open. Prefixing a single quote neutralises it without changing what the
  // reader sees.
  function csvEscape(v) {
    let s = String(v ?? "");
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if (s.includes(",") || s.includes('"') || s.includes("\n")) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  // CSV is for spreadsheets, not for restoring — it can't carry photos. It now
  // at least carries everything else, including the fields the old export
  // silently dropped.
  function exportCSV() {
    const header = ["species", "category", "date", "time", "quantity", "location", "locationName", "lat", "lon", "note", "shared"];
    const rows = living(entriesRef.current).map((e) => header.map((h) => csvEscape(e[h])).join(","));
    const csv = [header.join(","), ...rows].join("\n");
    triggerDownload(new Blob([csv], { type: "text/csv" }), "backyard-field-log.csv");
  }

  // Imports now go through the same merge the cloud sync uses, so re-importing
  // a file is harmless. The old version prepended unconditionally: importing
  // twice produced two records sharing one id, and pushing an older backup
  // could overwrite newer cloud entries at those ids without a word.
  function handleImport(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportError("");
    setImportReport(null);
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("bad format");

        const cleaned = data.filter((d) => d && d.species).map((d) => ({
          id: d.id || uid(),
          species: String(d.species),
          category: CATEGORIES.some((c) => c.id === d.category) ? d.category : "other",
          date: d.date || todayStr(),
          time: d.time || "",
          quantity: Number(d.quantity) || 1,
          location: d.location || "",
          note: d.note || "",
          photo: d.photo || null,
          lat: d.lat === undefined ? null : d.lat,
          lon: d.lon === undefined ? null : d.lon,
          hasPhoto: !!d.hasPhoto,
          photoUploaded: false,
          locationId: d.locationId || activeLocationId,
          locationName: d.locationName || activeLocation.name,
          shared: !!d.shared,
          deletedAt: d.deletedAt || null,
          updatedAt: d.updatedAt || nowTs(),
        }));

        // Any inline photos in the file go straight into IndexedDB.
        const migrated = await migrateInlinePhotos(cleaned, true);
        const incoming = migrated.list.map((c) => {
          const copy = { ...c };
          if (!copy.deletedAt) delete copy.deletedAt;
          if (copy.photo === null) delete copy.photo;
          return copy;
        });

        const before = entriesRef.current;
        const beforeIds = new Set(before.filter((x) => !x.deletedAt).map((x) => x.id));
        const added = incoming.filter((x) => !beforeIds.has(x.id)).length;
        const merged = purgeOldTombstones(mergeById(before, incoming));

        if (!commitEntries(merged)) return;
        setImportReport({ added, skipped: incoming.length - added, total: incoming.length });

        // Upload only what came in, and with a full set rather than a merge:
        // merging a tombstone onto an existing document would leave the old
        // species, note and photo fields in place beside `deletedAt` — quietly
        // reviving content the owner had deleted, still matching the feed's
        // `shared == true` query.
        if (user && incoming.length) {
          const winners = new Map(merged.map((m) => [m.id, m]));
          commitInChunks(incoming.map((c) => (batch) => {
            const payload = { ...(winners.get(c.id) || c) };
            delete payload.photo;
            return batch.set(entriesCol(user.uid).doc(c.id), payload);
          })).catch(() => {});
        }
      } catch (err) {
        setImportError("Couldn't read that file. Import a JSON export from this app.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

      {importError && <p style={styles.errorText}>{importError}</p>}

      {/* The one thing standing between a signed-out iPhone user and a wiped
          log is either an account or a home-screen install, and both used to be

      {!safetyDismissed && !user && liveEntries.length >= 3 && (
        <div style={styles.safetyBanner}>

                </p>
                <div style={{ display: "flex", gap: 8 }}>
                  <button type="button" style={styles.iconButton} onClick={signOutUser}>Sign out</button>
                  <button type="button" style={styles.iconButton} onClick={() => syncOnSignIn(user.uid)}>Sync now</button>
                </div>
              </div>
            ) : (
              <div>
                <div style={styles.authTabRow}>
                  <button
                    type="button"
                    style={{ ...styles.authTabButton, ...(authMode === "signin" ? styles.authTabButtonActive : {}) }}
                    onClick={() => { setAuthMode("signin"); setAuthError(""); }}
                  >Sign in</button>
                  <button
                    type="button"
                    style={{ ...styles.authTabButton, ...(authMode === "signup" ? styles.authTabButtonActive : {}) }}
                    onClick={() => { setAuthMode("signup"); setAuthError(""); }}
                  >Create account</button>
                </div>
                <form onSubmit={handleAuthSubmit}>
                  <div style={styles.formGrid}>
                    {authMode === "signup" && (
                      <Field label="Display name (optional)">
                        <input style={styles.input} value={authDisplayName} onChange={(e) => setAuthDisplayName(e.target.value)} placeholder="e.g. Pax" />
                      </Field>
                    )}
                    <Field label="Email">
                      <input type="email" style={styles.input} value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} required />
                    </Field>
                    <Field label="Password">
                      <input type="password" style={styles.input} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} required minLength={6} />
                    </Field>
                  </div>
                  <button type="submit" style={styles.primaryButtonWide} disabled={authBusy}>
                    {authBusy ? "Working…" : authMode === "signup" ? "Create account" : "Sign in"}
                  </button>
                  {authMode === "signin" && (
                    <button type="button" style={{ ...styles.retryLink, display: "block", marginTop: 10 }} onClick={handleForgotPassword} disabled={authBusy}>
                      Forgot password?
                    </button>
                  )}
                  {authError && <p style={styles.errorText}>{authError}</p>}
                </form>
              </div>
            )}
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Appearance</h3>
            <p style={styles.suggestLabel}>Mode</p>
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <button type="button" style={{ ...styles.modeButton, ...(theme === "light" ? styles.modeButtonActive : {}) }} onClick={() => setTheme("light")}>Light</button>
              <button type="button" style={{ ...styles.modeButton, ...(theme === "dark" ? styles.modeButtonActive : {}) }} onClick={() => setTheme("dark")}>Dark</button>
            </div>
            <p style={styles.suggestLabel}>Theme</p>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              {PALETTES.map((p) => (
                <button
                  key={p.id}
                  type="button"
                  onClick={() => setPalette(p.id)}
                  style={styles.paletteOption}
                  title={p.label}
                >
                  <span style={{ ...styles.paletteSwatch, background: p.swatch, ...(palette === p.id ? styles.paletteSwatchActive : {}) }} />
                  <span style={styles.paletteLabel}>{p.label}</span>
                </button>
              ))}
            </div>
          </div>

          {user && (
            <div style={styles.card}>
              <h3 className="ffont" style={styles.chartTitle}>Your profile</h3>
              <p style={styles.locationNote}>Friends see this photo and bio next to your name on the leaderboard and activity feed.</p>
              <div style={{ display: "flex", gap: 14, alignItems: "center", marginTop: 10 }}>
                <div style={styles.avatarWrap}>
                  {profileAvatar ? <img src={profileAvatar} alt="Your profile" style={styles.avatarImg} /> : <span style={styles.avatarPlaceholder}>{(user.displayName || user.email || "?").slice(0, 1).toUpperCase()}</span>}
                </div>
                <label style={styles.iconButton}>
                  Change photo
                  <input type="file" accept="image/*" onChange={handleAvatarChange} style={{ display: "none" }} />
                </label>
                {profileAvatar && (
                  <button type="button" style={styles.retryLink} onClick={() => setProfileAvatar("")}>Remove</button>
                )}
              </div>
              <div style={{ marginTop: 12 }}>
                <Field label={`Bio (${profileBio.length}/160)`}>
                  <textarea
                    style={{ ...styles.input, minHeight: 60, resize: "vertical" }}
                    value={profileBio}
                    maxLength={160}
                    onChange={(e) => setProfileBio(e.target.value)}
                    placeholder="A line about what you love spotting…"
                  />
                </Field>
              </div>
              <button type="button" style={{ ...styles.primaryButton, marginTop: 10 }} onClick={saveProfile} disabled={profileSaving}>
                {profileSaving ? "Saving…" : profileSaved ? "Saved ✓" : "Save profile"}
              </button>
            </div>
          )}
          </div>
          )}

          {accountView === "friends" && (
          <div>
          {!user && (
            <div style={styles.card}>
              <p style={styles.emptyText}>Sign in from the Profile tab to add friends and see the activity feed.</p>
            </div>
          )}
          {user && (
            <div style={styles.card}>
              <h3 className="ffont" style={styles.chartTitle}>Friends</h3>
              <p style={styles.locationNote}>Add a friend by the email they signed up with, then compare species counts once they've logged sightings of their own.</p>
              <form onSubmit={sendFriendRequest} style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
                <div style={{ flex: "1 1 220px" }}>
                  <Field label="Friend's email">
                    <input type="email" style={styles.input} value={friendEmail} onChange={(e) => setFriendEmail(e.target.value)} placeholder="friend@example.com" required />
                  </Field>
                </div>
                <button type="submit" style={styles.primaryButton} disabled={friendBusy}>{friendBusy ? "Sending…" : "+ Add friend"}</button>
                <button type="button" style={styles.iconButton} onClick={() => refreshSocialData(user.uid)}>Refresh</button>
              </form>
              {friendError && <p style={styles.errorText}>{friendError}</p>}

              {incomingRequests.length > 0 && (
                <div style={{ marginTop: 14 }}>
                  <p style={styles.suggestLabel}>Friend requests</p>
                  {incomingRequests.map((r) => (
                    <div key={r.id} style={styles.friendRequestRow}>
                      <span>{r.fromEmail}</span>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button type="button" style={styles.iconButton} onClick={() => respondToRequest(r.id, true)}>Accept</button>
                        <button type="button" style={styles.iconButton} onClick={() => respondToRequest(r.id, false)}>Decline</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {outgoingRequests.length > 0 && (
                <p style={{ ...styles.suggestLabel, marginTop: 14 }}>
                  Waiting on: {outgoingRequests.map((r) => r.toEmail).join(", ")}
                </p>
              )}

              {/* Comparisons come first. A ranking needs a crowd to mean
                  anything; a comparison between exactly two people works at the
                  size this app actually is, and tells you something a ranking
                  never could — what to go and look for. */}
              {friendComparisons.length > 0 && (
                <div style={{ marginTop: 18 }}>
                  <p style={styles.suggestLabel}>Compare lists</p>
                  {friendComparisons.map((c) => {
                    const open = openFriendUid === c.uid;
                    return (
                      <div key={c.uid} style={styles.compareCard}>
                        <div style={styles.compareHead}>
                          <div style={styles.avatarWrapSmall}>
                            {c.avatar ? <img src={c.avatar} alt="" style={styles.avatarImg} /> : <span style={styles.avatarPlaceholderSmall}>{c.name.slice(0, 1).toUpperCase()}</span>}
                          </div>
                          <span className="ffont" style={styles.compareName}>{c.name}</span>
                          <button
                            type="button"
                            style={styles.iconButton}
                            onClick={() => setOpenFriendUid(open ? null : c.uid)}
                            aria-expanded={open}
                          >
                            {open ? "Hide" : "Show species"}
                          </button>
                        </div>

                        {!c.hasList ? (
                          <p style={styles.emptyText}>
                            {c.name} hasn't opened the app since list sharing was added, so there's nothing to compare yet.
                          </p>
                        ) : (
                          <div style={styles.compareStatRow}>
                            <div style={styles.compareStat}>
                              <span className="mfont" style={styles.compareStatValue}>{c.theyHave.length}</span>
                              <span style={styles.compareStatLabel}>they've seen that you haven't</span>
                            </div>
                            <div style={styles.compareStat}>
                              <span className="mfont" style={styles.compareStatValue}>{c.youHave.length}</span>
                              <span style={styles.compareStatLabel}>you've seen that they haven't</span>
                            </div>
                            <div style={styles.compareStat}>
                              <span className="mfont" style={styles.compareStatValue}>{c.both.length}</span>
                              <span style={styles.compareStatLabel}>you've both found</span>
                            </div>
                          </div>
                        )}

                        {open && c.hasList && (
                          <div style={styles.compareLists}>
                            <div style={{ flex: 1, minWidth: 160 }}>
                              <p style={styles.compareListHead}>On {c.name}'s list, not yours</p>
                              {c.theyHave.length === 0 ? (
                                <p style={styles.emptyText}>Nothing — you've found everything they have.</p>
                              ) : (
                                <div style={styles.compareChipRow}>
                                  {c.theyHave.slice(0, 24).map((n) => <span key={n} style={styles.compareChip}>{n}</span>)}
                                  {c.theyHave.length > 24 && <span style={styles.compareChipMore}>+{c.theyHave.length - 24} more</span>}
                                </div>
                              )}
                            </div>
                            <div style={{ flex: 1, minWidth: 160 }}>
                              <p style={styles.compareListHead}>On yours, not {c.name}'s</p>
                              {c.youHave.length === 0 ? (
                                <p style={styles.emptyText}>Nothing yet.</p>
                              ) : (
                                <div style={styles.compareChipRow}>
                                  {c.youHave.slice(0, 24).map((n) => <span key={n} style={styles.compareChip}>{n}</span>)}
                                  {c.youHave.length > 24 && <span style={styles.compareChipMore}>+{c.youHave.length - 24} more</span>}
                                </div>
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* A two-row leaderboard mostly advertises that nobody's there, so
                  it appears once there are actually people to rank. */}
              {leaderboard.length >= 3 && (
                <div style={{ marginTop: 18 }}>
                  <p style={styles.suggestLabel}>Leaderboard — unique species logged</p>
                  {leaderboard.map((row, i) => (
                    <div
                      key={row.uid}
                      style={{ ...styles.leaderboardRow, ...(row.isYou ? styles.leaderboardRowYou : {}) }}
                    >
                      <span style={styles.leaderboardRank}>{i + 1}</span>
                      <div style={styles.avatarWrapSmall}>
                        {row.avatar ? <img src={row.avatar} alt="" style={styles.avatarImg} /> : <span style={styles.avatarPlaceholderSmall}>{row.name.slice(0, 1).toUpperCase()}</span>}
                      </div>
                      <span style={{ flex: 1, fontWeight: row.isYou ? 700 : 500 }}>{row.name}{row.isYou ? " (you)" : ""}</span>
                      <span className="mfont" style={{ fontSize: 13 }}>{row.uniqueSpecies} species</span>
                      <span className="mfont" style={{ fontSize: 12, color: "var(--text-muted)", width: 90, textAlign: "right" }}>{row.totalSightings} sightings</span>
                    </div>
                  ))}
                  <p style={styles.leaderboardNote}>
                    Counts come from each person's own device and refresh when they next open the app.
                  </p>
                </div>
              )}

              {friends.length === 0 && <p style={{ ...styles.emptyText, marginTop: 14 }}>Add a friend to start comparing lists.</p>}
            </div>
          )}

          {user && friends.length > 0 && (
            <div style={styles.card}>
              <h3 className="ffont" style={styles.chartTitle}>Activity feed</h3>
              <p style={styles.locationNote}>Sightings your friends have chosen to share — mark your own as "Shared" from the Log tab to show up here for them.</p>
              {feedLoading && <p style={styles.emptyText}>Loading…</p>}
              {feedError && <p style={styles.errorText}>{feedError}</p>}
              {!feedLoading && feedEntries.length === 0 && (
                <div style={styles.guideEmptyFiltered}>
                  <span style={{ fontSize: 32, display: "block", marginBottom: 6 }}>🦋</span>
                  Nothing shared yet — check back once a friend shares a sighting.
                </div>
              )}
              {feedEntries.map((post) => {
                const key = post.ownerUid + "_" + post.id;
                const reactions = post.reactions || {};
                const reactionCount = Object.keys(reactions).length;
                const iReacted = user && !!reactions[user.uid];
                const comments = commentsByEntry[key] || [];
                return (
                  <div key={key} style={styles.feedPost}>
                    <div style={styles.feedPostHeader}>
                      <div style={styles.avatarWrapSmall}>
                        {post.ownerAvatar ? <img src={post.ownerAvatar} alt="" style={styles.avatarImg} /> : <span style={styles.avatarPlaceholderSmall}>{post.ownerName.slice(0, 1).toUpperCase()}</span>}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ fontWeight: 700, fontSize: 13.5 }}>{post.ownerName}</span>
                        <span style={{ color: "var(--text-muted)", fontSize: 12.5 }}> spotted <span className="ffont">{post.species}</span></span>
                        <div style={styles.entryMeta}>
                          <span>{post.date}</span>
                          {post.locationName && <span>· {post.locationName}</span>}
                        </div>
                      </div>
                    </div>
                    {post.hasPhoto && (
                      // Reserve the space so the note and buttons below don't
                      // jump when the photo resolves.
                      <div style={styles.feedPhotoSlot}>
                        <FriendPhoto ownerUid={post.ownerUid} entryId={post.id} style={styles.feedPostPhoto} />
                      </div>
                    )}
                    {post.note && <p style={styles.entryNote}>{post.note}</p>}
                    <div style={{ display: "flex", gap: 10, marginTop: 8, alignItems: "center" }}>
                      <button
                        type="button"
                        style={{ ...styles.reactionButton, ...(iReacted ? styles.reactionButtonActive : {}) }}
                        onClick={() => toggleReaction(post)}
                      >
                        🌿 {reactionCount > 0 ? reactionCount : ""}
                      </button>
                      <button type="button" style={styles.retryLink} onClick={() => toggleComments(post)}>
                        {openComments === key ? "Hide comments" : comments.length > 0 || commentsByEntry[key] ? `Comments (${comments.length})` : "Comment"}
                      </button>
                    </div>
                    {openComments === key && (
                      <div style={{ marginTop: 10 }}>
                        {comments.map((c) => (
                          <div key={c.id} style={styles.commentRow}>
                            <strong style={{ fontSize: 12.5 }}>{c.authorName}</strong>{" "}
                            <span style={{ fontSize: 12.5, color: "var(--text-muted)" }}>{c.text}</span>
                          </div>
                        ))}
                        {comments.length === 0 && <p style={styles.emptyText}>No comments yet.</p>}
                        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                          <input
                            style={styles.input}
                            value={commentDraft}
                            onChange={(e) => setCommentDraft(e.target.value)}
                            placeholder="Add a comment…"
                            maxLength={300}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); postComment(post); } }}
                          />
                          <button type="button" style={styles.iconButton} onClick={() => postComment(post)} disabled={commentBusy || !commentDraft.trim()}>Post</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          </div>
          )}

          {accountView === "data" && (
          <div>
          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Your data</h3>
            <p style={styles.locationNote}>
              {user
                ? "Everything you log — sightings, photos, and saved locations — is saved to this browser and backed up to your account, so it'll follow you if you sign in somewhere else. Export a backup regularly anyway, just in case."
                : "Everything you log — sightings, photos, and saved locations — stays in this browser's storage only for now. Sign in above to back it up to your account and access it from other devices. Export a backup regularly if it matters to you."}
            </p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button type="button" style={styles.iconButton} onClick={exportJSON} disabled={exportBusy}>
                {exportBusy ? "Preparing…" : "Export backup (JSON)"}
              </button>
              <button type="button" style={styles.iconButton} onClick={exportCSV}>Export for spreadsheets (CSV)</button>
            </div>
            <p style={{ ...styles.suggestLabel, marginTop: 10, marginBottom: 0 }}>
              The JSON export includes your photos and can be imported back. CSV is for opening in a spreadsheet — it can't carry photos, so it isn't a backup.
            </p>
            {importReport && (
              <p style={{ ...styles.suggestLabel, marginTop: 8, marginBottom: 0, color: "var(--text)" }}>
                Imported {importReport.added} new sighting{importReport.added === 1 ? "" : "s"}
                {importReport.skipped > 0 ? ", skipped " + importReport.skipped + " already in your log" : ""}.
              </p>
            )}
          </div>

          <div style={styles.card}>
            <h3 className="ffont" style={styles.chartTitle}>Clear sightings by time frame</h3>
            <p style={styles.locationNote}>
              Remove logged sightings for <strong>{activeLocation ? activeLocation.name : "this location"}</strong> within a specific month or year. Locations, photos of other months/years, and app settings are left alone.
            </p>
            <div style={styles.formGrid}>
              <Field label="Time frame">
                <select style={styles.input} value={resetScope} onChange={(e) => setResetScope(e.target.value)}>
                  <option value="month">A specific month</option>
                  <option value="year">A specific year</option>
                  <option value="all">All time, this location</option>
                </select>
              </Field>
              {resetScope === "month" && (
                <Field label="Month">
                  <input type="month" style={styles.input} value={resetMonth} onChange={(e) => setResetMonth(e.target.value)} />
                </Field>
              )}
              {resetScope === "year" && (
                <Field label="Year">
                  <select style={styles.input} value={resetYear} onChange={(e) => setResetYear(e.target.value)}>
                    {availableYears.map((y) => <option key={y} value={y}>{y}</option>)}
                  </select>
                </Field>
              )}
            </div>
            <p style={styles.suggestLabel}>
              {resetPreviewCount} sighting{resetPreviewCount === 1 ? "" : "s"} will be deleted.
            </p>
            <button
              type="button"
              style={{ ...styles.dangerButton, ...(resetPreviewCount === 0 ? styles.dangerButtonDisabled : {}) }}
              disabled={resetPreviewCount === 0}
              onClick={handleScopedReset}
            >
              Delete {resetPreviewCount > 0 ? resetPreviewCount : ""} sighting{resetPreviewCount === 1 ? "" : "s"}
            </button>
          </div>

          <div style={styles.dangerCard}>
            <h3 className="ffont" style={{ ...styles.chartTitle, color: "#A8455F" }}>Danger zone</h3>
            <p style={styles.locationNote}>
              Permanently erase every sighting, photo, and saved location across your entire log — every time frame, every location. This can't be undone; export a backup first if you're not sure.
            </p>
            <Field label='Type "RESET" to confirm'>
              <input style={styles.input} value={confirmResetText} onChange={(e) => setConfirmResetText(e.target.value)} placeholder="RESET" />
            </Field>
            <button
              type="button"
              style={{ ...styles.dangerButtonWide, ...(confirmResetText.trim().toUpperCase() !== "RESET" ? styles.dangerButtonDisabled : {}) }}
              disabled={confirmResetText.trim().toUpperCase() !== "RESET"}
              onClick={resetAllData}
            >
              Reset all data
            </button>
          </div>
          </div>
          )}
        </div>
      )}
    </div>
  );
}

const styles = {
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12, marginBottom: 20 },
  eyebrow: { margin: 0, fontSize: 11.5, letterSpacing: "0.08em", color: "#1F8A68", fontWeight: 700 },
  title: { margin: "4px 0 0", fontSize: 32, fontWeight: 700, color: "var(--text)" },
  headerActions: { display: "flex", gap: 8, alignItems: "center" },
  iconButton: { display: "flex", alignItems: "center", gap: 6, background: "var(--btn-bg)", border: "1.5px solid var(--btn-border)", borderRadius: 10, padding: "8px 14px", fontSize: 13, fontWeight: 600, color: "var(--text)" },
  primaryButton: { display: "flex", alignItems: "center", gap: 6, background: "var(--accent)", border: "1.5px solid var(--accent)", borderRadius: 10, padding: "8px 16px", fontSize: 13, color: "var(--accent-contrast)", fontWeight: 700 },
  primaryButtonWide: { display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "var(--accent)", border: "none", borderRadius: 10, padding: "12px 16px", fontSize: 14, color: "var(--accent-contrast)", fontWeight: 700, marginTop: 14, width: "100%" },
  errorText: { color: "#A8455F", fontSize: 13, marginTop: -10, marginBottom: 12, fontWeight: 600 },
  statsRow: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 10, marginBottom: 12 },
  statCard: { position: "relative", borderRadius: 14, padding: "14px 16px", overflow: "hidden" },
  statIconWatermark: { position: "absolute", top: -6, right: -6, opacity: 0.14, transform: "scale(3.2)", pointerEvents: "none" },
  statIconBadge: { width: 30, height: 30, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 8 },
  statLabel: { margin: 0, fontSize: 11.5, fontWeight: 700 },
  statValue: { margin: "4px 0 0", fontSize: 26 },
  statProgressTrack: { marginTop: 10, height: 5, borderRadius: 999, background: "var(--border-soft)", overflow: "hidden" },
  statProgressFill: { height: "100%", borderRadius: 999, transition: "width .3s ease" },
  statProgressLabel: { margin: "5px 0 0", fontSize: 10.5, fontWeight: 600, color: "var(--text-muted)" },
  badgeRow: { display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 20 },
  categoryCollectionRow: { display: "flex", flexWrap: "wrap", gap: 8, marginTop: 12 },
  categoryCollectionChip: { display: "flex", alignItems: "center", gap: 6, padding: "7px 11px", borderRadius: 10, border: "1.5px solid var(--border)", background: "var(--card-bg-soft)" },
  categoryCollectionLabel: { fontSize: 12, fontWeight: 600 },
  badgePill: { fontSize: 11, fontWeight: 700, padding: "4px 9px", borderRadius: 999, border: "1.5px solid var(--border)", color: "var(--text-dim)", background: "var(--card-bg)" },
  badgePillEarned: { color: "#FFFFFF", background: "#1F8A68", borderColor: "#1F8A68" },
  tabs: { display: "flex", gap: 4, background: "var(--tabs-bg)", padding: 4 },
  tabButton: { display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "none", padding: "9px 16px", fontSize: 13.5, color: "var(--text-muted)", fontWeight: 600, borderRadius: 8 },
  tabBadgeDot: { position: "absolute", top: 4, right: 4, width: 8, height: 8, borderRadius: "50%", background: "#C1552F", border: "1.5px solid var(--card-bg)" },
  card: { background: "var(--card-bg)", border: "1.5px solid var(--border)", borderRadius: 16, padding: 16, marginBottom: 16 },
  formToggle: { display: "flex", alignItems: "center", gap: 8, width: "100%", background: "none", border: "none", padding: 0, color: "var(--text)" },
  form: { marginTop: 14 },
  formGrid: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12 },
  field: { display: "flex", flexDirection: "column", gap: 5 },
  fieldLabel: { fontSize: 11.5, color: "var(--text-muted)", fontWeight: 600 },
  suggestWrap: { marginTop: 12 },
  suggestLabel: { fontSize: 11.5, color: "var(--text-muted)", fontWeight: 600, display: "block", marginBottom: 6 },
  previewWrap: { marginTop: 14 },
  hoverPopup: {
    position: "absolute", top: "calc(100% + 8px)", left: "50%", transform: "translateX(-50%)", zIndex: 30,
    width: 232, background: "var(--card-bg)", border: "2px solid var(--border)", borderRadius: 18,
    padding: 12, textAlign: "center", boxShadow: "0 10px 30px var(--shadow)",
  },
  hoverImageWrap: { width: 184, height: 184, borderRadius: 16, background: "var(--border-soft)", overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 10px" },
  hoverImage: { width: "100%", height: "100%", objectFit: "cover" },
